              # its state from HA when this page opens, after a button press and
              # at the end of a track; media_draw / media_tick fill the widgets
              # and count the progress locally in between.
              # Top to bottom: 360 px album art, title, artist, progress bar with
              # times, prev / play / next, volume.
              # =====================================================================
              - obj:
                  styles: cell_style
                  scrollable: false
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 0
                  grid_cell_column_span: 1
                  grid_cell_row_span: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  widgets:
                    - obj:
                        id: card_media
                        styles: card_style
                        width: 100%
                        height: 100%
                        scrollable: false
                        # Blue glass: lighter at the top, a brighter blue edge.
                        bg_color: 0x23335E
                        bg_grad_color: 0x0F1628
                        bg_grad_dir: VER
                        bg_opa: 70%
                        border_color: 0x4A64B8
                        widgets:
                          # Album art, with a vinyl record behind it for when there
                          # is no (JPEG) art.
                          - obj:
                              align: TOP_MID
                              y: 32
                              width: 360
                              height: 360
                              radius: 20
                              bg_color: 0x1B2A55
                              bg_grad_color: 0x121A30
                              bg_grad_dir: VER
                              border_color: 0x3A4F80
                              border_width: 1
                              pad_all: 0
                              clip_corner: true
                              scrollable: false
                              widgets:
                                - obj:
                                    align: CENTER
                                    width: 312
                                    height: 312
                                    radius: 156
                                    bg_color: 0x2563EB
                                    bg_grad_color: 0x9333EA
                                    bg_grad_dir: VER
                                    border_color: 0x1E293B
                                    border_width: 1
                                    scrollable: false
                                - obj:      # groove ring
                                    align: CENTER
                                    width: 210
                                    height: 210
                                    radius: 105
                                    bg_opa: TRANSP
                                    border_color: 0x93C5FD
                                    border_opa: 40%
                                    border_width: 1
                                    scrollable: false
                                - obj:      # label
                                    align: CENTER
                                    width: 108
                                    height: 108
                                    radius: 54
                                    bg_color: 0x1E2A44
                                    border_color: 0x0F172A
                                    border_width: 2
                                    scrollable: false
                                - obj:      # spindle hole
                                    align: CENTER
                                    width: 20
                                    height: 20
                                    radius: 10
                                    bg_color: 0x0B1018
                                    border_width: 0
                                - image:
                                    id: media_art
                                    src: media_art_img
                                    align: CENTER
                                    hidden: true
                          # Title / artist use music_title_font (22 px, with
                          # Chinese); colour sets them apart. One line each, fixed
                          # height: a long title scrolls sideways instead of
                          # wrapping onto the artist line.
                          - label:
                              id: media_title_label
                              align: TOP_MID
                              y: 412
                              width: 560
                              height: 30
                              text: "Nothing playing"
                              text_font: music_title_font
                              text_color: 0xFFFFFF
                              text_align: CENTER
                              long_mode: SCROLL_CIRCULAR
                          - label:
                              id: media_artist_label
                              align: TOP_MID
                              y: 448
                              width: 560
                              height: 30
                              text: ""
                              text_font: music_title_font
                              text_color: 0x9DB4FF
                              text_align: CENTER
                              long_mode: DOT
                          # Progress bar (x 32-592, the same span as the volume
                          # bar), elapsed / duration under its two ends. Drag and
                          # release to seek.
                          - slider:
                              id: media_seek_slider
                              x: 32
                              y: 500
                              width: 560
                              height: 6
                              min_value: 0
                              max_value: 1000
                              value: 0
                              bg_color: 0x2A3550
                              bg_opa: COVER
                              radius: 3
                              indicator:
                                bg_color: 0x3B82F6
                                bg_grad_color: 0xC4B5FD
                                bg_grad_dir: HOR
                                radius: 3
                              knob:
                                bg_color: 0xFFFFFF
                                pad_all: 4
                                radius: 100
                              on_release:
                                - if:
                                    condition:
                                      lambda: |-
                                        return id(media_duration) > 0 &&
                                               id(media_entity).state.rfind("media_player.", 0) == 0;
                                    then:
                                      - lambda: |-
                                          id(media_pos) = x / 1000.0f * id(media_duration);
                                          id(media_pos_at) = id(my_time).now().timestamp;
                                      - homeassistant.action:
                                          action: media_player.media_seek
                                          data:
                                            entity_id: !lambda 'return id(media_entity).state;'
                                            seek_position: !lambda |-
                                              char buf[16];
                                              snprintf(buf, sizeof(buf), "%.1f", id(media_pos));
                                              return std::string(buf);
                                      - script.execute: media_tick
                          - label:
                              id: media_elapsed_label
                              x: 32
                              y: 516
                              width: 80
                              text: "--:--"
                              text_align: LEFT
                              text_font: font_small
                              text_color: 0x9DB4FF
                          - label:
                              id: media_duration_label
                              x: 512
                              y: 516
                              width: 80
                              text: "--:--"
                              text_align: RIGHT
                              text_font: font_small
                              text_color: 0x9DB4FF
                          # Speaker choice: opens media_speaker_picker with the
                          # ${media_speaker_select_entity} options.
                          - button:
                              id: media_speaker_btn
                              styles: round_btn
                              align: TOP_MID
                              x: -232
                              y: 556
                              width: 84
                              height: 84
                              bg_color: 0x1A2333
                              border_color: 0x2F3B52
                              border_width: 1
                              on_click:
                                - if:
                                    condition:
                                      lambda: return !lv_obj_has_flag(id(media_speaker_picker), LV_OBJ_FLAG_HIDDEN);
                                    then:
                                      - lvgl.widget.hide: media_speaker_picker
                                    else:
                                      - script.execute: media_speakers_show
                              widgets:
                                - label: {align: CENTER, text: "\U000F0D38", text_font: font_mdi_36, text_color: 0x9DB4FF}
                          # Controls, centred under the progress bar.
                          - button:
                              id: media_prev_btn
                              styles: round_btn
                              align: TOP_MID
                              x: -112
                              y: 566
                              width: 64
                              height: 64
                              bg_color: 0x1A2333
                              border_color: 0x2F3B52
                              border_width: 1
                              on_click:
                                - script.execute:
                                    id: media_command
                                    service: media_player.media_previous_track
                              widgets:
                                - label: {align: CENTER, text: "\U000F04AE", text_font: font_mdi_36, text_color: 0xFFFFFF}
                          # Play / pause: glowing blue-purple ring like the mockup.
                          - button:
                              id: media_play_btn
                              styles: round_btn
                              align: TOP_MID
                              y: 556
                              width: 84
                              height: 84
                              bg_color: 0x141B2B
                              border_color: 0x8B7CF6
                              border_width: 3
                              shadow_color: 0x6366F1
                              shadow_width: 20
                              shadow_opa: 50%
                              on_click:
                                - if:
                                    # Empty queue (no track loaded, whatever the state):
                                    # start the default playlist instead of play/pause.
                                    condition:
                                      lambda: return id(media_content_id).empty() && id(media_title).empty();
                                    then:
                                      - script.execute: media_play_default
                                    else:
                                      # Track loaded: pause if playing, otherwise resume it
                                      # (also from idle). Show the new state at once; the
                                      # next poll confirms it.
                                      - lambda: |-
                                          const time_t now = id(my_time).now().timestamp;
                                          const bool playing = id(media_state) == "playing";
                                          if (playing) {
                                            if (id(media_pos_at) > 0) id(media_pos) += now - id(media_pos_at);
                                            id(media_state) = "paused";
                                          } else {
                                            id(media_state) = "playing";
                                          }
                                          id(media_pos_at) = now;
                                      - script.execute: media_draw
                                      - script.execute:
                                          id: media_command
                                          service: !lambda 'return id(media_state) == "playing" ? "media_player.media_play" : "media_player.media_pause";'
                              widgets:
                                - label: {id: media_play_icon, align: CENTER, text: "\U000F040A", text_font: font_mdi_36, text_color: 0xFFFFFF}
                          - button:
                              id: media_next_btn
                              styles: round_btn
                              align: TOP_MID
                              x: 112
                              y: 566
                              width: 64
                              height: 64
                              bg_color: 0x1A2333
                              border_color: 0x2F3B52
                              border_width: 1
                              on_click:
                                - script.execute:
                                    id: media_command
                                    service: media_player.media_next_track
                              widgets:
                                - label: {align: CENTER, text: "\U000F04AD", text_font: font_mdi_36, text_color: 0xFFFFFF}
                          # Volume along the bottom: speaker icon and a slider
                          # ending with the progress bar (x 592). Release sets
                          # the player volume.
                          - label:
                              x: 32
                              y: 664
                              text: "\U000F057E"      # volume-high
                              text_font: font_mdi_24
                              text_color: 0x9DB4FF
                          - slider: # Volume Slider
                              id: media_volume_slider
                              x: 63
                              y: 660
                              width: 524
                              height: 36
                              min_value: 0
                              max_value: 100
                              adv_hittest: true
                              gesture_bubble: true
                              value: 0
                              bg_color: 0x99ade0
                              bg_opa: COVER
                              radius: 13
                              indicator:
                                bg_color: 0x6f7bdc
                                bg_grad_color: 0xef125f
                                bg_grad_dir: HOR
                                radius: 13
                              on_single_click:
                                - delay: 100ms
                                - if:
                                    condition:
                                      lambda: return id(media_entity).state.rfind("media_player.", 0) == 0;
                                    then:
                                      - lambda: id(media_volume) = x / 100.0f;
                                      - homeassistant.action:
                                          action: media_player.volume_set
                                          data:
                                            entity_id: !lambda 'return id(media_entity).state;'
                                            volume_level: !lambda |-
                                              char buf[8];
                                              snprintf(buf, sizeof(buf), "%.2f", id(media_volume));
                                              return std::string(buf);
                              on_release:
                                - delay: 100ms
                                - if:
                                    condition:
                                      lambda: return id(media_entity).state.rfind("media_player.", 0) == 0;
                                    then:
                                      - lambda: id(media_volume) = x / 100.0f;
                                      - homeassistant.action:
                                          action: media_player.volume_set
                                          data:
                                            entity_id: !lambda 'return id(media_entity).state;'
                                            volume_level: !lambda |-
                                              char buf[8];
                                              snprintf(buf, sizeof(buf), "%.2f", id(media_volume));
                                              return std::string(buf);
                          # Speaker picker over the album art: one row per
                          # ${media_speaker_select_entity} option, built by
                          # media_speakers_show (the current player highlighted).
                          # Declared last so it sits on top of the card.
                          - obj:
                              id: media_speaker_picker
                              align: TOP_MID
                              y: 32
                              width: 440
                              height: 520
                              hidden: true
                              radius: 14
                              bg_color: 0x151D2B
                              border_color: 0x4A64B8
                              border_width: 1
                              shadow_color: 0x000000
                              shadow_width: 24
                              shadow_opa: 60%
                              pad_all: 0
                              scrollable: false
                              widgets:
                                - label:
                                    x: 20
                                    y: 16
                                    text: "Speaker"
                                    text_font: font_body
                                    text_color: 0xFFFFFF
                                - button:
                                    align: TOP_RIGHT
                                    x: -8
                                    y: 6
                                    width: 44
                                    height: 44
                                    bg_opa: TRANSP
                                    border_width: 0
                                    shadow_width: 0
                                    on_click:
                                      - lvgl.widget.hide: media_speaker_picker
                                    widgets:
                                      - label: {align: CENTER, text: "\U000F0156", text_font: font_mdi_24, text_color: 0xA7B2C4}
                                # Rows inherit the font and colour from here.
                                # Its rows are added at runtime, so the column
                                # layout is set there too (media_speakers_show):
                                # ESPHome only takes a layout with YAML widgets.
                                - obj:
                                    id: media_speaker_list
                                    x: 12
                                    y: 58
                                    width: 416
                                    height: 450
                                    bg_opa: TRANSP
                                    border_width: 0
                                    pad_all: 0
                                    text_font: font_body
                                    text_color: 0xFFFFFF
                                    scrollable: true
                                    scrollbar_mode: "active"

    # ==================================================================
    # CALENDAR: this month and next from the three HA calendars
    # Same frame as the Energy page: "< Home" and the title. Left: one month
    # grid per month (a dot per calendar for one-day events, a band along the
    # bottom of each day for longer ones such as school terms). Right: the events from today, by
    # day. The grids and the list are built by calendar_draw.
    # ==================================================================
    - id: calendar_page
      bg_color: 0x0B1018
      scrollable: false
      on_load:
        - script.execute: calendar_fetch
      on_swipe_right:
        - lvgl.page.show:
            id: home_page
            animation: MOVE_RIGHT
            time: 250ms
      widgets:
        - button:
            id: calendar_page_back_btn
            styles: scene_btn
            x: 16
            y: 14
            width: 120
            height: 48
            on_click:
              - lvgl.page.show:
                  id: home_page
                  animation: MOVE_RIGHT
                  time: 250ms
            widgets:
              - label: {align: CENTER, text: "<  Home", text_font: font_body, text_color: 0xFFFFFF}
        - label:
            align: TOP_MID
            y: 22
            text: "Calendar"
            text_font: font_ui_medium
            text_color: 0xFFFFFF

        # This month (top) and next month (bottom): a 24 px weekday row and
        # up to 6 weeks of 76 x 46 px days, Monday first.
        - obj:
            styles: card_style
            x: 16
            y: 72
            width: 560
            height: 356
            scrollable: false
            widgets:
              - label:
                  id: cal_title_0
                  x: 20
                  y: 12
                  text: ""
                  text_font: font_ui_medium
                  text_color: 0xFFFFFF
              - obj:
                  id: cal_grid_0
                  x: 14
                  y: 48
                  width: 532
                  height: 300
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  text_font: font_small_18
        - obj:
            styles: card_style
            x: 16
            y: 436
            width: 560
            height: 356
            scrollable: false
            widgets:
              - label:
                  id: cal_title_1
                  x: 20
                  y: 12
                  text: ""
                  text_font: font_ui_medium
                  text_color: 0xFFFFFF
              - obj:
                  id: cal_grid_1
                  x: 14
                  y: 48
                  width: 532
                  height: 300
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  text_font: font_small_18

        # Upcoming events, with the calendar colours (as in calendar_draw).
        - obj:
            styles: card_style
            x: 592
            y: 72
            width: 672
            height: 720
            scrollable: false
            widgets:
              - label:
                  x: 20
                  y: 12
                  text: "Upcoming"
                  text_font: font_ui_medium
                  text_color: 0xFFFFFF
              - obj:
                  align: TOP_RIGHT
                  x: -20
                  y: 16
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    pad_column: 8
                  widgets:
                    - obj: {width: 12, height: 12, radius: 6, border_width: 0, bg_color: 0x4CAF50}
                    - label: {text: "${calendar_bins_name}   ", text_font: font_small_18, text_color: 0xC9D2DE}
                    - obj: {width: 12, height: 12, radius: 6, border_width: 0, bg_color: 0x5A87FA}
                    - label: {text: "${calendar_personal_name}   ", text_font: font_small_18, text_color: 0xC9D2DE}
                    - obj: {width: 12, height: 12, radius: 6, border_width: 0, bg_color: 0xE48629}
                    - label: {text: "${calendar_school_name}", text_font: font_small_18, text_color: 0xC9D2DE}
              - obj:
                  id: cal_event_list
                  x: 12
                  y: 56
                  width: 648
                  height: 652
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  text_font: font_body
                  text_color: 0xFFFFFF
                  scrollable: true
                  scrollbar_mode: "active"

    # ==================================================================
    # INTERCOM: the VoIP intercom card; shown automatically when a call comes in
    # Same frame as the Security page: "< Home", the title, and a grid of
    # cards below the header (y 64-800).
    # ==================================================================
    - id: intercom_page
      bg_color: 0x0B1018
      scrollable: false
      on_swipe_right:
        - lvgl.page.show:
            id: home_page
            animation: MOVE_RIGHT
            time: 250ms
      widgets:
        - button:
            id: intercom_page_back_btn
            styles: scene_btn
            x: 16
            y: 14
            width: 120
            height: 48
            on_click:
              - lvgl.page.show:
                  id: home_page
                  animation: MOVE_RIGHT
                  time: 250ms
            widgets:
              - label: {align: CENTER, text: "<  Home", text_font: font_body, text_color: 0xFFFFFF}
        - label:
            align: TOP_MID
            y: 22
            text: "Intercom"
            text_font: font_ui_medium
            text_color: 0xFFFFFF
        - obj:
            x: 0
            y: 64
            width: 1280
            height: 736
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            pad_all: 4
            scrollable: false
            layout:
              type: grid
              grid_rows: [FR(1), FR(1), FR(1)]
              grid_columns: [FR(1), FR(1), FR(1)]
              pad_row: 0
              pad_column: 0
            widgets:
              # =====================================================================
              # 5. INTERCOM                        col 11 span 2 | row 1 span 5
              # =====================================================================
              - obj:
                  styles: cell_style
                  scrollable: false
                  grid_cell_column_pos: 1
                  grid_cell_row_pos: 1
                  grid_cell_column_span: 1
                  grid_cell_row_span: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  widgets:
                    # VoIP panel. Sized by the grid cell (about 412x230); the call-state
                    # groups fill the card and update_call_tile shows one at a time.
                    - obj:
                        id: voip_tile
                        styles: card_style
                        width: 100%
                        height: 100%
                        scrollable: false
                        scrollbar_mode: "off"
                        clip_corner: true
                        widgets:
                          - label:
                              styles: icon_24
                              x: 14
                              y: 10
                              text: "\U000F0869"
                          - label:
                              styles: title_text
                              x: 48
                              y: 8
                              text: "Intercom"

                          # ---- idle: contact browser ----
                          - obj:
                              id: call_idle_group
                              align: TOP_RIGHT
                              width: 100%
                              height: 100%
                              bg_opa: TRANSP
                              border_width: 0
                              radius: 0
                              pad_all: 0
                              scrollable: false
                              scrollbar_mode: "off"
                              widgets:
                                - label:
                                    id: call_idle_header_label
                                    align: TOP_RIGHT
                                    x: -14
                                    y: 44
                                    text: "Keypad"
                                    text_color: 0x8DAEFF
                                    text_font: font_small
                                    clickable: true
                                    gesture_bubble: false
                                    on_click:
                                      - script.execute: show_voip_keypad
                                - obj:
                                    id: call_idle_header_rule
                                    align: TOP_RIGHT
                                    x: -14
                                    y: 64
                                    width: 54
                                    height: 2
                                    bg_color: 0x8DAEFF
                                    border_width: 0
                                    radius: 1
                                - label:
                                    id: call_idle_peer_label
                                    align: TOP_MID
                                    y: 80
                                    width: 165
                                    text: "-"
                                    text_color: 0xFFFFFF
                                    text_font: font_small_18
                                    text_align: CENTER
                                    long_mode: DOT
                                - label:
                                    id: call_idle_contacts_label
                                    align: TOP_MID
                                    y: 108
                                    text: "Contacts: 0"
                                    text_color: 0x8995A7
                                    text_font: font_small
                                - label:
                                    id: call_idle_hint_label
                                    align: TOP_MID
                                    y: 134
                                    width: 165
                                    text: "Swipe to browse"
                                    text_color: 0x778397
                                    text_font: font_small
                                    text_align: CENTER
                                    long_mode: DOT
                                - obj:
                                    id: call_idle_swipe_area
                                    align: TOP_MID
                                    y: 74
                                    width: 100%
                                    height: 86
                                    bg_opa: TRANSP
                                    border_width: 0
                                    scrollable: false
                                    clickable: true
                                    gesture_bubble: false
                                    on_swipe_left:
                                      - voip_stack.next_contact:
                                      - script.execute: update_ic_idle_labels
                                    on_swipe_right:
                                      - voip_stack.prev_contact:
                                      - script.execute: update_ic_idle_labels
                                - button:
                                    id: call_button_widget
                                    align: BOTTOM_MID
                                    y: -12
                                    width: 78
                                    height: 58
                                    bg_color: 0x43A982
                                    radius: 9
                                    on_click:
                                      - voip_stack.call_toggle:
                                    widgets:
                                      - label:
                                          align: CENTER
                                          text: "\U000F03F2"
                                          text_color: 0xFFFFFF
                                          text_font: font_action_icon

                          # ---- idle: dial keypad (slides in over the contact browser) ----
                          - obj:
                              id: call_keypad_group
                              align: TOP_RIGHT
                              width: 100%
                              height: 100%
                              bg_color: 0x151D2B
                              border_width: 0
                              radius: 0
                              pad_all: 0
                              scrollable: false
                              clickable: true
                              gesture_bubble: false
                              hidden: true
                              widgets:
                                - label:
                                    id: call_keypad_value_label
                                    align: TOP_LEFT
                                    x: 8
                                    y: 12
                                    width: 92
                                    text: "Enter number"
                                    text_color: 0xFFFFFF
                                    text_font: font_small
                                    long_mode: DOT
                                - label:
                                    id: call_keypad_header_label
                                    align: TOP_RIGHT
                                    x: -14
                                    y: 12
                                    text: "Contacts"
                                    text_color: 0x8DAEFF
                                    text_font: font_small
                                    clickable: true
                                    gesture_bubble: false
                                    on_click:
                                      - script.execute: hide_voip_keypad
                                - obj:
                                    id: call_keypad_header_rule
                                    align: TOP_RIGHT
                                    x: -14
                                    y: 32
                                    width: 66
                                    height: 2
                                    bg_color: 0x8DAEFF
                                    border_width: 0
                                    radius: 1
                                - buttonmatrix:
                                    id: call_keypad_matrix
                                    align: TOP_MID
                                    y: 38
                                    width: 169
                                    height: 138
                                    bg_opa: TRANSP
                                    border_width: 0
                                    pad_all: 0
                                    pad_row: 6
                                    pad_column: 6
                                    gesture_bubble: true
                                    items:
                                      bg_color: 0x202B3B
                                      text_color: 0xFFFFFF
                                      text_font: font_body
                                      radius: 8
                                    rows:
                                      - buttons:
                                          - text: "1"
                                          - text: "2"
                                          - text: "3"
                                      - buttons:
                                          - text: "4"
                                          - text: "5"
                                          - text: "6"
                                      - buttons:
                                          - text: "7"
                                          - text: "8"
                                          - text: "9"
                                      - buttons:
                                          - text: "*"
                                          - text: "0"
                                          - text: "#"
                                    on_click:
                                      - lambda: |-
                                          static constexpr char KEYS[] = "123456789*0#";
                                          if (x >= 12 || id(voip_dial_buffer).size() >= 32) return;
                                          id(voip_dial_buffer).push_back(KEYS[x]);
                                          lv_label_set_text(id(call_keypad_value_label), id(voip_dial_buffer).c_str());
                                - button:
                                    align: BOTTOM_LEFT
                                    x: 8
                                    y: -8
                                    width: 52
                                    height: 42
                                    bg_color: 0x202B3B
                                    radius: 8
                                    on_click:
                                      - lambda: |-
                                          id(voip_dial_buffer).clear();
                                          lv_label_set_text(id(call_keypad_value_label), "Enter number");
                                    widgets:
                                      - label:
                                          align: CENTER
                                          text: "CLEAR"
                                          text_color: 0xDCE3ED
                                          text_font: font_small
                                - button:
                                    align: BOTTOM_MID
                                    y: -8
                                    width: 60
                                    height: 42
                                    bg_color: 0x43A982
                                    radius: 8
                                    on_click:
                                      - if:
                                          condition:
                                            lambda: return !id(voip_dial_buffer).empty();
                                          then:
                                            - voip_stack.call:
                                                target: !lambda 'return id(voip_dial_buffer);'
                                            - lambda: |-
                                                id(voip_dial_buffer).clear();
                                                lv_label_set_text(id(call_keypad_value_label), "Enter number");
                                    widgets:
                                      - label:
                                          align: CENTER
                                          text: "\U000F03F2"
                                          text_color: 0xFFFFFF
                                          text_font: font_mdi_24
                                - button:
                                    align: BOTTOM_RIGHT
                                    x: -8
                                    y: -8
                                    width: 52
                                    height: 42
                                    bg_color: 0x202B3B
                                    radius: 8
                                    on_click:
                                      - lambda: |-
                                          if (!id(voip_dial_buffer).empty()) id(voip_dial_buffer).pop_back();
                                          lv_label_set_text(id(call_keypad_value_label), id(voip_dial_buffer).empty()
                                              ? "Enter number" : id(voip_dial_buffer).c_str());
                                    widgets:
                                      - label:
                                          align: CENTER
                                          text: "DEL"
                                          text_color: 0xDCE3ED
                                          text_font: font_small

                          # ---- incoming call ----
                          - obj:
                              id: call_ringing_in_group
                              align: TOP_RIGHT
                              width: 100%
                              height: 100%
                              bg_color: 0x2B1A22
                              border_width: 0
                              radius: 0
                              pad_all: 0
                              scrollable: false
                              hidden: true
                              widgets:
                                - label:
                                    align: TOP_MID
                                    y: 14
                                    text: "Incoming call"
                                    text_color: 0xE47B86
                                    text_font: font_ui_medium
                                - label:
                                    id: call_ringing_in_peer_label
                                    align: CENTER
                                    y: -20
                                    width: 165
                                    text: ""
                                    text_color: 0xFFFFFF
                                    text_font: font_small_18
                                    text_align: CENTER
                                    long_mode: DOT
                                - button:
                                    align: BOTTOM_LEFT
                                    x: 8
                                    y: -14
                                    width: 80
                                    height: 56
