                        scrollable: false
                        widgets:
                          - label: {styles: icon_24, x: 10, y: 8, text: "\U000F0599"}
                          - label: {x: 42, y: 8, text: "Outdoor", text_font: font_small, text_color: 0xFFFFFF}
                          - label:
                              id: temp_outdoor_label
                              align: BOTTOM_LEFT
                              x: 10
                              y: -6
                              text: "--.-°"
                              text_font: font_title
                              text_color: 0xFFFFFF
                    - obj:          # Humidity
                        styles: tile_style
                        x: 197
                        y: 138
                        width: 173
                        height: 80
                        bg_color: 0x203846
                        border_color: 0x3D687C
                        scrollable: false
                        widgets:
