                          - label: {styles: title_text, x: 48, y: 8, text: "Garage Door"}
                          - image:
                              src: img_smart_lock
                              align: LEFT_MID
                              x: 28
                              y: 14
                          - label:
                              id: garage_lock_status_label
                              x: 120
                              y: 76
                              text: "--"
                              text_font: font_title
                              text_color: 0xFFFFFF
              # =====================================================================
              # 3. GARAGE Roller DOOR                     col 9 span 2 | row 1 span 5
              # =====================================================================
              - obj:
                  styles: cell_style
                  scrollable: false
                  grid_cell_column_pos: 3
                  grid_cell_row_pos: 1
                  grid_cell_column_span: 1
                  grid_cell_row_span: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  widgets:
                    - obj:
                        id: card_garage
                        styles: card_style
                        width: 100%
                        height: 100%
                        scrollable: false
                        widgets:
                          - label:
                              x: 42
                              y: 10
                              text: "Garage Roller"
                              text_font: font_small
                          - label:
                              id: garage_icon
                              styles: icon_24
                              x: 12
                              y: 10
                              text: "\U000F06D9"
                          - obj:          # door position: roller-door slats
                              align: TOP_MID
                              id: garage_position_container
                              y: 52
                              width: 150
                              height: 110
                              radius: 8
                              bg_color: 0x222B38
                              border_color: 0x3A4658
                              border_width: 2
                              pad_all: 0
                              scrollable: false
                              widgets:
                                # Roller-door curtain: horizontal slats from the top,
                                # height = closed share of the door (100 - position %).
                                # Slats stay at the bottom edge, so a shorter curtain
                                # looks like the door rolling up. The container clips it.
                                - obj:
                                    id: garage_door_curtain
                                    align: TOP_MID
                                    width: 100%
                                    height: 100%
                                    bg_opa: TRANSP
                                    border_width: 0
                                    radius: 0
                                    pad_all: 0
                                    scrollable: false
                                    layout:
                                      type: flex
                                      flex_flow: COLUMN
                                      flex_align_main: END
                                      flex_align_cross: CENTER
                                      pad_row: 3
                                    widgets:
                                      - obj: {styles: garage_slat}
                                      - obj: {styles: garage_slat}
                                      - obj: {styles: garage_slat}
                                      - obj: {styles: garage_slat}
                                      - obj: {styles: garage_slat}
                                      - obj: {styles: garage_slat}
                                      - obj: {styles: garage_slat}
                                      - obj: {styles: garage_slat}
                                      - obj: {styles: garage_slat}
                                      - obj: {styles: garage_slat}

                          # Open / Closed / Partly open, top right beside the title.
                          - label:
                              id: garage_status_label
                              align: TOP_RIGHT
                              x: -12
                              y: 12
                              text: "--"
                              text_font: font_small
                              text_color: 0xA7B2C4
                          # One button for the controller's next action (Up / Stop /
                          # Down), centred below the door; garage_update_button sets
