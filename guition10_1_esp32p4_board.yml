        # Back to home (top left). Declared after the wrapper so it sits on
        # top of the scrolling settings list.
        - button:
            id: settings_back_btn
            styles: scene_btn  
            x: 16
            y: 14
            width: 120
            height: 48
            on_click:
              - script.execute: close_settings_page
            widgets:
              - label: {align: CENTER, text: "<  Home", text_font: font_body, text_color: 0xFFFFFF}

        # Reboot (bottom centre). Opens reboot_confirm; nothing restarts until
        # the second button is pressed.
        - button:
            id: settings_reboot_btn
            align: BOTTOM_MID
            y: -16
            width: 240
            height: 56
            radius: 12
            border_width: 0
            shadow_width: 0
            bg_color: 0xDC2626
            on_click:
              - lvgl.widget.show: reboot_confirm
            widgets:
              - label: {align: CENTER, text: "Reboot", text_font: font_body, text_color: 0xFFFFFF}

        # Bottom right: why the panel last restarted, and uptime in minutes.
        # Filled by update_settings_info (on page load, then every 3 s).
        - label:
            id: settings_reset_reason_label
            align: BOTTOM_RIGHT
            x: -24
            y: -46
            text: "Last restart: --"
            text_font: font_small
            text_color: 0xA7B2C4
        - label:
            id: settings_uptime_label
            align: BOTTOM_RIGHT
            x: -24
            y: -22
            text: "Uptime --:--:--"
            text_font: font_small
            text_color: 0xA7B2C4

        # Reboot confirmation: dims the page and blocks taps behind it.
        # Declared last so it sits on top of everything on this page.
        - obj:
            id: reboot_confirm
            align: CENTER
            width: 1280
            height: 800
            radius: 0
            border_width: 0
            bg_color: 0x000000
            bg_opa: 70%
            clickable: true
            scrollable: false
            hidden: true
            widgets:
              - obj:
                  align: CENTER
                  width: 520
                  height: 240
                  radius: 14
                  bg_color: 0x151D2B
                  border_color: 0x2A3546
                  border_width: 1
                  scrollable: false
                  widgets:
                    - label:
                        align: TOP_MID
                        y: 30
                        text: "Reboot the panel?"
                        text_font: font_ui_medium
                        text_color: 0xFFFFFF
                    - label:
                        align: TOP_MID
                        y: 72
                        text: "Calls and audio stop until it restarts."
                        text_font: font_small
                        text_color: 0xA7B2C4
                    - button:
                        align: BOTTOM_LEFT
                        x: 30
                        y: -24
                        width: 200
                        height: 56
                        radius: 12
                        border_width: 0
                        shadow_width: 0
                        bg_color: 0x202B3B
                        on_click:
                          - lvgl.widget.hide: reboot_confirm
                        widgets:
                          - label: {align: CENTER, text: "Cancel", text_font: font_body, text_color: 0xFFFFFF}
                    - button:
                        align: BOTTOM_RIGHT
                        x: -30
                        y: -24
                        width: 200
                        height: 56
                        radius: 12
                        border_width: 0
                        shadow_width: 0
                        bg_color: 0xDC2626
                        on_click:
                          - logger.log:
                              level: WARN
                              format: "Reboot requested from the settings page"
                          - lambda: App.safe_reboot();
                        widgets:
                          - label: {align: CENTER, text: "Reboot", text_font: font_body, text_color: 0xFFFFFF}

    # ==================================================================
    # VIDEO CALL: p4_video_renderer draws the remote picture directly into
    # call_video_surface (top 720 px); LVGL only owns the control strip.
    # ==================================================================
    - id: call_video_page
      bg_color: 0x000000
      widgets:
        - obj:
            id: call_video_surface
            align: TOP_MID
            width: 1280
            height: 720
            bg_color: 0x000000
            border_width: 0
            pad_all: 0
            scrollable: false
        - obj:
            align: BOTTOM_MID
            width: 1280
            height: 80
            bg_color: 0x0F1B40
            border_width: 0
            radius: 0
            pad_all: 8
            scrollable: false
            widgets:
              - label:
                  id: call_video_peer_label
                  align: LEFT_MID
                  x: 28
                  y: -13
                  width: 840
                  text: "Video call"
                  text_color: 0xFFFFFF
                  text_font: font_body
                  long_mode: DOT
              - label:
                  id: p4_video_media_route_label
                  align: LEFT_MID
                  x: 28
                  y: 15
                  width: 840
                  text: ""
                  text_color: 0x94A3B8
                  text_font: font_small
                  long_mode: DOT
              - button:
                  align: RIGHT_MID
                  x: -28
                  width: 220
                  height: 60
                  bg_color: 0xEF4444
                  radius: 12
                  on_click:
                    - voip_stack.call_toggle:
                  widgets:
                    - label:
                        align: CENTER
                        text: "HANG UP"
                        text_color: 0xFFFFFF
                        text_font: font_ui_medium


# =======RUNTIME LOGIC AND ENTITIES============================================

globals:
  - id: peer_name
    type: std::string
    restore_value: no
    initial_value: '""'

  # call_ended_group is shown for ~4 s after a call terminates (hangup,
  # decline, error, timeout); update_call_tile checks this flag.
  - id: call_ended_active
    type: bool
    restore_value: false
    initial_value: "false"

  - id: voip_keypad_visible
    type: bool
    restore_value: false
    initial_value: "false"

  - id: voip_dial_buffer
    type: std::string
    restore_value: false
    initial_value: '""'

  # Daily energy (kWh) for the last 14 completed days, oldest first; NAN = no
  # data. Filled by fetch_energy_history.
  - id: energy_history
    type: float[14]
    restore_value: false
    initial_value: "{NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN}"

  # Soil moisture 9-10 am average: [0] two days ago, [1] yesterday; NAN = no
  # data. Filled by fetch_soil_history.
  - id: soil_history
    type: float[2]
    restore_value: false
    initial_value: "{NAN, NAN}"

  # True once a snapshot tile has its first picture; until then a new
  # entity_picture token alone also triggers a download.
  - id: snap_front_loaded
    type: bool
    restore_value: false
    initial_value: "false"
  - id: snap_driveway_loaded
    type: bool
    restore_value: false
    initial_value: "false"

  # Gas heater target from the climate entity (NAN until HA sends it; also
  # set at once by the - / + buttons).
  - id: heater_target
    type: float
    restore_value: false
    initial_value: "NAN"

  # Media card: the last state media_poll read from HA. media_pos is the
  # position (s) at media_pos_at (UTC epoch); media_tick runs it forward
  # while playing.
  - id: media_state
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: media_title
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: media_artist
    type: std::string
    restore_value: false
    initial_value: '""'
  # Loaded track (e.g. library://track/285); empty when the queue is empty.
  - id: media_content_id
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: media_name
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: media_picture
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: media_duration
    type: float
    restore_value: false
    initial_value: "0"
  - id: media_pos
    type: float
    restore_value: false
    initial_value: "0"
  - id: media_pos_at
    type: int64_t
    restore_value: false
    initial_value: "0"
  # Player volume 0-1 (NAN until HA reports it).
  - id: media_volume
    type: float
    restore_value: false
    initial_value: "NAN"

  # Calendar page events, from calendar_fetch: ({start day, start minute or
  # -1 for all day, calendar 0-2, end day (exclusive), end minute}, title).
  # Days count from 1970-01-01, in local time.
  - id: cal_events
    type: std::vector<std::pair<std::array<int, 5>, std::string>>
    restore_value: false

  # The ?start=&end= part of the calendar requests.
  - id: cal_query
    type: std::string
    restore_value: false

  # Heating and Cooling timers, set in heater_sched_popup and used when the
  # power button starts the selected mode; each is kept until it fires.
  # Type: 0 none, 1 at a clock time (h:m), 2 after a delay (h hours m minutes).
  - id: heater_sched_on_type
    type: int
    restore_value: false
    initial_value: "0"
  - id: heater_sched_on_h
    type: int
    restore_value: false
    initial_value: "0"
  - id: heater_sched_on_m
    type: int
    restore_value: false
    initial_value: "0"
  - id: heater_sched_off_type
    type: int
    restore_value: false
    initial_value: "0"
  - id: heater_sched_off_h
    type: int
    restore_value: false
    initial_value: "0"
  - id: heater_sched_off_m
    type: int
    restore_value: false
    initial_value: "0"
  # Timer window being edited: 1 Delay on, 2 Delay off; and its type.
  - id: heater_sched_edit
    type: int
    restore_value: false
    initial_value: "1"
  - id: heater_sched_edit_type
    type: int
    restore_value: false
    initial_value: "2"
  # Running timers (UTC epoch, 0 = none) for heater_sched_mode;
  # heater_sched_check runs them.
  - id: heater_on_at
    type: int64_t
    restore_value: false
    initial_value: "0"
  - id: heater_off_at
    type: int64_t
    restore_value: false
    initial_value: "0"
  # Selected mode (Heat / Cool / Fan buttons): 1 Heat, 2 Cool, 3 Fan.
  - id: heater_sched_mode
    type: int
    restore_value: false
    initial_value: "1"
  # Evaporative cooler on, as far as this panel knows (its relay only
  # toggles it and reports nothing).
  - id: heater_cool_on
    type: bool
    restore_value: false
    initial_value: "false"

script:
  # Media card: read the selected player's state from HA's REST API
  # (/api/states/<entity>). Only the attributes the card uses are kept.
  - id: media_poll
    mode: single
    then:
      - if:
          condition:
            and:
              - api.connected:
              - lambda: return id(media_entity).state.rfind("media_player.", 0) == 0;
          then:
            - http_request.get:
                url: !lambda 'return std::string("${ha_base_url}/api/states/") + id(media_entity).state;'
                request_headers:
                  Authorization: "Bearer ${ha_token}"
                capture_response: true
                max_response_buffer_size: 16384
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          ESP_LOGW("media", "HA returned HTTP %d for %s", response->status_code,
                                   id(media_entity).state.c_str());
                          return;
                        }
                        JsonDocument filter;
                        filter["state"] = true;
                        JsonObject fa = filter["attributes"].to<JsonObject>();
                        for (const char *k : {"media_content_id", "media_title", "media_artist", "media_album_name", "media_duration",
                                              "media_position", "media_position_updated_at", "entity_picture",
                                              "friendly_name", "volume_level"})
                          fa[k] = true;
                        JsonDocument doc;
                        const auto err = deserializeJson(doc, body, DeserializationOption::Filter(filter));
                        if (err) {
                          ESP_LOGW("media", "Bad state JSON (%u bytes): %s", (unsigned) body.size(), err.c_str());
                          return;
                        }
                        JsonObjectConst a = doc["attributes"];
                        id(media_state) = doc["state"] | "";
                        id(media_content_id) = a["media_content_id"] | "";
                        id(media_title) = a["media_title"] | "";
                        id(media_artist) = a["media_artist"] | "";
                        id(media_name) = a["friendly_name"] | "";
                        id(media_duration) = a["media_duration"] | 0.0f;
                        id(media_pos) = a["media_position"] | 0.0f;
                        id(media_volume) = a["volume_level"] | NAN;
                        // "2026-10-27T10:53:12.345+00:00" (UTC) to epoch seconds.
                        int Y, M, D, h, m, s;
                        const char *at = a["media_position_updated_at"] | "";
                        if (sscanf(at, "%d-%d-%dT%d:%d:%d", &Y, &M, &D, &h, &m, &s) == 6) {
                          Y -= M <= 2;
                          const int era = Y / 400, yoe = Y - era * 400;
                          const int doy = (153 * (M + (M > 2 ? -3 : 9)) + 2) / 5 + D - 1;
                          const int doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
                          const int64_t days = (int64_t) era * 146097 + doe - 719468;
                          id(media_pos_at) = days * 86400 + h * 3600 + m * 60 + s;
                        } else {
                          id(media_pos_at) = 0;
                        }
                        ESP_LOGI("media", "State: %s, '%s'", id(media_state).c_str(), id(media_title).c_str());
                        // New art (the proxy URL changes per track): download it
                        // later, in media_fetch_art. Starting it here opened a
                        // second connection to HA while this one was still open.
                        std::string pic = a["entity_picture"] | "";
                        if (pic != id(media_picture)) {
                          id(media_picture) = pic;
                          if (pic.empty()) {
                            lv_obj_add_flag(id(media_art), LV_OBJ_FLAG_HIDDEN);
                          } else {
                            id(media_fetch_art).execute();
                          }
                        }
                    - script.execute: media_draw
                on_error:
                  - logger.log:
                      level: WARN
                      tag: media
                      format: "Media player state request failed"

  # Media card: title, artist and the play / pause icon.
  - id: media_draw
    then:
      - lambda: |-
          const std::string &st = id(media_state);
          const bool valid = id(media_entity).state.rfind("media_player.", 0) == 0;
          const bool active = st == "playing" || st == "paused" || st == "buffering";
          std::string title = id(media_title), artist = id(media_artist);
          if (!valid) {
            title = "No player";
            artist = "Set ${media_player_select_entity}";
        
          } else if (!active || title.empty()) {
            title = "Nothing playing";
            artist = id(media_name);
            
          }
          lv_label_set_text(id(media_title_label), title.c_str());
          lv_label_set_text(id(media_artist_label), artist.c_str());

          lv_label_set_text(id(media_play_icon), st == "playing" ? "\U000F03E4" : "\U000F040A");
      - script.execute: media_tick

  # Media card: progress bar and times (every second while playing).
  - id: media_tick
    then:
      - lambda: |-
          if (lv_obj_has_state(id(media_seek_slider), LV_STATE_PRESSED)) return;   // being dragged
          const float dur = id(media_duration);
          float pos = id(media_pos);
          if (id(media_state) == "playing" && id(media_pos_at) > 0 && id(my_time).now().is_valid())
            pos += (float) (id(my_time).now().timestamp - id(media_pos_at));
          pos = std::max(0.0f, dur > 0 ? std::min(pos, dur) : pos);
          auto fmt = [](float sec, char *buf, size_t n) {
            const int t = (int) sec;
            if (t >= 3600) snprintf(buf, n, "%d:%02d:%02d", t / 3600, t / 60 % 60, t % 60);
            else snprintf(buf, n, "%d:%02d", t / 60, t % 60);
          };
          char a[16] = "--:--", b[16] = "--:--";
          if (dur > 0) {
            fmt(pos, a, sizeof(a));
            fmt(dur, b, sizeof(b));
          }
          lv_label_set_text(id(media_elapsed_label), a);
          lv_label_set_text(id(media_duration_label), b);
          lv_slider_set_value(id(media_seek_slider), dur > 0 ? (int) (pos / dur * 1000) : 0, LV_ANIM_OFF);
          // Volume (0-1 from HA), unless the slider is being dragged.
          if (!lv_obj_has_state(id(media_volume_slider), LV_STATE_PRESSED) && !std::isnan(id(media_volume)))
            lv_slider_set_value(id(media_volume_slider), (int) roundf(id(media_volume) * 100), LV_ANIM_OFF);

  # Media card buttons: run a media_player action on the selected player,
  # then re-read its state.
  - id: media_command
    mode: restart
    parameters:
      service: string
    then:
      - if:
          condition:
            lambda: return id(media_entity).state.rfind("media_player.", 0) == 0;
          then:
            - homeassistant.action:
                action: !lambda 'return service;'
                data:
                  entity_id: !lambda 'return id(media_entity).state;'
            - delay: 800ms
            - script.execute: media_poll

  # Album art download, 1.5 s after the poll that saw new art: the state
  # request's connection is closed by then, and HA has had time to fetch the
  # new track's art. A newer track restarts the wait.
  - id: media_fetch_art
    mode: restart
    then:
      - delay: 1500ms
      - if:
          condition:
            lambda: return !id(media_picture).empty() && id(entertainment_page)->is_showing();
          then:
            - online_image.set_url:
                id: media_art_img
                url: !lambda |-
                  const std::string &pic = id(media_picture);
                  return pic.rfind("http", 0) == 0 ? pic : "${ha_base_url}" + pic;

  # Media card play button with an empty queue: shuffle on, then play the
  # ${media_default_playlist} playlist through Music Assistant.
  - id: media_play_default
    mode: single
    then:
      - if:
          condition:
            lambda: return id(media_entity).state.rfind("media_player.", 0) == 0;
          then:
            - lvgl.label.update:
                id: media_title_label
                text: "Starting playlist..."
            - homeassistant.action:
                action: media_player.shuffle_set
                data:
                  entity_id: !lambda 'return id(media_entity).state;'
                  shuffle: "true"
            - homeassistant.action:
                action: music_assistant.play_media
                data:
                  entity_id: !lambda 'return id(media_entity).state;'
                  media_id: ${media_default_playlist}
                  media_type: playlist
                  enqueue: replace
            - delay: 1500ms
            - script.execute: media_poll

  # Speaker button: fill media_speaker_list with one row per
  # media_speaker_select option (mirrored from ${media_speaker_select_entity})
  # and show the picker.
  - id: media_speakers_show
    then:
      - lambda: |-
          auto *speakers = id(media_speaker_select);
          lv_obj_t *list = id(media_speaker_list);
          lv_obj_clean(list);
          lv_obj_set_flex_flow(list, LV_FLEX_FLOW_COLUMN);
          lv_obj_set_flex_align(list, LV_FLEX_ALIGN_START, LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_START);
          lv_obj_set_style_pad_row(list, 8, LV_PART_MAIN);  // set here: YAML takes pad_row only with a layout
          for (size_t i = 0; i < speakers->size(); i++) {
            const std::string entity = speakers->option_at(i);
            // "media_player.living_room_speaker_2" -> "Living room speaker 2"
            std::string name = entity.substr(entity.find('.') + 1);
            for (auto &c : name) if (c == '_') c = ' ';
            if (!name.empty()) name[0] = toupper(name[0]);
            const bool current = entity == id(media_entity).state;
            lv_obj_t *row = lv_button_create(list);
            lv_obj_set_size(row, lv_pct(100), 60);
            lv_obj_set_style_radius(row, 10, LV_PART_MAIN);
            lv_obj_set_style_shadow_width(row, 0, LV_PART_MAIN);
            lv_obj_set_style_bg_color(row, lv_color_hex(current ? 0x4F5BD5 : 0x202B3B), LV_PART_MAIN);
            lv_obj_set_style_border_color(row, lv_color_hex(current ? 0x8B9BFF : 0x34445A), LV_PART_MAIN);
            lv_obj_set_style_border_width(row, 1, LV_PART_MAIN);
            lv_obj_t *label = lv_label_create(row);
            lv_label_set_text(label, name.c_str());
            lv_label_set_long_mode(label, LV_LABEL_LONG_DOT);
            lv_obj_set_width(label, lv_pct(100));
            lv_obj_align(label, LV_ALIGN_LEFT_MID, 8, 0);
            // Row index = option index in media_speaker_select.
            lv_obj_add_event_cb(row, [](lv_event_t *e) {
              auto *target = static_cast<lv_obj_t *>(lv_event_get_current_target(e));
              id(media_speaker_pick).execute((int) lv_obj_get_index(target));
            }, LV_EVENT_CLICKED, nullptr);
          }
          if (speakers->size() == 0) {
            lv_obj_t *label = lv_label_create(list);
            lv_label_set_text(label, "No speakers in ${media_speaker_select_entity}");
          }
      - lvgl.widget.show: media_speaker_picker

  # Speaker picked (row index): select it in ${media_speaker_select_entity}
  # (media_speaker_select sends the select_option action) and write its
  # entity id into ${media_player_select_entity}, which switches the card to
  # that player (media_entity on_value).
  - id: media_speaker_pick
    parameters:
      which: int
    then:
      - lvgl.widget.hide: media_speaker_picker
      - if:
          condition:
            lambda: return which >= 0 && id(media_speaker_select).has_index(which);
          then:
            - lambda: id(media_speaker_select).make_call().set_index(which).perform();
            - homeassistant.action:
                action: input_text.set_value
                data:
                  entity_id: ${media_player_select_entity}
                  value: !lambda 'return std::string(id(media_speaker_select).option_at(which));'

  # Calendar page opened: read the events of the three calendars from HA's
  # REST API (/api/calendars/<entity>), one request at a time, then draw.
  - id: calendar_fetch
    mode: single
    then:
      - if:
          condition:
            time.has_time:
              id: my_time
          then:
            - lambda: |-
                // From a few days before this month to just after next month
                // (calendar_draw skips the extra days), so the range is safe
                // whether HA reads these offset-less times as local or UTC.
                const auto now = id(my_time).now();
                int y = now.year, m = now.month - 1;
                if (m < 1) { m = 12; y--; }
                int end_y = now.year, end_m = now.month + 2;
                if (end_m > 12) { end_m -= 12; end_y++; }
                char query[80];
                snprintf(query, sizeof(query), "?start=%04d-%02d-28T00:00:00&end=%04d-%02d-02T00:00:00",
                         y, m, end_y, end_m);
                id(cal_query) = query;
                id(cal_events).clear();
            - script.execute: {id: calendar_fetch_one, which: 0}
            - script.wait: calendar_fetch_one
            - script.execute: {id: calendar_fetch_one, which: 1}
            - script.wait: calendar_fetch_one
            - script.execute: {id: calendar_fetch_one, which: 2}
            - script.wait: calendar_fetch_one
            - script.execute: calendar_draw
            - script.execute: clock_events_draw

  # One calendar (0 bins, 1 personal, 2 school): add its events to cal_events.
  - id: calendar_fetch_one
    mode: queued
    parameters:
      which: int
    then:
      - http_request.get:
          url: !lambda |-
            static const char *const ENTITIES[] = {"${calendar_bins_entity}", "${calendar_personal_entity}",
                                                   "${calendar_school_entity}"};
            return std::string("${ha_base_url}/api/calendars/") + ENTITIES[which] + id(cal_query);
          request_headers:
            Authorization: "Bearer ${ha_token}"
          capture_response: true
          max_response_buffer_size: 32768
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    ESP_LOGW("calendar", "HA returned HTTP %d for calendar %d", response->status_code, which);
                    return;
                  }
                  JsonDocument filter;
                  filter[0]["summary"] = true;
                  filter[0]["start"] = true;
                  filter[0]["end"] = true;
                  JsonDocument doc;
                  const auto err = deserializeJson(doc, body, DeserializationOption::Filter(filter));
                  if (err) {
                    ESP_LOGW("calendar", "Bad events JSON (%u bytes): %s", (unsigned) body.size(), err.c_str());
                    return;
                  }
                  // Days since 1970-01-01 (as in media_poll).
                  auto days = [](int y, int m, int d) {
                    y -= m <= 2;
                    const int era = y / 400, yoe = y - era * 400;
                    const int doy = (153 * (m + (m > 2 ? -3 : 9)) + 2) / 5 + d - 1;
                    return era * 146097 + yoe * 365 + yoe / 4 - yoe / 100 + doy - 719468;
                  };
                  // {"dateTime": "2026-11-02T17:00:00+11:00"} (local time) or {"date": "2026-11-02"} (all day).
                  auto parse = [&days](JsonObjectConst t, int &day, int &minute) {
                    int y, m, d, h, mi;
                    if (sscanf(t["dateTime"] | "", "%d-%d-%dT%d:%d", &y, &m, &d, &h, &mi) == 5) {
                      day = days(y, m, d);
                      minute = h * 60 + mi;
                      return true;
                    }
                    if (sscanf(t["date"] | "", "%d-%d-%d", &y, &m, &d) == 3) {
                      day = days(y, m, d);
                      minute = -1;
                      return true;
                    }
                    return false;
                  };
                  int count = 0;
                  for (JsonObjectConst ev : doc.as<JsonArrayConst>()) {
                    int start, start_min, end, end_min;
                    if (!parse(ev["start"].as<JsonObjectConst>(), start, start_min) ||
                        !parse(ev["end"].as<JsonObjectConst>(), end, end_min))
                      continue;
                    // Make the end day exclusive: an all-day end already is;
                    // a timed one is unless it ends at midnight.
                    if (start_min >= 0 && end_min > 0)
                      end++;
                    end = std::max(end, start + 1);
                    id(cal_events).emplace_back(std::array<int, 5>{start, start_min, which, end, end_min},
                                                std::string(ev["summary"] | "(No title)"));
                    count++;
                  }
                  ESP_LOGD("calendar", "%d events from calendar %d", count, which);
          on_error:
            - logger.log:
                level: WARN
                tag: calendar
                format: "Calendar %d request failed"
                args: [which]

  # Fill the two month grids and the upcoming list from cal_events.
  - id: calendar_draw
    then:
      - lambda: |-
          static const uint32_t COLOURS[] = {0x4CAF50, 0x5A87FA, 0xE48629};  // bins, personal, school (as the legend)
          static const char *const MONTHS[] = {"January", "February", "March", "April", "May", "June", "July",
                                               "August", "September", "October", "November", "December"};
          static const char *const WEEKDAYS[] = {"Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"};
          // Days since 1970-01-01 and back (Howard Hinnant's civil date algorithms).
          auto days = [](int y, int m, int d) {
            y -= m <= 2;
            const int era = y / 400, yoe = y - era * 400;
            const int doy = (153 * (m + (m > 2 ? -3 : 9)) + 2) / 5 + d - 1;
            return era * 146097 + yoe * 365 + yoe / 4 - yoe / 100 + doy - 719468;
          };
          auto civil = [](int z, int &y, int &m, int &d) {
            z += 719468;
            const int era = z / 146097, doe = z - era * 146097;
            const int yoe = (doe - doe / 1460 + doe / 36524 - doe / 146096) / 365;
            const int doy = doe - (365 * yoe + yoe / 4 - yoe / 100);
            const int mp = (5 * doy + 2) / 153;
            d = doy - (153 * mp + 2) / 5 + 1;
            m = mp < 10 ? mp + 3 : mp - 9;
            y = yoe + era * 400 + (m <= 2);
          };
          // Day 0 (1970-01-01) was a Thursday: (day + 3) % 7 is 0 on Mondays.
          auto day_name = [&civil](int day) {  // "Sat 31 Oct"
            int y, m, d;
            civil(day, y, m, d);
            char text[16];
            snprintf(text, sizeof(text), "%s %d %.3s", WEEKDAYS[(day + 3) % 7], d, MONTHS[m - 1]);
            return std::string(text);
          };
          auto hm = [](int minute) {
            char text[8];
            snprintf(text, sizeof(text), "%02d:%02d", minute / 60, minute % 60);
            return std::string(text);
          };

          const auto now = id(my_time).now();
          const int today = days(now.year, now.month, now.day_of_month);
          int first[3];  // the 1st of this month, next month and the month after
          for (int i = 0, y = now.year, m = now.month; i < 3; i++) {
            first[i] = days(y, m, 1);
            if (++m > 12) { m = 1; y++; }
          }

          auto &events = id(cal_events);
          std::sort(events.begin(), events.end());
          // Per day of the two months, a bit per calendar: one-day events
          // (dots) and longer ones (a band along the bottom of each day).
          std::vector<uint8_t> dots(first[2] - first[0], 0), spans(first[2] - first[0], 0);
          for (const auto &e : events) {
            const auto &t = e.first;
            if (t[3] - t[0] == 1) {
              if (t[0] >= first[0] && t[0] < first[2])
                dots[t[0] - first[0]] |= 1 << t[2];
            } else {
              for (int d = std::max(t[0], first[0]); d < std::min(t[3], first[2]); d++)
                spans[d - first[0]] |= 1 << t[2];
            }
          }

          lv_obj_t *titles[] = {id(cal_title_0), id(cal_title_1)};
          lv_obj_t *grids[] = {id(cal_grid_0), id(cal_grid_1)};
          for (int g = 0; g < 2; g++) {
            int y, m, d;
            civil(first[g], y, m, d);
            lv_label_set_text_fmt(titles[g], "%s %d", MONTHS[m - 1], y);
            lv_obj_t *grid = grids[g];
            lv_obj_clean(grid);
            for (int c = 0; c < 7; c++) {
              lv_obj_t *label = lv_label_create(grid);
              lv_label_set_text(label, WEEKDAYS[c]);
              lv_obj_set_width(label, 76);
              lv_obj_set_pos(label, c * 76, 0);
              lv_obj_set_style_text_align(label, LV_TEXT_ALIGN_CENTER, LV_PART_MAIN);
              lv_obj_set_style_text_color(label, lv_color_hex(0x9AA7B8), LV_PART_MAIN);
            }
            const int lead = (first[g] + 3) % 7;
            for (int day = first[g]; day < first[g + 1]; day++) {
              const int i = day - first[g] + lead, k = day - first[0];
              lv_obj_t *cell = lv_obj_create(grid);
              lv_obj_remove_style_all(cell);  // plain box: no theme padding, border or scrolling
              lv_obj_remove_flag(cell, LV_OBJ_FLAG_CLICKABLE);
              lv_obj_set_size(cell, 72, 42);
              lv_obj_set_pos(cell, i % 7 * 76 + 2, 24 + i / 7 * 46 + 2);
              lv_obj_set_style_radius(cell, 8, LV_PART_MAIN);
              lv_obj_set_style_bg_color(cell, lv_color_hex(0x202B3B), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(cell, LV_OPA_50, LV_PART_MAIN);
              if (day == today) {
                lv_obj_set_style_border_color(cell, lv_color_hex(0x8B9BFF), LV_PART_MAIN);
                lv_obj_set_style_border_width(cell, 2, LV_PART_MAIN);
              }
              lv_obj_t *number = lv_label_create(cell);
              lv_label_set_text_fmt(number, "%d", day - first[g] + 1);
              lv_obj_align(number, LV_ALIGN_TOP_MID, 0, 2);
              lv_obj_set_style_text_color(number, lv_color_hex(day < today ? 0x6B7A90 : 0xFFFFFF), LV_PART_MAIN);
              const int total = __builtin_popcount(dots[k]);
              for (int c = 0, n = 0; c < 3; c++) {
                if (!(dots[k] & (1 << c)))
                  continue;
                lv_obj_t *dot = lv_obj_create(cell);
                lv_obj_remove_style_all(dot);
                lv_obj_set_size(dot, 8, 8);
                lv_obj_set_style_radius(dot, LV_RADIUS_CIRCLE, LV_PART_MAIN);
                lv_obj_set_style_bg_color(dot, lv_color_hex(COLOURS[c]), LV_PART_MAIN);
                lv_obj_set_style_bg_opa(dot, LV_OPA_COVER, LV_PART_MAIN);
                lv_obj_align(dot, LV_ALIGN_BOTTOM_MID, (n++ * 2 - (total - 1)) * 6, -12);
              }
              // Longer events: a 4 px band across the bottom, shared side by
              // side when two calendars overlap.
              const int bands = __builtin_popcount(spans[k]);
              const int width = bands ? (64 - 4 * (bands - 1)) / bands : 0;
              for (int c = 0, n = 0; c < 3; c++) {
                if (!(spans[k] & (1 << c)))
                  continue;
                lv_obj_t *band = lv_obj_create(cell);
                lv_obj_remove_style_all(band);
                lv_obj_set_size(band, width, 4);
                lv_obj_set_style_radius(band, 2, LV_PART_MAIN);
                lv_obj_set_style_bg_color(band, lv_color_hex(COLOURS[c]), LV_PART_MAIN);
                lv_obj_set_style_bg_opa(band, LV_OPA_COVER, LV_PART_MAIN);
                lv_obj_align(band, LV_ALIGN_BOTTOM_LEFT, 4 + n++ * (width + 4), -4);
              }
            }
          }

          // Upcoming: each event under the day it starts (ongoing ones under
          // today), to the end of next month.
          std::vector<std::pair<int, size_t>> upcoming;  // (day shown under, index in events)
          for (size_t i = 0; i < events.size(); i++) {
            const auto &t = events[i].first;
            if (t[3] > today && t[0] < first[2])
              upcoming.emplace_back(std::max(t[0], today), i);
          }
          std::stable_sort(upcoming.begin(), upcoming.end(),
                           [](const auto &a, const auto &b) { return a.first < b.first; });

          lv_obj_t *list = id(cal_event_list);
          lv_obj_clean(list);
          lv_obj_set_flex_flow(list, LV_FLEX_FLOW_COLUMN);
          lv_obj_set_flex_align(list, LV_FLEX_ALIGN_START, LV_FLEX_ALIGN_START, LV_FLEX_ALIGN_START);
          lv_obj_set_style_pad_row(list, 6, LV_PART_MAIN);  // set here: YAML takes pad_row only with a layout
          int shown_day = -1;
          for (size_t r = 0; r < upcoming.size() && r < 60; r++) {
            const auto &t = events[upcoming[r].second].first;
            if (upcoming[r].first != shown_day) {
              shown_day = upcoming[r].first;
              std::string text = day_name(shown_day);
              if (shown_day == today)
                text = "Today, " + text;
              else if (shown_day == today + 1)
                text = "Tomorrow, " + text;
              lv_obj_t *head = lv_label_create(list);
              lv_label_set_text(head, text.c_str());
              lv_obj_set_style_text_font(head, id(font_small_18)->get_lv_font(), LV_PART_MAIN);
              lv_obj_set_style_text_color(head, lv_color_hex(0x9AA7B8), LV_PART_MAIN);
              lv_obj_set_style_pad_top(head, r == 0 ? 0 : 8, LV_PART_MAIN);
            }
            std::string when;
            const int last_day = t[4] == 0 ? t[3] : t[3] - 1;  // the day it ends on
            if (t[1] < 0)
              when = t[3] - t[0] == 1 ? "All day"
                                      : std::string(t[0] < today ? "Until " : "All day, until ") + day_name(t[3] - 1);
            else if (t[3] - t[0] == 1)
              when = hm(t[1]) + " - " + hm(t[4]);
            else
              when = (t[0] < today ? std::string("Until ") : hm(t[1]) + " - ") + day_name(last_day) + " " + hm(t[4]);

            lv_obj_t *row = lv_obj_create(list);
            lv_obj_remove_style_all(row);
            lv_obj_remove_flag(row, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_set_size(row, lv_pct(100), 64);
            lv_obj_set_style_radius(row, 10, LV_PART_MAIN);
            lv_obj_set_style_bg_color(row, lv_color_hex(0x202B3B), LV_PART_MAIN);
            lv_obj_set_style_bg_opa(row, LV_OPA_70, LV_PART_MAIN);
            lv_obj_t *bar = lv_obj_create(row);
            lv_obj_remove_style_all(bar);
            lv_obj_set_size(bar, 6, 48);
            lv_obj_set_pos(bar, 8, 8);
            lv_obj_set_style_radius(bar, 3, LV_PART_MAIN);
            lv_obj_set_style_bg_color(bar, lv_color_hex(COLOURS[t[2]]), LV_PART_MAIN);
            lv_obj_set_style_bg_opa(bar, LV_OPA_COVER, LV_PART_MAIN);
            lv_obj_t *title = lv_label_create(row);
            lv_label_set_text(title, events[upcoming[r].second].second.c_str());
            lv_label_set_long_mode(title, LV_LABEL_LONG_DOT);
            lv_obj_set_width(title, 600);
            lv_obj_set_pos(title, 26, 6);
            lv_obj_t *when_label = lv_label_create(row);
            lv_label_set_text(when_label, when.c_str());
            lv_obj_set_pos(when_label, 26, 36);
            lv_obj_set_style_text_font(when_label, id(font_small)->get_lv_font(), LV_PART_MAIN);
            lv_obj_set_style_text_color(when_label, lv_color_hex(0x9AA7B8), LV_PART_MAIN);
          }
          if (upcoming.empty()) {
            lv_obj_t *label = lv_label_create(list);
            lv_label_set_text(label, "Nothing on until the end of next month");
            lv_obj_set_style_text_color(label, lv_color_hex(0x9AA7B8), LV_PART_MAIN);
          }

  # Home page clock card: time (no seconds), "Fri, 30 Oct", and the next
  # events (finished ones drop off as the time passes).
  - id: update_clock
    then:
      - if:
          condition:
            time.has_time:
              id: my_time
          then:
            - lvgl.label.update:
                id: clock_time_label
                text: !lambda 'return id(my_time).now().strftime("%H:%M");'
            - lvgl.label.update:
                id: clock_date_label
                text: !lambda |-
                  auto now = id(my_time).now();  // not const: ESPTime::strftime is non-const
                  return now.strftime("%a, ") + std::to_string(now.day_of_month) + now.strftime(" %b");
            - script.execute: clock_events_draw

  # Clock card: the next three events from cal_events (from calendar_fetch):
  # starting today or later, and not already over. Ongoing multi-day events
  # (such as the school term) are left out.
  - id: clock_events_draw
    then:
      - lambda: |-
          static const uint32_t COLOURS[] = {0x4CAF50, 0x5A87FA, 0xE48629};  // as calendar_draw
          static const char *const MONTHS[] = {"Jan", "Feb", "Mar", "Apr", "May", "Jun",
                                               "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"};
          static const char *const WEEKDAYS[] = {"Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"};
          // Days since 1970-01-01 and back (as in calendar_draw).
          auto days = [](int y, int m, int d) {
            y -= m <= 2;
            const int era = y / 400, yoe = y - era * 400;
            const int doy = (153 * (m + (m > 2 ? -3 : 9)) + 2) / 5 + d - 1;
            return era * 146097 + yoe * 365 + yoe / 4 - yoe / 100 + doy - 719468;
          };
          auto civil = [](int z, int &y, int &m, int &d) {
            z += 719468;
            const int era = z / 146097, doe = z - era * 146097;
            const int yoe = (doe - doe / 1460 + doe / 36524 - doe / 146096) / 365;
            const int doy = doe - (365 * yoe + yoe / 4 - yoe / 100);
            const int mp = (5 * doy + 2) / 153;
            d = doy - (153 * mp + 2) / 5 + 1;
            m = mp < 10 ? mp + 3 : mp - 9;
            y = yoe + era * 400 + (m <= 2);
          };
          auto hm = [](int minute) {
            char text[8];
            snprintf(text, sizeof(text), "%02d:%02d", minute / 60, minute % 60);
            return std::string(text);
          };
          const auto now = id(my_time).now();
          if (!now.is_valid())
            return;
          const int today = days(now.year, now.month, now.day_of_month);
          const int minute = now.hour * 60 + now.minute;

          lv_obj_t *rows[] = {id(clock_ev0), id(clock_ev1), id(clock_ev2)};
          lv_obj_t *bars[] = {id(clock_ev0_bar), id(clock_ev1_bar), id(clock_ev2_bar)};
          lv_obj_t *times[] = {id(clock_ev0_time), id(clock_ev1_time), id(clock_ev2_time)};
          lv_obj_t *titles[] = {id(clock_ev0_title), id(clock_ev1_title), id(clock_ev2_title)};
          auto &events = id(cal_events);
          std::sort(events.begin(), events.end());
          int shown = 0;
          for (const auto &e : events) {
            if (shown == 3)
              break;
            const auto &t = e.first;
            if (t[0] < today || (t[1] >= 0 && t[3] - t[0] == 1 && t[0] == today && t[4] <= minute))
              continue;
            // Short enough for a 132 px column: "13:00 - 14:00" or "All day"
            // today, "Tomorrow 18:00", "Tue 3 Nov 18:00", "Tue 3 Nov" (all day).
            std::string when;
            if (t[0] == today) {
              when = t[1] < 0 ? "All day" : hm(t[1]) + " - " + hm(t[4]);
            } else {
              if (t[0] == today + 1) {
                when = "Tomorrow";
              } else {
                int y, m, d;
                civil(t[0], y, m, d);
                char text[16];
                snprintf(text, sizeof(text), "%s %d %s", WEEKDAYS[(t[0] + 3) % 7], d, MONTHS[m - 1]);
                when = text;
              }
              if (t[1] >= 0)
                when += " " + hm(t[1]);
            }
            lv_obj_set_style_bg_color(bars[shown], lv_color_hex(COLOURS[t[2]]), LV_PART_MAIN);
            lv_label_set_text(times[shown], when.c_str());
            lv_label_set_text(titles[shown], e.second.c_str());
            lv_obj_remove_flag(rows[shown], LV_OBJ_FLAG_HIDDEN);
            shown++;
          }
          for (int i = shown; i < 3; i++)
            lv_obj_add_flag(rows[i], LV_OBJ_FLAG_HIDDEN);
          if (shown == 0)
            lv_obj_remove_flag(id(clock_ev_none), LV_OBJ_FLAG_HIDDEN);
          else
            lv_obj_add_flag(id(clock_ev_none), LV_OBJ_FLAG_HIDDEN);

  # Download the latest Frigate snapshot through HA's image proxy. The short
  # delay lets the new entity_picture token arrive with the new state.
  - id: fetch_front_snapshot
    mode: restart
    then:
      - delay: 1s
      - if:
          condition:
            lambda: |-
              const auto &p = id(snap_front_picture).state;
              return p.rfind("/api/", 0) == 0;
          then:
            - online_image.set_url:
                id: snap_front_img
                url: !lambda 'return std::string("${ha_base_url}") + id(snap_front_picture).state;'
  - id: fetch_driveway_snapshot
    mode: restart
    then:
      - delay: 1s
      - if:
          condition:
            lambda: |-
              const auto &p = id(snap_driveway_picture).state;
              return p.rfind("/api/", 0) == 0;
          then:
            - online_image.set_url:
                id: snap_driveway_img
                url: !lambda 'return std::string("${ha_base_url}") + id(snap_driveway_picture).state;'

  # Camera pages: download the person / cat snapshots for the column
  # beside the stream (on page load, and on a new detection while shown).
  # One at a time, 500 ms apart, so they don't all hit HA and PSRAM at once.
  - id: fetch_front_cam_snaps
    mode: restart
    then:
      - delay: 300ms
      - if:
          condition:
            lambda: return id(snap_front_picture).state.rfind("/api/", 0) == 0;
          then:
            - online_image.set_url:
                id: cam_front_person_img
                url: !lambda 'return std::string("${ha_base_url}") + id(snap_front_picture).state;'
      - delay: 500ms
      - if:
          condition:
            lambda: return id(cam_front_cat_picture).state.rfind("/api/", 0) == 0;
          then:
            - online_image.set_url:
                id: cam_front_cat_img
                url: !lambda 'return std::string("${ha_base_url}") + id(cam_front_cat_picture).state;'
  - id: fetch_driveway_cam_snaps
    mode: restart
    then:
      - delay: 300ms
      - if:
          condition:
            lambda: return id(snap_driveway_picture).state.rfind("/api/", 0) == 0;
          then:
            - online_image.set_url:
                id: cam_drive_person_img
                url: !lambda 'return std::string("${ha_base_url}") + id(snap_driveway_picture).state;'
      - delay: 500ms
      - if:
          condition:
            lambda: return id(cam_drive_cat_picture).state.rfind("/api/", 0) == 0;
          then:
            - online_image.set_url:
                id: cam_drive_cat_img
                url: !lambda 'return std::string("${ha_base_url}") + id(cam_drive_cat_picture).state;'

  # Top-right status: Wi-Fi strength and the ESP32-C6 co-processor (its
  # firmware version, amber when an update is available). Wi-Fi runs through
  # the C6, so "connected" also means the C6 link is up.
  - id: update_status_bar
    then:
      - lambda: |-
          const bool up = wifi::global_wifi_component->is_connected();

          const char *wifi_icon = "\U000F05AA";   // wifi-off
          uint32_t wifi_color = 0xEF4444;
          char wifi_text[16] = "Offline";
          if (up) {
            // Signal in % from the wifi_signal_pct sensor: 2 x (dBm + 100).
            const float pct = id(wifi_signal_pct).state;
            wifi_color = 0x27D98D;
            if (std::isnan(pct)) {
              wifi_icon = "\U000F0928";               // no reading yet
              snprintf(wifi_text, sizeof(wifi_text), "Wi-Fi");
            } else {
              wifi_icon = pct >= 80 ? "\U000F0928" : pct >= 60 ? "\U000F0925" :
                          pct >= 40 ? "\U000F0922" : "\U000F091F";
              if (pct < 40) wifi_color = 0xF59E0B;
              snprintf(wifi_text, sizeof(wifi_text), "%.0f%%", pct);
            }
          }
          lv_label_set_text(id(status_wifi_icon), wifi_icon);
          lv_obj_set_style_text_color(id(status_wifi_icon), lv_color_hex(wifi_color), LV_PART_MAIN);
          lv_label_set_text(id(status_wifi_label), wifi_text);

          const auto *c6 = id(esp32_c6_coprocessor_update);
          const bool c6_update = c6->state == update::UPDATE_STATE_AVAILABLE;
          std::string c6_text = "C6 ";
          c6_text += c6->update_info.current_version.empty() ? (up ? "OK" : "--")
                                                             : c6->update_info.current_version;
          if (c6_update) c6_text += " (update)";
          const uint32_t c6_color = !up ? 0xEF4444 : c6_update ? 0xF59E0B : 0x27D98D;
          lv_label_set_text(id(status_c6_label), c6_text.c_str());
          lv_obj_set_style_text_color(id(status_c6_icon), lv_color_hex(c6_color), LV_PART_MAIN);

  # Reads the daily change of ${energy_daily_entity} (its 11:59 pm value)
  # for the last 14 completed days from Home Assistant long-term statistics.
  - id: fetch_energy_history
    mode: single
    then:
      - if:
          condition:
            and:
              - api.connected:
              - time.has_time:
                  id: my_time
          else:
            - logger.log:
                level: WARN
                tag: energy
                format: "Skipped: API connected=%d, time valid=%d"
                args: ['(int) api::global_api_server->is_connected()', '(int) id(my_time).now().is_valid()']
          then:
            - logger.log:
                tag: energy
                format: "Requesting 14 days of ${energy_daily_entity} from HA"
            - homeassistant.action:
                action: recorder.get_statistics
                data:
                  statistic_ids: ${energy_daily_entity}
                  period: day
                  # The meter is total_increasing, so statistics keep only
                  # state/sum (no max). "change" = energy used that day, i.e.
                  # the 11:59 pm reading; HA handles the midnight reset.
                  types: change
                  # Local midnight 14 days ago up to local midnight today.
                  start_time: !lambda |-
                    const auto now = id(my_time).now();
                    return ESPTime::from_epoch_local(now.timestamp - 14 * 86400)
                        .strftime("%Y-%m-%d 00:00:00");
                  end_time: !lambda |-
                    return id(my_time).now().strftime("%Y-%m-%d 00:00:00");
                capture_response: true
                on_success:
                  - lambda: |-
                      JsonObjectConst root = response["response"].is<JsonObjectConst>()
                          ? response["response"].as<JsonObjectConst>() : response;
                      JsonArrayConst rows =
                          root["statistics"]["${energy_daily_entity}"].as<JsonArrayConst>();
                      for (auto &v : id(energy_history)) v = NAN;
                      // Newest rows on the right; missing days stay empty.
                      const int n = rows.size();
                      const int first = n > 14 ? n - 14 : 0;
                      int slot = 14 - (n - first);
                      for (int i = first; i < n; i++)
                        id(energy_history)[slot++] = rows[i]["change"] | NAN;
                      ESP_LOGI("energy", "Loaded %d days of %s", n - first, "${energy_daily_entity}");
                      if (n == 0) {
                        // Show what HA actually sent, to see why there are no rows.
                        std::string raw;
                        serializeJson(response, raw);
                        if (raw.size() > 400) raw.resize(400);
                        ESP_LOGW("energy", "No rows. Response: %s", raw.c_str());
                      }
                  - script.execute: draw_energy_bars
                on_error:
                  - logger.log:
                      level: WARN
                      tag: energy
                      format: "recorder.get_statistics failed: %s"
                      args: ['error.c_str()']

  # Soil moisture history: the 9-10 am hourly mean of ${soil_moisture_entity}
  # two days ago and yesterday, one recorder.get_statistics call per day.
  - id: fetch_soil_history
    mode: single
    then:
      - if:
          condition:
            and:
              - api.connected:
              - time.has_time:
                  id: my_time
          then:
            - lambda: |-
                for (auto &v : id(soil_history)) v = NAN;
            - homeassistant.action:
                action: recorder.get_statistics
                data:
                  statistic_ids: ${soil_moisture_entity}
                  period: hour
                  types: mean
                  start_time: !lambda |-
                    return ESPTime::from_epoch_local(id(my_time).now().timestamp - 2 * 86400)
                        .strftime("%Y-%m-%d 09:00:00");
                  end_time: !lambda |-
                    return ESPTime::from_epoch_local(id(my_time).now().timestamp - 2 * 86400)
                        .strftime("%Y-%m-%d 10:00:00");
                capture_response: true
                on_success:
                  - lambda: |-
                      JsonObjectConst root = response["response"].is<JsonObjectConst>()
                          ? response["response"].as<JsonObjectConst>() : response;
                      JsonArrayConst rows =
                          root["statistics"]["${soil_moisture_entity}"].as<JsonArrayConst>();
                      if (rows.size() > 0) id(soil_history)[0] = rows[0]["mean"] | NAN;
                  - script.execute: draw_soil_labels
                on_error:
                  - logger.log:
                      level: WARN
                      tag: soil
                      format: "recorder.get_statistics failed: %s"
                      args: ['error.c_str()']
            - homeassistant.action:
                action: recorder.get_statistics
                data:
                  statistic_ids: ${soil_moisture_entity}
                  period: hour
                  types: mean
                  start_time: !lambda |-
                    return ESPTime::from_epoch_local(id(my_time).now().timestamp - 86400)
                        .strftime("%Y-%m-%d 09:00:00");
                  end_time: !lambda |-
                    return ESPTime::from_epoch_local(id(my_time).now().timestamp - 86400)
                        .strftime("%Y-%m-%d 10:00:00");
                capture_response: true
                on_success:
                  - lambda: |-
                      JsonObjectConst root = response["response"].is<JsonObjectConst>()
                          ? response["response"].as<JsonObjectConst>() : response;
                      JsonArrayConst rows =
                          root["statistics"]["${soil_moisture_entity}"].as<JsonArrayConst>();
                      if (rows.size() > 0) id(soil_history)[1] = rows[0]["mean"] | NAN;
                  - script.execute: draw_soil_labels
                on_error:
                  - logger.log:
                      level: WARN
                      tag: soil
                      format: "recorder.get_statistics failed: %s"
                      args: ['error.c_str()']

  # Day name + value for the two history slots ("Tue 45%"; "--%" = no data).
  - id: draw_soil_labels
    then:
      - lambda: |-
          lv_obj_t *labels[2] = {id(soil_day1_label), id(soil_day2_label)};
          const time_t now = id(my_time).now().timestamp;
          for (int i = 0; i < 2; i++) {
            const std::string day = ESPTime::from_epoch_local(now - (2 - i) * 86400).strftime("%a");
            const float v = id(soil_history)[i];
            char text[24];
            if (std::isnan(v))
              snprintf(text, sizeof(text), "%s --%%", day.c_str());
            else
              snprintf(text, sizeof(text), "%s %.0f%%", day.c_str(), v * ${soil_moisture_scale});
            lv_label_set_text(labels[i], text);
          }

  # Scales the 14 bars to the busiest day; days without data show as a stub.
  - id: draw_energy_bars
    then:
      - lambda: |-
          lv_obj_t *bars[14] = {id(ebar_0), id(ebar_1), id(ebar_2), id(ebar_3), id(ebar_4),
                                id(ebar_5), id(ebar_6), id(ebar_7), id(ebar_8), id(ebar_9),
                                id(ebar_10), id(ebar_11), id(ebar_12), id(ebar_13)};
          float max_v = 0, total = 0;
          int days = 0;
          for (float v : id(energy_history)) {
            if (std::isnan(v)) continue;
            max_v = std::max(max_v, v);
            total += v;
            days++;
          }
          // Heights in percent of the 140 px bar area (1 % = 1.4 px), not
          // pixels: the Energy page is not laid out until it is first shown,
          // so its measured height is 0 at boot. Empty days are a 3 % stub.
          for (int i = 0; i < 14; i++) {
            const float v = id(energy_history)[i];
            const bool ok = !std::isnan(v) && max_v > 0;
            const int pct = ok ? std::max(3, (int) (v / max_v * 100)) : 3;
            lv_obj_set_height(bars[i], lv_pct(pct));
            lv_obj_set_style_bg_opa(bars[i], ok ? LV_OPA_COVER : LV_OPA_30, LV_PART_MAIN);
          }
          char text[48];
          if (days > 0)
            snprintf(text, sizeof(text), "Avg %.1f kWh/day", total / days);
          else
            snprintf(text, sizeof(text), "no data");
          lv_label_set_text(id(elec_hist_label), text);

          // Y axis: the top of the bars is the busiest day, the middle half of it.
          char axis[12] = "";
          if (max_v > 0) snprintf(axis, sizeof(axis), max_v < 10 ? "%.1f" : "%.0f", max_v);
          lv_label_set_text(id(elec_axis_max), axis);
          if (max_v > 0) snprintf(axis, sizeof(axis), max_v < 20 ? "%.1f" : "%.0f", max_v / 2);
          lv_label_set_text(id(elec_axis_mid), axis);

  - id: show_voip_keypad
    mode: single
    then:
      - lambda: |-
          if (!id(phone).is_idle() || id(voip_keypad_visible)) return;
          id(voip_keypad_visible) = true;
          const int height = lv_obj_get_height(id(voip_tile));
          lv_obj_clear_flag(id(call_idle_group), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(call_keypad_group), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_y(id(call_idle_group), 0);
          lv_obj_set_y(id(call_keypad_group), height);
          lv_anim_t contacts;
          lv_anim_init(&contacts);
          lv_anim_set_var(&contacts, id(call_idle_group));
          lv_anim_set_values(&contacts, 0, -height);
          lv_anim_set_duration(&contacts, 220);
          lv_anim_set_exec_cb(&contacts, [](void *obj, int32_t y) {
            lv_obj_set_y(static_cast<lv_obj_t *>(obj), y);
          });
          lv_anim_start(&contacts);
          lv_anim_t keypad;
          lv_anim_init(&keypad);
          lv_anim_set_var(&keypad, id(call_keypad_group));
          lv_anim_set_values(&keypad, height, 0);
          lv_anim_set_duration(&keypad, 220);
          lv_anim_set_exec_cb(&keypad, [](void *obj, int32_t y) {
            lv_obj_set_y(static_cast<lv_obj_t *>(obj), y);
          });
          lv_anim_start(&keypad);

  - id: hide_voip_keypad
    mode: single
    then:
      - lambda: |-
          if (!id(voip_keypad_visible)) return;
          id(voip_keypad_visible) = false;
          const int height = lv_obj_get_height(id(voip_tile));
          lv_obj_clear_flag(id(call_idle_group), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(call_keypad_group), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_y(id(call_idle_group), -height);
          lv_obj_set_y(id(call_keypad_group), 0);
          lv_anim_t contacts;
          lv_anim_init(&contacts);
          lv_anim_set_var(&contacts, id(call_idle_group));
          lv_anim_set_values(&contacts, -height, 0);
          lv_anim_set_duration(&contacts, 220);
          lv_anim_set_exec_cb(&contacts, [](void *obj, int32_t y) {
            lv_obj_set_y(static_cast<lv_obj_t *>(obj), y);
          });
          lv_anim_start(&contacts);
          lv_anim_t keypad;
          lv_anim_init(&keypad);
          lv_anim_set_var(&keypad, id(call_keypad_group));
          lv_anim_set_values(&keypad, 0, height);
          lv_anim_set_duration(&keypad, 220);
          lv_anim_set_exec_cb(&keypad, [](void *obj, int32_t y) {
            lv_obj_set_y(static_cast<lv_obj_t *>(obj), y);
          });
          lv_anim_start(&keypad);

  # Shows the call state in the home page Intercom card (voip_tile).
  - id: update_call_tile
    mode: restart
    then:
      - lambda: |-
          auto set_hidden = [](lv_obj_t *obj, bool hidden) {
            const bool is_hidden = lv_obj_has_flag(obj, LV_OBJ_FLAG_HIDDEN);
            if (hidden && !is_hidden) {
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            } else if (!hidden && is_hidden) {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          };
          auto set_label = [](lv_obj_t *label, const char *text) {
            if (text == nullptr) text = "";
            const char *current = lv_label_get_text(label);
            if (current == nullptr || strcmp(current, text) != 0)
              lv_label_set_text(label, text);
          };

          std::string call_state = id(phone).get_state_str();

          // Telephone state always wins over the optional idle keypad. Cancel
          // any in-flight card animation so ringing/calling cannot inherit an
          // off-screen position.
          if (call_state != "idle" && !call_state.empty()) {
            id(voip_keypad_visible) = false;
            lv_anim_del(id(call_idle_group), nullptr);
            lv_anim_del(id(call_keypad_group), nullptr);
            lv_obj_set_y(id(call_idle_group), 0);
            lv_obj_set_y(id(call_keypad_group), lv_obj_get_height(id(voip_tile)));
          }

          set_hidden(id(call_idle_group), true);
          set_hidden(id(call_keypad_group), true);
          set_hidden(id(call_ringing_in_group), true);
          set_hidden(id(call_ringing_out_group), true);
          set_hidden(id(call_in_call_group), true);
          set_hidden(id(call_ended_group), true);

          if (id(call_ended_active) && !id(phone).is_active()) {
            set_hidden(id(call_ended_group), false);
          } else if (call_state == "ringing") {
            set_label(id(call_ringing_in_peer_label), id(peer_name).c_str());
            set_hidden(id(call_ringing_in_group), false);
          } else if (call_state == "calling" || call_state == "remote_ringing") {
            set_label(id(call_ringing_out_peer_label), id(peer_name).c_str());
            set_hidden(id(call_ringing_out_group), false);
          } else if (call_state == "in_call" || call_state == "connecting") {
            set_label(id(call_in_call_peer_label), id(peer_name).c_str());
            set_hidden(id(call_in_call_group), false);
          } else {
            set_label(id(call_idle_peer_label), id(peer_name).c_str());
            char buf[32];
            snprintf(buf, sizeof(buf), "Contacts: %u",
                     static_cast<unsigned>(id(phone).get_contact_count()));
            set_label(id(call_idle_contacts_label), buf);
            if (id(voip_keypad_visible)) {
              lv_obj_set_y(id(call_keypad_group), 0);
              set_hidden(id(call_keypad_group), false);
            } else {
              lv_obj_set_y(id(call_idle_group), 0);
              lv_obj_set_y(id(call_keypad_group), lv_obj_get_height(id(voip_tile)));
              set_hidden(id(call_idle_group), false);
            }
          }

  # Page for the call state. A ringing, outgoing or active call shows the
  # Intercom page (unless the video page is already showing the call); once
  # the phone is idle the video page goes back to the Intercom page and any
  # other page stays as it is.
  - id: show_phone_page
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *scr = lv_disp_get_scr_act(nullptr);
          lv_obj_t *intercom = id(intercom_page)->obj;
          if (!id(phone).is_idle()) {
            if (scr != intercom && scr != id(call_video_page)->obj)
              lv_disp_load_scr(intercom);
          } else if (scr == id(call_video_page)->obj) {
            lv_disp_load_scr(intercom);
          }
      - script.execute: update_call_tile

  # Called by p4_video_renderer on the first remote frame.
  - id: show_video_page
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(phone).is_in_call() &&
                     id(p4_video).has_remote_frame();
          then:
            - lvgl.label.update:
                id: call_video_peer_label
                text: !lambda 'return id(peer_name);'
            - lvgl.page.show: call_video_page

  # Front Door <-> Driveway: the spinner page for 3 s first, so the old RTSP
  # stream has released its 811 KB decode buffer (it drops ~3 s after its
  # canvas leaves the screen) before the new one allocates its own.
  # mode single: extra taps while switching are ignored.
  - id: cam_switch
    mode: single
    parameters:
      to_driveway: bool
    then:
      - lvgl.label.update:
          id: cam_switch_label
          text: !lambda 'return std::string(to_driveway ? "Opening Driveway..." : "Opening Front Door...");'
      - lvgl.page.show:
          id: cam_switch_page
          animation: FADE_IN
          time: 150ms
      - delay: 3s
      # Something else (an incoming call) took the screen: stay there.
      - if:
          condition:
            lambda: return !id(cam_switch_page)->is_showing();
          then:
            - script.stop: cam_switch
      - if:
          condition:
            lambda: return to_driveway;
          then:
            - lvgl.page.show:
                id: cam_driveway_page
                animation: MOVE_LEFT
                time: 250ms
          else:
            - lvgl.page.show:
                id: cam_front_page
                animation: MOVE_RIGHT
                time: 250ms

  - id: close_settings_page
    then:
      - lvgl.page.show:
          id: home_page
          animation: MOVE_BOTTOM
          time: 250ms
      - script.execute: update_call_tile

  # Shows peer + reason in the Intercom card for ~4 s after a call ends.
  - id: show_call_ended
    mode: restart
    parameters:
      peer: string
      reason: string
    then:
      - globals.set:
          id: call_ended_active
          value: "true"
      - lvgl.label.update:
          id: call_ended_peer_label
          text: !lambda |-
            return peer.empty() ? std::string("Call ended.") : ("Call with " + peer + " ended.");
      - lvgl.label.update:
          id: call_ended_reason_label
          text: !lambda |-
            std::string label;
            if      (reason == "local_hangup")    label = "Local hangup";
            else if (reason == "remote_hangup")   label = "Remote hangup";
            else if (reason == "declined")        label = "Declined";
            else if (reason == "timeout")         label = "Timeout";
            else if (reason == "busy")            label = "Busy";
            else if (reason == "unreachable")     label = "Unreachable";
            else if (reason == "protocol_error")  label = "Protocol error";
            else if (reason == "bridge_error")    label = "Bridge error";
            else                                  label = reason.empty() ? std::string("Ended") : reason;
            return std::string("Reason: ") + label;
      - script.execute: backlight_timer
      - script.execute: show_phone_page
      - delay: 4s
      - globals.set:
          id: call_ended_active
          value: "false"
      - script.execute: update_call_tile

  # Ringtone: loop the bundled FLAC on the announcement pipeline while ringing.
  - id: voip_start_ringtone
    then:
      - if:
          condition:
            and:
              - voip_stack.is_ringing:
              - not:
                  script.is_running: voip_ringing_loop
          then:
            - script.execute: voip_ringing_loop

  - id: voip_ringing_loop
    mode: single
    then:
      - while:
          condition:
            voip_stack.is_ringing:
          then:
            - media_player.play_media:
                id: speaker_player
                media_url: "audio-file://voip_ringing_sound"
                announcement: true
            - wait_until:
                condition:
                  lambda: |-
                    return id(ringtone_file_source).get_state() !=
                           media_source::MediaSourceState::IDLE;
                timeout: 2s
            - wait_until:
                condition:
                  or:
                    - not:
                        voip_stack.is_ringing:
                    - lambda: |-
                        return id(ringtone_file_source).get_state() ==
                               media_source::MediaSourceState::IDLE;
                timeout: 5s
      - media_player.stop:
          id: speaker_player
          announcement: true

  - id: voip_stop_ringtone
    then:
      - script.stop: voip_ringing_loop
      - media_player.stop:
          id: speaker_player
          announcement: true

  # Copies entity state into the settings page widgets when it opens.
  - id: settings_sync_widgets
    then:
      - lvgl.slider.update:
          id: ui_speaker_vol_slider
          value: !lambda 'return id(master_volume).state;'
#      - lvgl.slider.update:
#          id: ui_mic_vol_slider
#          value: !lambda 'return id(mic_gain).state;'
      - lvgl.switch.update:
          id: ui_speaker_mute_sw
          state:
            checked: !lambda 'return id(speaker_mute).state;'
      - lvgl.switch.update:
          id: ui_mic_mute_sw
          state:
            checked: !lambda 'return id(mute).state;'
      - lvgl.switch.update:
          id: ui_auto_answer_sw
          state:
            checked: !lambda 'return id(auto_answer_switch).state;'
      - lvgl.slider.update:
          id: ui_brightness_slider
          value: !lambda 'return id(screen_brightness).state;'
      - lvgl.dropdown.update:
          id: ui_dim_after_dd
          selected_index: !lambda 'return id(screen_dim_select).active_index().value_or(1);'
      - lvgl.dropdown.update:
          id: ui_home_return_dd
          selected_index: !lambda 'return id(home_return_select).active_index().value_or(2);'
#      - lvgl.switch.update:
#          id: ui_dnd_sw
#          state:
#            checked: !lambda 'return id(dnd_switch).state;'
#      - lvgl.switch.update:
#          id: ui_aec_sw
#          state:
#            checked: !lambda 'return id(aec_switch).state;'
#      - lvgl.dropdown.update:
#          id: ui_aec_mode_dd
#          selected_text: !lambda 'return id(aec_mode_select).current_option();'
#      - lvgl.switch.update:
#          id: ui_ns_sw
#          state:
#            checked: !lambda 'return id(ns_switch).state;'
#      - lvgl.switch.update:
#          id: ui_agc_sw
#          state:
#            checked: !lambda 'return id(agc_switch).state;'

  # Settings page, bottom right: last reset reason and uptime (whole minutes,
  # rounded up). millis_64() does not wrap after 49 days.
  - id: update_settings_info
    then:
      - lambda: |-
          const char *reason;
          switch (esp_reset_reason()) {
            case ESP_RST_POWERON:   reason = "Power on"; break;
            case ESP_RST_EXT:       reason = "Reset pin"; break;
            case ESP_RST_SW:        reason = "Software restart"; break;
            case ESP_RST_PANIC:     reason = "Crash (panic)"; break;
            case ESP_RST_INT_WDT:   reason = "Interrupt watchdog"; break;
            case ESP_RST_TASK_WDT:  reason = "Task watchdog"; break;
            case ESP_RST_WDT:       reason = "Watchdog"; break;
            case ESP_RST_DEEPSLEEP: reason = "Deep sleep wake"; break;
            case ESP_RST_BROWNOUT:  reason = "Brownout (power dip)"; break;
            case ESP_RST_SDIO:      reason = "SDIO reset"; break;
            default:                reason = "Other"; break;
          }
          char text[48];
          snprintf(text, sizeof(text), "Last restart: %s", reason);
          lv_label_set_text(id(settings_reset_reason_label), text);

          // "Uptime < 1 min", then whole minutes rounded up: "Uptime 3d 4h 12m".
          const uint64_t s = millis_64() / 1000;
          if (s < 60) {
            snprintf(text, sizeof(text), "Uptime < 1 min");
          } else {
            const uint64_t m = (s + 59) / 60;
            const unsigned d = m / 1440, h = m / 60 % 24, mi = m % 60;
            if (d > 0)
              snprintf(text, sizeof(text), "Uptime %ud %uh %um", d, h, mi);
            else if (h > 0)
              snprintf(text, sizeof(text), "Uptime %uh %um", h, mi);
            else
              snprintf(text, sizeof(text), "Uptime %um", mi);
          }
          lv_label_set_text(id(settings_uptime_label), text);

  - id: update_ic_idle_labels
    then:
      - lambda: id(peer_name) = id(phone).get_current_destination();
      - lvgl.label.update:
          id: call_idle_peer_label
          text: !lambda 'return id(peer_name);'
      - lvgl.label.update:
          id: call_idle_contacts_label
          text: !lambda |-
            char buf[32];
            snprintf(
                buf, sizeof(buf), "Contacts: %u",
                static_cast<unsigned>(id(phone).get_contact_count()));
            return std::string(buf);

  # NS4150 amplifier power-down, started by esp_audio_stack on_amplifier_idle
  # and cancelled by on_amplifier_required. Left on while idle the amp turns
  # the DAC's idle noise into an audible squeal; the 2 s delay keeps sound
  # tails and back-to-back sounds (ringtone loop) from being cut or clicking.
  - id: speaker_amp_idle_off
    mode: restart
    then:
      - delay: 2s
      - output.turn_off: speaker_enable

  # Highlights the tapped scene button (0 Home, 1 Night, 2 Movie, 3 Cat Away).
  - id: scene_select
    parameters:
      which: int
    then:
      - lvgl.widget.update: {id: scene_home_btn, state: {checked: !lambda 'return which == 0;'}}
      - lvgl.widget.update: {id: scene_night_btn, state: {checked: !lambda 'return which == 1;'}}
      - lvgl.widget.update: {id: scene_movie_btn, state: {checked: !lambda 'return which == 2;'}}
      - lvgl.widget.update: {id: scene_cat_away_btn, state: {checked: !lambda 'return which == 3;'}}

  # Lights card tiles from the HA light state (same method as the 4" panel):
  # on = warm radial glow and a white icon, off/unknown = dark
  # grey tile and grey icon. Sets the checked state, so it can be re-run
  # at any time (light change, 8 s after boot, every 3 s).
  - id: light_tiles_check
    then:
      - if:
          condition:
            binary_sensor.is_on: light_tv_lamp_on
          then:
            - lvgl.widget.update:
                id: light_tv_lamp_btn
                state:
                  checked: true
          else:
            - lvgl.widget.update:
                id: light_tv_lamp_btn
                state:
                  checked: false
      - if:
          condition:
            binary_sensor.is_on: light_living_left_on
          then:
            - lvgl.widget.update:
                id: light_living_left_btn
                state:
                  checked: true
            - lvgl.label.update:
                id: light_living_left_icon
                text_color: 0xFFFFFF
          else:
            - lvgl.widget.update:
                id: light_living_left_btn
                state:
                  checked: false
            - lvgl.label.update:
                id: light_living_left_icon
                text_color: 0x8995A7
      - if:
          condition:
            binary_sensor.is_on: light_living_right_on
          then:
            - lvgl.widget.update:
                id: light_living_right_btn
                state:
                  checked: true
            - lvgl.label.update:
                id: light_living_right_icon
                text_color: 0xFFFFFF
          else:
            - lvgl.widget.update:
                id: light_living_right_btn
                state:
                  checked: false
            - lvgl.label.update:
                id: light_living_right_icon
                text_color: 0x8995A7

  # Evaporative cooler: one 250 ms press of its power button through the
  # GPIO37 relay (same pattern as the garage door's press_button script).
  - id: cooler_press
    mode: restart
    then:
      - switch.turn_on: cooler_relay
      - delay: 250ms
      - switch.turn_off: cooler_relay

  # Rinnai switch changed (also from Home Assistant or the wall controller):
  # select the mode it runs in, then redraw. The Rinnai on/off switch stays
  # on in fan mode, so fan on = Fan, otherwise power on = Heat.
  - id: heater_state_changed
    then:
      - lambda: |-
          if (id(heater_fan_on).state) id(heater_sched_mode) = 3;
          else if (id(heater_power_on).state) id(heater_sched_mode) = 1;
      - script.execute: heater_update_buttons

  # Gas heater card: selected mode, the power ring and the target pill
  # (in fan-only mode the Rinnai "target" is the fan speed, 1-16).
  - id: heater_update_buttons
    then:
      - lvgl.widget.update:
          id: heater_btn_heat
          state:
            checked: !lambda 'return id(heater_sched_mode) == 1;'
      - lvgl.widget.update:
          id: heater_btn_cool
          state:
            checked: !lambda 'return id(heater_sched_mode) == 2;'
      - lvgl.widget.update:
          id: heater_btn_fan
          state:
            checked: !lambda 'return id(heater_sched_mode) == 3;'
      - lambda: |-
          const bool rinnai = id(heater_power_on).state || id(heater_fan_on).state;
          const bool on = rinnai || id(heater_cool_on);
          lv_obj_t *btn = id(heater_power_btn);
          lv_obj_set_style_border_color(btn, lv_color_hex(on ? 0x8B7CF6 : 0x3A4660), LV_PART_MAIN);
          lv_obj_set_style_shadow_color(btn, lv_color_hex(0x6366F1), LV_PART_MAIN);
          lv_obj_set_style_shadow_width(btn, on ? 18 : 0, LV_PART_MAIN);
          lv_obj_set_style_shadow_opa(btn, LV_OPA_50, LV_PART_MAIN);
          // Target / fan speed only mean something while the heater is on.
          if (rinnai) lv_obj_clear_flag(id(heater_target_pill), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(heater_target_pill), LV_OBJ_FLAG_HIDDEN);
      - script.execute: heater_draw_target

  # Power button pressed while off: start the selected mode now, or at the
  # Delay on time; with a Delay off timer, turn off at its clock time or that
  # long after turning on.
  - id: heater_mode_start
    then:
      - script.execute: {id: heater_sched_arm, which: 0}
      - if:
          condition:
            lambda: return id(heater_on_at) == 0;
          then:
            - script.execute: {id: heater_mode_on, mode: !lambda 'return id(heater_sched_mode);'}

  # Set heater_on_at / heater_off_at from the saved timers. which 0: power
  # pressed (both timers start). 1 / 2: the Delay on / off timer was saved or
  # cleared; it restarts from now if it is already counting (Delay on) or
  # the mode is waiting or running (Delay off), else it waits for the power
  # button. Without a clock the timers are ignored.
  - id: heater_sched_arm
    parameters:
      which: int
    then:
      - lambda: |-
          const auto now = id(my_time).now();
          if (!now.is_valid()) {
            if (which == 0 && (id(heater_sched_on_type) || id(heater_sched_off_type)))
              ESP_LOGW("heater", "No time yet: timers ignored, turning on now");
            id(heater_on_at) = id(heater_off_at) = 0;
            return;
          }
          // Next local h:m after `from`, or `from` + the h:m delay.
          auto when = [](int64_t from, int type, int h, int m) -> int64_t {
            if (type == 2) return from + h * 3600 + m * 60;
            const ESPTime t = ESPTime::from_epoch_local(from);
            int64_t s = h * 3600 + m * 60 - (t.hour * 3600 + t.minute * 60 + t.second);
            if (s <= 0) s += 86400;
            return from + s;
          };
          const bool waiting = id(heater_on_at) > 0;
          const bool running = id(heater_power_on).state || id(heater_fan_on).state || id(heater_cool_on);
          if (which == 0)
            id(heater_on_at) = id(heater_sched_on_type)
                ? when(now.timestamp, id(heater_sched_on_type), id(heater_sched_on_h), id(heater_sched_on_m)) : 0;
          else if (which == 1 && waiting)   // Delay on cleared: start now (next check)
            id(heater_on_at) = id(heater_sched_on_type)
                ? when(now.timestamp, id(heater_sched_on_type), id(heater_sched_on_h), id(heater_sched_on_m))
                : now.timestamp;
          // The Delay off counts from the start.
          if (which == 0 || (which == 1 && waiting) || (which == 2 && (waiting || running))) {
            const int64_t start = id(heater_on_at) ? id(heater_on_at) : now.timestamp;
            id(heater_off_at) = id(heater_sched_off_type)
                ? when(start, id(heater_sched_off_type), id(heater_sched_off_h), id(heater_sched_off_m)) : 0;
          }
      - script.execute: heater_sched_draw

  - id: heater_mode_on
    parameters:
      mode: int
    then:
      - if:
          condition:
            lambda: return mode == 1;
          then:
            # Leave fan mode first, else the unit stays in it.
            - homeassistant.action:
                action: switch.turn_off
                data:
                  entity_id: ${heater_fan_switch}
            - homeassistant.action:
                action: switch.turn_on
                data:
                  entity_id: ${heater_power_switch}
      # The cooler button only toggles: press it only if it is off.
      - if:
          condition:
            lambda: return mode == 2 && !id(heater_cool_on);
          then:
            - lambda: id(heater_cool_on) = true;
            - script.execute: cooler_press
            - script.execute: heater_update_buttons
      - if:
          condition:
            lambda: return mode == 3;
          then:
            - homeassistant.action:
                action: switch.turn_on
                data:
                  entity_id: ${heater_fan_switch}

  # Turn off whatever runs: both Rinnai switches, and another press of the
  # cooler button if this panel turned it on.
  - id: heater_mode_off
    then:
      - if:
          condition:
            lambda: return id(heater_cool_on);
          then:
            - lambda: id(heater_cool_on) = false;
            - script.execute: cooler_press
            - script.execute: heater_update_buttons
      - if:
          condition:
            lambda: return id(heater_power_on).state || id(heater_fan_on).state;
          then:
            - homeassistant.action:
                action: switch.turn_off
                data:
                  entity_id: ${heater_power_switch}
            - homeassistant.action:
                action: switch.turn_off
                data:
                  entity_id: ${heater_fan_switch}

  # Every second: run a timer that is due. A timer is used up when it fires.
  - id: heater_sched_check
    then:
      - if:
          condition:
            lambda: |-
              const auto now = id(my_time).now();
              return id(heater_on_at) > 0 && now.is_valid() && now.timestamp >= id(heater_on_at);
          then:
            - lambda: id(heater_on_at) = id(heater_sched_on_type) = 0;
            - script.execute: {id: heater_mode_on, mode: !lambda 'return id(heater_sched_mode);'}
            - script.execute: heater_sched_draw
      - if:
          condition:
            lambda: |-
              const auto now = id(my_time).now();
              return id(heater_off_at) > 0 && now.is_valid() && now.timestamp >= id(heater_off_at);
          then:
            - lambda: id(heater_off_at) = id(heater_sched_off_type) = 0;
            - script.execute: heater_mode_off
            - script.execute: heater_sched_draw

  # Timer label and buttons: a running timer ("Heat on 18:30", "Off 21:00";
  # the button breathes) or a saved one waiting for the power button
  # ("On in 1h 30m"; the button is red at 50 %).
  - id: heater_sched_draw
    then:
      - lambda: |-
          static const char *const MODES[] = {"", "Heat", "Cool", "Fan"};
          auto clock = [](int64_t t) { return ESPTime::from_epoch_local(t).strftime("%H:%M"); };
          auto setting = [](const char *what, int type, int h, int m) {
            char buf[32];
            if (type == 1) snprintf(buf, sizeof(buf), "%s at %02d:%02d", what, h, m);
            else snprintf(buf, sizeof(buf), "%s in %dh %02dm", what, h, m);
            return std::string(buf);
          };
          std::string on, off;
          if (id(heater_on_at) > 0)
            on = std::string(MODES[id(heater_sched_mode) & 3]) + " on " + clock(id(heater_on_at));
          else if (id(heater_sched_on_type))
            on = setting("On", id(heater_sched_on_type), id(heater_sched_on_h), id(heater_sched_on_m));
          if (id(heater_off_at) > 0)
            off = "Off " + clock(id(heater_off_at));
          else if (id(heater_sched_off_type))
            off = setting("Off", id(heater_sched_off_type), id(heater_sched_off_h), id(heater_sched_off_m));
          std::string text = on.empty() && off.empty() ? "No timer"
                           : on.empty() ? off : off.empty() ? on : on + "\n" + off;
          lv_label_set_text(id(heater_sched_label), text.c_str());
      - lvgl.widget.update:
          id: heater_delay_on_btn
          state:
            checked: !lambda 'return id(heater_on_at) > 0 || id(heater_sched_on_type) != 0;'
      - lvgl.widget.update:
          id: heater_delay_off_btn
          state:
            checked: !lambda 'return id(heater_off_at) > 0 || id(heater_sched_off_type) != 0;'
      # Breathe the checked fill between 50 % and 10 % opacity (3 s cycle).
      - lambda: |-
          static const lv_anim_exec_xcb_t BREATHE = [](void *obj, int32_t v) {
            const float opa = 77.0f + 51.0f * cosf(v * 6.2832f / 3000.0f);
            lv_obj_set_style_bg_opa((lv_obj_t *) obj, (lv_opa_t) opa, LV_PART_MAIN | LV_STATE_CHECKED);
          };
          auto breathe = [](lv_obj_t *btn, bool on) {
            const bool running = lv_anim_get(btn, BREATHE) != nullptr;
            if (on && !running) {
              lv_anim_t a;
              lv_anim_init(&a);
              lv_anim_set_var(&a, btn);
              lv_anim_set_values(&a, 0, 3000);
              lv_anim_set_duration(&a, 3000);
              lv_anim_set_repeat_count(&a, LV_ANIM_REPEAT_INFINITE);
              lv_anim_set_exec_cb(&a, BREATHE);
              lv_anim_start(&a);
            } else if (!on && running) {
              lv_anim_del(btn, BREATHE);
              lv_obj_set_style_bg_opa(btn, LV_OPA_50, LV_PART_MAIN | LV_STATE_CHECKED);
            }
          };
          breathe(id(heater_delay_on_btn), id(heater_on_at) > 0);
          breathe(id(heater_delay_off_btn), id(heater_off_at) > 0);

  # Delay on (which 1) / Delay off (2) button: open the timer window under
  # the timer card with that timer's setting (default: a delay of the last
  # time used, or 1 h), or
  # close it if it is already open for the same button.
  - id: heater_sched_popup_toggle
    parameters:
      which: int
    then:
      - if:
          condition:
            lambda: |-
              return !lv_obj_has_flag(id(heater_sched_popup), LV_OBJ_FLAG_HIDDEN) &&
                     id(heater_sched_edit) == which;
          then:
            - lvgl.widget.hide: heater_sched_popup
          else:
            - lambda: |-
                id(heater_sched_edit) = which;
                int type = which == 1 ? id(heater_sched_on_type) : id(heater_sched_off_type);
                int h = which == 1 ? id(heater_sched_on_h) : id(heater_sched_off_h);
                int m = which == 1 ? id(heater_sched_on_m) : id(heater_sched_off_m);
                // No timer saved: a delay of the last time used, or 1 h.
                if (type == 0) {
                  type = 2;
                  if (h == 0 && m == 0) h = 1;
                }
                id(heater_sched_edit_type) = type;
                lv_roller_set_selected(id(heater_sched_hour_roller)->obj, h, LV_ANIM_OFF);
                lv_roller_set_selected(id(heater_sched_min_roller)->obj, m, LV_ANIM_OFF);
                lv_label_set_text(id(heater_sched_popup_title), which == 1 ? "Delay on" : "Delay off");
                // From under the timer card down to the bottom of the Scenes
                // card, as wide as both.
                lv_area_t card, scenes;
                lv_obj_get_coords(id(heater_sched_card), &card);
                lv_obj_get_coords(id(card_scenes), &scenes);
                const int x1 = (int) std::min(card.x1, scenes.x1), x2 = (int) std::max(card.x2, scenes.x2);
                const int y1 = (int) card.y2 + 8;
                const int pop_w = x2 - x1 + 1, pop_h = std::max(330, (int) scenes.y2 - y1 + 1);
                lv_obj_set_pos(id(heater_sched_popup), x1, y1);
                lv_obj_set_size(id(heater_sched_popup), pop_w, pop_h);
                // Two buttons a row: 16 px margins, 12 px apart.
                lv_obj_t *const buttons[] = {id(heater_sched_type_time_btn), id(heater_sched_type_delay_btn),
                                             id(heater_sched_clear_btn), id(heater_sched_start_btn)};
                for (lv_obj_t *b : buttons) lv_obj_set_width(b, (pop_w - 2 * 16 - 12) / 2);
                // Rollers (y 104) fill the height down to 24 px above Clear /
                // Start (48 high, 16 px from the bottom); the ":" sits mid-way.
                const int roller_h = pop_h - 104 - 24 - 48 - 16;
                lv_obj_set_height(id(heater_sched_hour_roller)->obj, roller_h);
                lv_obj_set_height(id(heater_sched_min_roller)->obj, roller_h);
                lv_obj_t *colon = id(heater_sched_colon);
                const int line_h = lv_font_get_line_height(lv_obj_get_style_text_font(colon, LV_PART_MAIN));
                lv_obj_set_y(colon, 104 + (roller_h - line_h) / 2);
            - script.execute: heater_sched_popup_draw_type
            - lvgl.widget.show: heater_sched_popup

  # Fixed time / Delay selector in the timer window.
  - id: heater_sched_popup_draw_type
    then:
      - lvgl.widget.update:
          id: heater_sched_type_time_btn
          state:
            checked: !lambda 'return id(heater_sched_edit_type) == 1;'
      - lvgl.widget.update:
          id: heater_sched_type_delay_btn
          state:
            checked: !lambda 'return id(heater_sched_edit_type) == 2;'

  - id: heater_draw_target
    then:
      - lambda: |-
          const bool fan_only = id(heater_fan_on).state;   // fan mode (see heater_update_buttons)
          const float t = id(heater_target);
          char buf[12] = "--";
          if (!std::isnan(t) && t > 0) snprintf(buf, sizeof(buf), fan_only ? "%.0f" : "%.0f°", t);
          else if (!fan_only) snprintf(buf, sizeof(buf), "--°");
          lv_obj_t *show = fan_only ? id(heater_speed_label) : id(heater_target_label);
          lv_obj_t *hide = fan_only ? id(heater_target_label) : id(heater_speed_label);
          lv_label_set_text(show, buf);
          lv_obj_clear_flag(show, LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(hide, LV_OBJ_FLAG_HIDDEN);
          lv_label_set_text(id(heater_target_title), fan_only ? "Fan speed" : "Target");

  # Target - / +: shows the new value at once and sends it 700 ms after the
  # last tap, so several taps make one climate.set_temperature call.
  - id: heater_target_step
    mode: restart
    parameters:
      delta: int
    then:
      - lambda: |-
          const bool fan_only = id(heater_fan_on).state;   // fan mode (see heater_update_buttons)
          const float lo = fan_only ? 1 : 8, hi = fan_only ? 16 : 30;
          float t = id(heater_target);
          if (std::isnan(t) || t <= 0) t = fan_only ? 8 : 20;
          id(heater_target) = std::min(hi, std::max(lo, t + delta));
      - script.execute: heater_draw_target
      - delay: 700ms
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: ${heater_climate_entity}
            temperature: !lambda |-
              char buf[8];
              snprintf(buf, sizeof(buf), "%.0f", id(heater_target));
              return std::string(buf);

  # Garage button shows the controller's next action: Stop (red), Down, or Up.
  - id: garage_update_button
    then:
      - lambda: |-
          const char *icon = "\U000F0737";   // arrow-up-bold
          uint32_t color = 0x3A4DE0;
          if (id(garage_next_stop).state) {
            icon = "\U000F0666";             // stop-circle
            color = 0xDC2626;
          } else if (id(garage_next_down).state) {
            icon = "\U000F072E";             // arrow-down-bold
          }
          lv_label_set_text(id(garage_btn_icon), icon);
          lv_obj_set_style_bg_color(id(garage_btn), lv_color_hex(color), LV_PART_MAIN);

  # Presses the roller door controller's next action (Up / Stop / Down).
  - id: garage_press
    then:
      - homeassistant.action:
          action: button.press
          data:
            entity_id: !lambda |-
              if (id(garage_next_stop).state) return std::string("${garage_stop_button}");
              if (id(garage_next_down).state) return std::string("${garage_down_button}");
              return std::string("${garage_up_button}");

  # Backlight: the chosen Screen Brightness on touch/activity, dimmed to 60 %
  # of it after the "Dim screen after" time, then 20 % of it 2 minutes later.
  - id: backlight_timer
    mode: restart
    then:
      - output.set_level:
          id: backlight_pwm
          level: !lambda 'return id(screen_brightness).state / 100.0f;'
      - delay: !lambda |-
          static const uint32_t DIM_MS[] = {30000, 60000, 120000, 300000};
          const size_t i = id(screen_dim_select).active_index().value_or(1);
          return DIM_MS[i < 4 ? i : 1];
      - output.set_level:
          id: backlight_pwm
          level: !lambda 'return id(screen_brightness).state * 0.6f / 100.0f;'
      - delay: 120s
      - output.set_level:
          id: backlight_pwm
          level: !lambda 'return std::max(0.05f, id(screen_brightness).state * 0.2f / 100.0f);'

  # Return to the home page after the "Return to home after" time with no
  # touch. Restarted by every touch; does nothing when set to Off or while a
  # call is ringing or active (the call screens manage their own page).
  - id: home_return_timer
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(home_return_select).active_index().value_or(2) > 0;'
          then:
            - delay: !lambda |-
                static const uint32_t HOME_MS[] = {0, 30000, 60000, 120000, 300000};
                const size_t i = id(home_return_select).active_index().value_or(2);
                return HOME_MS[i < 5 ? i : 2];
            - if:
                condition:
                  lambda: 'return id(phone).is_idle() && !id(home_page)->is_showing();'
                then:
                  - lvgl.widget.hide: reboot_confirm
                  - lvgl.page.show:
                      id: home_page
                      animation: FADE_IN
                      time: 250ms
                  - script.execute: update_call_tile

binary_sensor:
  - platform: gpio
    name: Boot Button
    id: boot_button
    pin:
      number: ${boot_button_pin}
      inverted: true
      mode:
        input: true
        pullup: true
    on_multi_click:
      # Single click: answer an incoming call, otherwise call / hang up.
      - timing:
          - ON for at most 500ms
          - OFF for at least 400ms
        then:
          - if:
              condition:
                voip_stack.is_ringing:
              then:
                - voip_stack.answer_call:
              else:
                - voip_stack.call_toggle:
      # Long press: toggle mic mute
      - timing:
          - ON for 1s to 3s
          - OFF for at least 300ms
        then:
          - switch.toggle: mute

  # Garage roller door (see the garage_* substitutions)
  - platform: homeassistant
    id: garage_next_up
    entity_id: ${garage_next_up_entity}
    internal: true
    on_state:
      - script.execute: garage_update_button

  - platform: homeassistant
    id: garage_next_stop
    entity_id: ${garage_next_stop_entity}
    internal: true
    on_state:
      - script.execute: garage_update_button

  - platform: homeassistant
    id: garage_next_down
    entity_id: ${garage_next_down_entity}
    internal: true
    on_state:
      - script.execute: garage_update_button

  # Lights card: HA light state. light_tiles_check redraws the tiles on every
  # change; it also runs after boot and every 3 s (see on_boot / interval).
  - platform: homeassistant
    id: light_tv_lamp_on
    entity_id: ${light_tv_lamp_entity}
    internal: true
    on_state:
      - script.execute: light_tiles_check
  - platform: homeassistant
    id: light_living_left_on
    entity_id: ${light_living_left_entity}
    internal: true
    on_state:
      - script.execute: light_tiles_check
  - platform: homeassistant
    id: light_living_right_on
    entity_id: ${light_living_right_entity}
    internal: true
    on_state:
      - script.execute: light_tiles_check

  # Gas heater: highlight Off / Heat / Fan from the Rinnai switches
  - platform: homeassistant
    id: heater_power_on
    entity_id: ${heater_power_switch}
    internal: true
    on_state:
      - script.execute: heater_state_changed
  - platform: homeassistant
    id: heater_fan_on
    entity_id: ${heater_fan_switch}
    internal: true
    on_state:
      - script.execute: heater_state_changed

switch:
  # Echo cancellation on/off (esp_aec through esp_audio_stack).
  - platform: esp_audio_stack
    aec:
      id: aec_switch
      name: Echo Cancellation
      icon: mdi:ear-hearing
      restore_mode: RESTORE_DEFAULT_ON

  # Evaporative cooler relay on CN2 pin 2 (GPIO37), wired across the cooler
  # controller's power button (COM + NO). Pressed by the cooler_press script
  # ("Evaporative Cooler Power" button), as in the garage door controller.
  # inverted: for an active-low relay module, which stays off while UART0 TX
  # idles high during boot. Remove it only for a high-level-trigger module.
  - platform: gpio
    id: cooler_relay
    name: Evaporative Cooler Relay
    icon: mdi:air-conditioner
    pin:
      number: ${cooler_relay_pin}
      inverted: true
    restore_mode: ALWAYS_OFF

  # VoIP camera (OV02C10): send video on calls. Can be set at any time; while
  # idle it is the choice for the next call, during a call it adds or drops
  # the outgoing video. The sensor itself only captures while a call with
  # negotiated video consumes its frames.
  - platform: template
    name: Camera
    id: camera_switch
    icon: mdi:camera
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - voip_stack.set_video_send:
          enabled: true
    on_turn_off:
      - voip_stack.set_video_send:
          enabled: false

  - platform: template
    name: Mic Mute
    id: mute
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - logger.log:
          level: INFO
          tag: mute
          format: "Mic mute ON"
      - microphone.mute: mic_aec
    on_turn_off:
      - logger.log:
          level: INFO
          tag: mute
          format: "Mic mute OFF"
      - microphone.unmute: mic_aec

  # Speaker Mute: DAC mute plus amplifier enable/disable
  - platform: template
    name: Speaker Mute
    id: speaker_mute
    icon: mdi:volume-off
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - logger.log:
          level: INFO
          tag: mute
          format: "Speaker mute ON: DAC muted, amplifier off"
      - speaker.mute_on: hw_speaker
      - delay: 50ms
      - output.turn_off: speaker_enable
    on_turn_off:
      - logger.log:
          level: INFO
          tag: mute
          format: "Speaker mute OFF: DAC unmuted, amplifier follows playback"
      - if:
          condition:
            speaker.is_playing: hw_speaker
          then:
            - output.turn_on: speaker_enable
            - delay: 50ms
      - speaker.mute_off: hw_speaker

# Display settings, also shown in Home Assistant. All restore after a reboot;
# the settings page dropdowns and slider set these.
select:
  - platform: template
    id: screen_dim_select
    name: Screen Dim After
    icon: mdi:brightness-6
    entity_category: config
    options: ["30 seconds", "1 minute", "2 minutes", "5 minutes"]
    initial_option: "1 minute"
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: backlight_timer
  - platform: template
    id: home_return_select
    name: Return To Home After
    icon: mdi:home-clock
    entity_category: config
    options: ["Off", "30 seconds", "1 minute", "2 minutes", "5 minutes"]
    initial_option: "1 minute"
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: home_return_timer
  # Media card speaker picker: mirrors the options (media_player entity ids)
  # and state of ${media_speaker_select_entity}. Internal, as HA already has
  # the input_select. Room for 32 options / 1 KB of entity ids.
  - platform: homeassistant
    id: media_speaker_select
    entity_id: ${media_speaker_select_entity}
    internal: true
    max_options: 32
    options_buffer_size: 1024

number:
  - platform: template
    id: screen_brightness
    name: Screen Brightness
    icon: mdi:brightness-percent
    entity_category: config
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 5
    initial_value: 100
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: backlight_timer

button:
  # One press of the evaporative cooler's power button (toggles it on/off).
  - platform: template
    name: Evaporative Cooler Power
    id: btn_cooler_power
    icon: mdi:air-conditioner
    on_press:
      - script.execute: cooler_press

  # Re-reads the 14-day energy history from HA (also runs on connect and at 00:05).
  - platform: template
    name: Refresh Energy History
    icon: mdi:chart-bar
    entity_category: diagnostic
    on_press:
      - script.execute: fetch_energy_history

sensor:
  # Wi-Fi signal (dBm) and the same as a percentage; the status bar shows %.
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy # WiFi signal in %
    source_id: wifi_signal_db
    id: wifi_signal_pct
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""
    on_value:
      then:
        - script.execute: update_status_bar

  - platform: homeassistant
    id: garage_position
    entity_id: ${garage_position_entity}
    internal: true
    on_value:
      # Position 100 % = fully open (no slats), 0 % = closed (frame full).
      - lambda: |-
          int pos = (int) x;
          if (pos < 0) pos = 0;
          if (pos > 100) pos = 100;
          // Percent of the frame, not pixels: the Security page is not laid
          // out until it is first shown, so its measured height is 0 at boot.
          lv_obj_set_height(id(garage_door_curtain), lv_pct(100 - pos));
          // Status and icon from the position: 0-3 % closed, 97-100 % open.
          const char *status = pos <= 3 ? "Closed" : pos >= 97 ? "Open" : "Partly open";
          lv_label_set_text(id(garage_status_label), status);
          lv_label_set_text(id(garage_icon), pos <= 3 ? "\U000F06D9" : "\U000F06DA");

  - platform: homeassistant
    id: ha_power
    entity_id: ${power_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: elec_value_label
          text:
            format: "%.1f"
            args: ['x / 1000.0f']
      - lvgl.arc.update:
          id: elec_arc
          value: !lambda 'return (int) x;'

  - platform: homeassistant
    id: ha_temp_living
    entity_id: ${temp_living_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: temp_living_label
          text:
            format: "%.1f°"
            args: ['x']
      # Gas heater card: "Current" ring.
      - lvgl.label.update:
          id: heater_current_label
          text:
            format: "%.0f°"
            args: ['x']
      - lvgl.arc.update:
          id: heater_current_arc
          value: !lambda 'return (int) roundf(std::min(35.0f, std::max(10.0f, x)));'
      # Ring colour by temperature: blue below 15°, orange 15-24°, red from 24°.
      - lambda: |-
          const uint32_t color = x < 15 ? 0x6A7BFF : x < 24 ? 0xE46F33 : 0xE03E1D;
          lv_obj_set_style_arc_color(id(heater_current_arc), lv_color_hex(color), LV_PART_INDICATOR);

  # Gas heater target (climate "temperature" attribute).
  - platform: homeassistant
    id: heater_target_sensor
    entity_id: ${heater_climate_entity}
    attribute: temperature
    internal: true
    on_value:
      - if:
          condition:
            lambda: return !id(heater_target_step).is_running();   # not while a tap is pending
          then:
            - lambda: id(heater_target) = x;
            - script.execute: heater_draw_target

  - platform: homeassistant
    id: ha_temp_bedroom
    entity_id: ${temp_bedroom_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: temp_bedroom_label
          text:
            format: "%.1f°"
            args: ['x']

  - platform: homeassistant
    id: ha_temp_outdoor
    entity_id: ${temp_outdoor_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: temp_outdoor_label
          text:
            format: "%.1f°"
            args: ['x']

  - platform: homeassistant
    id: ha_humidity
    entity_id: ${humidity_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: humidity_label
          text:
            format: "%.0f%%"
            args: ['x']

  - platform: homeassistant
    id: ha_soil_moisture
    entity_id: ${soil_moisture_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: soil_now_label
          text:
            format: "Today %.0f%%"
            args: ['x * ${soil_moisture_scale}']

text_sensor:
  ##RTSP camera url.
  - platform: homeassistant
    id: cam_url
    entity_id: input_text.esp_camera_url
    on_value:
      - lambda: id(front_door_full).set_url(x);
  - platform: homeassistant
    id: cam_url_driveway
    entity_id: input_text.esp_camera_url_driveway
    on_value:
      - lambda: id(driveway_full).set_url(x);

  # Gas heater status under the title, from the climate hvac_action.
  - platform: homeassistant
    id: heater_action
    entity_id: ${heater_climate_entity}
    attribute: hvac_action
    internal: true
    on_value:
      - lvgl.label.update:
          id: heater_status_label
          text: !lambda |-
            if (x == "heating") return std::string("Heating");
            if (x == "idle") return std::string("Idle");
            if (x == "fan") return std::string("Fan only");
            if (x == "off") return std::string("Off");
            return x;

  # Media card: which media_player to show (an entity id held in HA).
  - platform: homeassistant
    id: media_entity
    entity_id: ${media_player_select_entity}
    internal: true
    on_value:
      - lambda: |-
          id(media_state) = id(media_title) = id(media_artist) = id(media_name) = "";
          id(media_picture) = id(media_content_id) = "";
          id(media_duration) = id(media_pos) = 0;
          id(media_pos_at) = 0;
          lv_obj_add_flag(id(media_art), LV_OBJ_FLAG_HIDDEN);
      - script.execute: media_draw
      - script.execute: media_poll

  # Frigate snapshots for the home page tiles. The image entity's state
  # changes on every new detection; its entity_picture attribute is the
  # tokenised image-proxy path (the token rotates, so it is read each time).
  - platform: homeassistant
    id: snap_front_picture
    entity_id: ${snapshot_front_entity}
    attribute: entity_picture
    internal: true
    on_value:
      - if:
          condition:
            lambda: return !id(snap_front_loaded);
          then:
            - script.execute: fetch_front_snapshot
  - platform: homeassistant
    id: snap_front_state
    entity_id: ${snapshot_front_entity}
    internal: true
    on_value:
      - script.execute: fetch_front_snapshot
      - if:
          condition:
            lambda: return id(cam_front_page)->is_showing();
          then:
            - script.execute: fetch_front_cam_snaps
  - platform: homeassistant
    id: snap_driveway_picture
    entity_id: ${snapshot_driveway_entity}
    attribute: entity_picture
    internal: true
    on_value:
      - if:
          condition:
            lambda: return !id(snap_driveway_loaded);
          then:
            - script.execute: fetch_driveway_snapshot
  - platform: homeassistant
    id: snap_driveway_state
    entity_id: ${snapshot_driveway_entity}
    internal: true
    on_value:
      - script.execute: fetch_driveway_snapshot
      - if:
          condition:
            lambda: return id(cam_driveway_page)->is_showing();
          then:
            - script.execute: fetch_driveway_cam_snaps

  # Camera pages: cat snapshots (the person ones are above). The
  # *_picture sensors hold the tokenised image-proxy path; a change of the
  # entity state means a new detection, which refreshes the column if its
  # page is on screen.
  - platform: homeassistant
    id: cam_front_cat_picture
    entity_id: ${snapshot_front_cat_entity}
    attribute: entity_picture
    internal: true
  - platform: homeassistant
    id: cam_front_cat_state
    entity_id: ${snapshot_front_cat_entity}
    internal: true
    on_value:
      - if:
          condition:
            lambda: return id(cam_front_page)->is_showing();
          then:
            - script.execute: fetch_front_cam_snaps
  - platform: homeassistant
    id: cam_drive_cat_picture
    entity_id: ${snapshot_driveway_cat_entity}
    attribute: entity_picture
    internal: true
  - platform: homeassistant
    id: cam_drive_cat_state
    entity_id: ${snapshot_driveway_cat_entity}
    internal: true
    on_value:
      - if:
          condition:
            lambda: return id(cam_driveway_page)->is_showing();
          then:
            - script.execute: fetch_driveway_cam_snaps

  - platform: homeassistant
    id: front_lock_state
    entity_id: ${front_lock_entity}
    internal: true
    on_value:
      # Security page: "Locked", "Unlocked", "Jammed"...
      - lvgl.label.update:
          id: front_lock_status_label
          text: !lambda |-
            std::string s = x;
            if (!s.empty()) s[0] = toupper(s[0]);
            return s;

  - platform: homeassistant
    id: garage_lock_state
    entity_id: ${garage_lock_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: garage_lock_status_label
          text: !lambda |-
            std::string s = x;
            if (!s.empty()) s[0] = toupper(s[0]);
            return s;

interval:
  # Lights card: re-sync the tiles with HA (catches a missed state update).
  # Settings page: uptime in whole minutes, only while that page is shown.
  - interval: 3s
    then:
      - script.execute: light_tiles_check
      - if:
          condition:
            lambda: return id(settings_p4_page)->is_showing();
          then:
            - script.execute: update_settings_info

  - interval: 1s
    then:
      # Media card: the player state is read from HA when the page opens and
      # after a button press (media_poll); in between, the progress bar is
      # counted here from that position. At the end of the track, read the
      # state again for the next one (at most every 5 s, one request at a time).
      - if:
          condition:
            lambda: return id(entertainment_page)->is_showing() && id(media_state) == "playing";
          then:
            - script.execute: media_tick
            - if:
                condition:
                  lambda: |-
                    static uint32_t last_poll = 0;
                    const auto now = id(my_time).now();
                    if (id(media_duration) <= 0 || id(media_pos_at) <= 0 || !now.is_valid()) return false;
                    if (id(media_pos) + (now.timestamp - id(media_pos_at)) < id(media_duration) + 1) return false;
                    if (id(media_poll).is_running() || id(media_command).is_running() ||
                        id(media_fetch_art).is_running() ||
                        millis() - last_poll < 5000) return false;
                    last_poll = millis();
                    return true;
                then:
                  - script.execute: media_poll

      # Heating and Cooling Delay on / Delay off timers.
      - script.execute: heater_sched_check

  # Home page clock card. The clock shows no seconds, so every 45 s is enough
  - interval: 45s
    then:
      - script.execute: update_clock
      # Check the Wi-Fi signal every 45 s, too, so the status bar shows it promptly.
      - script.execute: update_status_bar

  - interval: 20min
    then:
      - script.execute: calendar_fetch