                        widgets:
                          - label: {align: LEFT_MID, x: 14, text: "\U000F0594", text_font: font_mdi_36, text_color: 0xB8C8F0}
                          - label: {align: LEFT_MID, x: 62, text: "Night", text_font: font_body}
                    - button:
