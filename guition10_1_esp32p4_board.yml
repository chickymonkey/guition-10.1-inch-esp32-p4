      - "\U000F04CE"
      - "\U000F0594"
      - "\U000F032A"
      - "\U000F02DC"


lvgl:
  displays:
    - main_display
  touchscreens:
    - main_touch
  color_depth: 16
  byte_order: little_endian
  log_level: WARN
  rotation: 270
  on_boot:
    # p4_video_renderer draws decoded call video straight into this container.
    - lambda: id(p4_video).attach_video_container(id(call_video_surface));
    - script.execute: update_call_tile
    - script.execute: settings_sync_widgets

  style_definitions:
    # transparent grid cell: its 6 px padding makes the 12 px gap between cards
    - id: cell_style
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 6
    - id: card_style
      bg_color: 0x0F1B40
      border_color: 0x1F3270
      border_width: 1
      radius: 14
      pad_all: 0
      text_color: 0xE8EDFF
    - id: icon_24
      text_font: font_mdi_24
      text_color: 0xE8EDFF
    - id: title_text
      text_font: font_body
      text_color: 0xE8EDFF
    - id: round_btn
      radius: 100
      border_width: 0
      shadow_width: 0
    - id: mode_btn
      bg_color: 0x12245A
      border_color: 0x2A3F86
      border_width: 1
      radius: 9
      shadow_width: 0
    - id: scene_btn
      bg_color: 0x13245A
      border_color: 0x2A3F86
      border_width: 1
      radius: 12
      shadow_width: 0
    - id: tile_style
      border_width: 1
      radius: 12
      pad_all: 0
    - id: ebar
      width: 12
      radius: 2
      border_width: 0
      bg_color: 0x2F6BFF
      bg_grad_color: 0x8A4DFF
      bg_grad_dir: VER

  pages:
    - id: home_page
      # 18 rows x 13 columns of equal size. Written out in full (not "18x13")
      # because pad_row/pad_column are only accepted inside layout:.
      layout:
        type: grid
        grid_rows: [FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1),
                    FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1)]
        grid_columns: [FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1),
                       FR(1), FR(1), FR(1), FR(1), FR(1), FR(1)]
        pad_row: 0
        pad_column: 0
      bg_color: 0x08112B
      pad_all: 0
      scrollable: false
      # Swipe up opens settings.
      on_swipe_up:
        - lvgl.page.show:
            id: settings_p4_page
            animation: MOVE_TOP
            time: 250ms
      widgets:
        # ---- row 0: header goes here later ------------------------------------

        # =====================================================================
        # SIDEBAR                            col 0 span 1 | row 1 span 16
        # =====================================================================
        - obj:
            styles: cell_style
            scrollable: false
            grid_cell_column_pos: 0
            grid_cell_row_pos: 1
            grid_cell_column_span: 1
            grid_cell_row_span: 16
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            layout:
              type: flex
              flex_flow: COLUMN
              flex_align_main: START
              flex_align_cross: CENTER
              pad_row: 12
            widgets:
              - button:
                  id: nav_home_btn
                  styles: scene_btn
                  width: 100%
                  height: 84
                  bg_color: 0x4A3DF0
                  border_color: 0x7B66FF
                  widgets:
                    - label: {align: TOP_MID, y: 14, text: "\U000F02DC", text_font: font_mdi_24, text_color: 0xFFFFFF}
                    - label: {align: BOTTOM_MID, y: -12, text: "Home", text_font: font_small}
              - button:
                  id: nav_settings_btn
                  styles: scene_btn
                  width: 100%
                  height: 84
                  on_click:
                    - lvgl.page.show:
                        id: settings_p4_page
                        animation: MOVE_TOP
                        time: 250ms
                  widgets:
                    - label: {align: TOP_MID, y: 14, text: "\U000F0493", text_font: font_mdi_24, text_color: 0xE8EDFF}
                    - label: {align: BOTTOM_MID, y: -12, text: "Settings", text_font: font_small}

        # =====================================================================
        # 1. WALLPAPER / DIGITAL CLOCK       col 1 span 4 | row 1 span 5
        # =====================================================================
        - obj:
            styles: cell_style
            scrollable: false
            grid_cell_column_pos: 1
            grid_cell_row_pos: 1
            grid_cell_column_span: 4
            grid_cell_row_span: 5
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - obj:
                  id: card_clock
                  styles: card_style
                  width: 100%
                  height: 100%
                  scrollable: false
                  clip_corner: true
                  bg_color: 0x1B1260
                  bg_grad_color: 0x7A3FA0
                  bg_grad_dir: VER
                  border_width: 0
                  widgets:
                    - obj:          # moon
                        width: 36
                        height: 36
                        radius: 18
                        align: TOP_RIGHT
                        x: -44
                        y: 28
                        bg_color: 0xC9B8FF
                        bg_opa: 85%
                        border_width: 0
                    - label:
                        id: clock_time_label
                        align: CENTER
                        y: -24
                        text: "--:--"
                        text_font: font_clock_big
                        text_color: 0xFFFFFF
                    - label:
                        id: clock_day_label
                        align: CENTER
                        y: 40
                        text: ""
                        text_font: font_ui_medium
                        text_color: 0xFFFFFF
                    - label:
                        id: clock_date_label
                        align: CENTER
                        y: 72
                        text: ""
                        text_font: font_small
                        text_color: 0xD6CCFF

        # =====================================================================
        # 2. GAS HEATER                      col 5 span 4 | row 1 span 5
        # =====================================================================
        - obj:
            styles: cell_style
            scrollable: false
            grid_cell_column_pos: 5
            grid_cell_row_pos: 1
            grid_cell_column_span: 4
            grid_cell_row_span: 5
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - obj:
                  id: card_heater
                  styles: card_style
                  width: 100%
                  height: 100%
                  scrollable: false
                  widgets:
                    - label:
                        styles: icon_24
                        x: 14
                        y: 10
                        text: "\U000F0238"
                    - label:
                        styles: title_text
                        x: 48
                        y: 8
                        text: "Gas Heater"
                    - obj:          # heater picture placeholder (swap for an image: later)
                        x: 18
                        y: 46
                        width: 130
                        height: 84
                        radius: 8
                        bg_color: 0x15171C
                        border_color: 0x333333
                        border_width: 3
                        pad_all: 0
                        scrollable: false
                        widgets:
                          - obj:
                              align: BOTTOM_MID
                              width: 100%
                              height: 50%
                              radius: 3
                              border_width: 0
                              bg_color: 0xFF9A2E
                              bg_grad_color: 0xC8350A
                              bg_grad_dir: VER
                    - button:
                        id: heater_power_btn
                        styles: round_btn
                        align: TOP_RIGHT
                        x: -26
                        y: 52
                        width: 52
                        height: 52
                        bg_color: 0x6A3DFF
                        on_click:
                          - homeassistant.action:
                              action: homeassistant.toggle
                              data:
                                entity_id: ${heater_entity}
                        widgets:
                          - label:
                              align: CENTER
                              text: "\U000F0425"
                              text_font: font_mdi_36
                              text_color: 0xFFFFFF
                    - obj:          # mode buttons row
                        align: BOTTOM_MID
                        y: -12
                        width: 354
                        height: 40
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        layout:
                          type: flex
                          flex_flow: ROW
                          flex_align_main: SPACE_BETWEEN
                          flex_align_cross: CENTER
                        widgets:
                          - button:
                              id: heater_btn_off
                              styles: mode_btn
                              width: 82
                              height: 40
                              checked:
                                bg_color: 0x5A3DF0
                                border_color: 0x7B66FF
                              on_click:
                                - homeassistant.action:
                                    action: climate.set_hvac_mode
                                    data:
                                      entity_id: ${heater_entity}
                                      hvac_mode: "off"
                              widgets:
                                - label: {align: CENTER, text: "Off", text_font: font_small}
                          - button:
                              id: heater_btn_heat
                              styles: mode_btn
                              width: 82
                              height: 40
                              checked:
                                bg_color: 0x5A3DF0
                                border_color: 0x7B66FF
                              on_click:
                                - homeassistant.action:
                                    action: climate.set_hvac_mode
                                    data:
                                      entity_id: ${heater_entity}
                                      hvac_mode: "heat"
                              widgets:
                                - label: {align: CENTER, text: "Heat", text_font: font_small}
                          - button:
                              id: heater_btn_fan
                              styles: mode_btn
                              width: 82
                              height: 40
                              checked:
                                bg_color: 0x5A3DF0
                                border_color: 0x7B66FF
                              on_click:
                                - homeassistant.action:
                                    action: climate.set_hvac_mode
                                    data:
                                      entity_id: ${heater_entity}
                                      hvac_mode: "fan_only"
                              widgets:
                                - label: {align: CENTER, text: "Fan", text_font: font_small}
                          - button:
                              id: heater_btn_auto
                              styles: mode_btn
                              width: 82
                              height: 40
                              checked:
                                bg_color: 0x5A3DF0
                                border_color: 0x7B66FF
                              on_click:
                                - homeassistant.action:
                                    action: climate.set_hvac_mode
                                    data:
                                      entity_id: ${heater_entity}
                                      hvac_mode: "heat_cool"
                              widgets:
                                - label: {align: CENTER, text: "Auto", text_font: font_small}

        # =====================================================================
        # 3. FRONT DOOR LOCK                 col 9 span 2 | row 1 span 5
        # =====================================================================
        - obj:
            styles: cell_style
            scrollable: false
            grid_cell_column_pos: 9
            grid_cell_row_pos: 1
            grid_cell_column_span: 2
            grid_cell_row_span: 5
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - obj:
                  id: card_front_lock
                  styles: card_style
                  width: 100%
                  height: 100%
                  scrollable: false
                  widgets:
                    - label:
                        id: front_lock_icon
                        styles: icon_24
                        text_color: 0x27D98D
                        x: 12
                        y: 10
                        text: "\U000F033E"
                    - label:
                        x: 44
                        y: 12
                        text: "Front Door Lock"
                        text_font: font_small
                    - obj:          # lock picture placeholder
                        x: 24
                        y: 58
                        width: 46
                        height: 110
                        radius: 8
                        bg_color: 0x1E1E24
                        border_color: 0x3A3A42
                        border_width: 2
                    - button:
                        id: front_lock_btn
                        styles: round_btn
                        align: BOTTOM_RIGHT
                        x: -14
                        y: -22
                        width: 48
                        height: 48
                        bg_color: 0x7A2A2A          # unlocked
                        checked:
                          bg_color: 0x0F5B44        # locked
                        on_click:
                          - if:
                              condition:
                                text_sensor.state:
                                  id: front_lock_state
                                  state: "locked"
                              then:
                                - homeassistant.action:
                                    action: lock.unlock
                                    data:
                                      entity_id: ${front_lock_entity}
                              else:
                                - homeassistant.action:
                                    action: lock.lock
                                    data:
                                      entity_id: ${front_lock_entity}
                        widgets:
                          - label:
                              align: CENTER
                              text: "\U000F033E"
                              text_font: font_mdi_24
                              text_color: 0xFFFFFF

        # =====================================================================
        # 4. GARAGE DOOR                     col 11 span 2 | row 1 span 5
        # =====================================================================
        - obj:
            styles: cell_style
            scrollable: false
            grid_cell_column_pos: 11
            grid_cell_row_pos: 1
            grid_cell_column_span: 2
            grid_cell_row_span: 5
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - obj:
                  id: card_garage
                  styles: card_style
                  width: 100%
                  height: 100%
                  scrollable: false
                  widgets:
                    - label:
                        id: garage_icon
                        styles: icon_24
                        x: 12
                        y: 10
                        text: "\U000F06D9"
                    - label:
                        x: 44
                        y: 12
                        text: "Garage Door"
                        text_font: font_small
                    - obj:          # garage picture placeholder
                        align: TOP_MID
                        y: 52
                        width: 150
                        height: 110
                        radius: 8
                        bg_color: 0x2C3340
                        border_color: 0x3A4352
                        border_width: 2
                    - button:
                        id: garage_btn
                        styles: round_btn
                        align: BOTTOM_RIGHT
                        x: -12
                        y: -14
                        width: 52
                        height: 52
                        bg_color: 0x3A4DE0
                        on_click:
                          - homeassistant.action:
                              action: cover.toggle
                              data:
                                entity_id: ${garage_entity}
                        widgets:
                          - label:
                              align: CENTER
                              text: "\U000F06D9"
                              text_font: font_mdi_24
                              text_color: 0xFFFFFF

        # =====================================================================
        # 5. INTERCOM                        col 1 span 4 | row 6 span 6
        # =====================================================================
        - obj:
            styles: cell_style
            scrollable: false
            grid_cell_column_pos: 1
            grid_cell_row_pos: 6
            grid_cell_column_span: 4
            grid_cell_row_span: 6
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              # VoIP panel. Sized by the grid cell (about 382x255); the call-state
              # groups fill the right 60% and update_call_tile shows one at a time.
              - obj:
                  id: voip_tile
                  styles: card_style
                  width: 100%
                  height: 100%
                  scrollable: false
                  scrollbar_mode: "off"
                  clip_corner: true
                  widgets:
                    - label:
                        styles: icon_24
                        x: 14
                        y: 10
                        text: "\U000F0869"
                    - label:
                        styles: title_text
                        x: 48
                        y: 8
                        text: "Intercom"
                    - obj:          # door-station picture placeholder
                        align: BOTTOM_LEFT
                        x: 12
                        y: -12
                        width: 130
                        height: 196
                        radius: 10
                        border_width: 0
                        bg_color: 0xD7D9DE
                        bg_grad_color: 0x3B6B3A
                        bg_grad_dir: HOR
                        scrollable: false
                        widgets:
                          - obj:
                              x: 22
                              y: 24
                              width: 52
                              height: 120
                              radius: 6
                              border_width: 0
                              bg_color: 0x15171C

                    # ---- idle: contact browser ----
                    - obj:
                        id: call_idle_group
                        align: TOP_RIGHT
                        width: 60%
                        height: 100%
                        bg_opa: TRANSP
                        border_width: 0
                        radius: 0
                        pad_all: 0
                        scrollable: false
                        scrollbar_mode: "off"
                        widgets:
                          - label:
                              id: call_idle_header_label
                              align: TOP_RIGHT
                              x: -14
                              y: 12
                              text: "Keypad"
                              text_color: 0x7C83FF
                              text_font: font_small
                              clickable: true
                              gesture_bubble: false
                              on_click:
                                - script.execute: show_voip_keypad
                          - obj:
                              id: call_idle_header_rule
                              align: TOP_RIGHT
                              x: -14
                              y: 32
                              width: 54
                              height: 2
                              bg_color: 0x7C83FF
                              border_width: 0
                              radius: 1
                          - label:
                              id: call_idle_destination_label
                              align: TOP_MID
                              y: 44
                              width: 210
                              text: "Destination"
                              text_color: 0x8A94A6
                              text_font: font_small
                              text_align: CENTER
                          - label:
                              id: call_idle_peer_label
                              align: TOP_MID
                              y: 66
                              width: 210
                              text: "-"
                              text_color: 0xFFFFFF
                              text_font: font_title
                              text_align: CENTER
                              long_mode: DOT
                          - label:
                              id: call_idle_contacts_label
                              align: TOP_MID
                              y: 108
                              text: "Contacts: 0"
                              text_color: 0x8A94A6
                              text_font: font_small
                          - label:
                              id: call_idle_hint_label
                              align: TOP_MID
                              y: 134
                              width: 210
                              text: "Swipe to browse"
                              text_color: 0x667085
                              text_font: font_small
                              text_align: CENTER
                              long_mode: DOT
                          - obj:
                              id: call_idle_swipe_area
                              align: TOP_MID
                              y: 40
                              width: 100%
                              height: 120
                              bg_opa: TRANSP
                              border_width: 0
                              scrollable: false
                              clickable: true
                              gesture_bubble: false
                              on_swipe_left:
                                - voip_stack.next_contact:
                                - script.execute: update_ic_idle_labels
                              on_swipe_right:
                                - voip_stack.prev_contact:
                                - script.execute: update_ic_idle_labels
                          - button:
                              id: call_prev_btn
                              align: BOTTOM_LEFT
                              x: 8
                              y: -16
                              width: 58
                              height: 50
                              bg_color: 0x13245A
                              radius: 9
                              on_click:
                                - voip_stack.prev_contact:
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "\U000F0141"
                                    text_color: 0xE5E7EB
                                    text_font: font_action_icon
                          - button:
                              id: call_button_widget
                              align: BOTTOM_MID
                              y: -12
                              width: 78
                              height: 58
                              bg_color: 0x22C55E
                              radius: 9
                              on_click:
                                - voip_stack.call_toggle:
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "\U000F03F2"
                                    text_color: 0xFFFFFF
                                    text_font: font_action_icon
                          - button:
                              id: call_next_btn
                              align: BOTTOM_RIGHT
                              x: -8
                              y: -16
                              width: 58
                              height: 50
                              bg_color: 0x13245A
                              radius: 9
                              on_click:
                                - voip_stack.next_contact:
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "\U000F0142"
                                    text_color: 0xE5E7EB
                                    text_font: font_action_icon

                    # ---- idle: dial keypad (slides in over the contact browser) ----
                    - obj:
                        id: call_keypad_group
                        align: TOP_RIGHT
                        width: 60%
                        height: 100%
                        bg_color: 0x0F1B40
                        border_width: 0
                        radius: 0
                        pad_all: 0
                        scrollable: false
                        clickable: true
                        gesture_bubble: false
                        hidden: true
                        widgets:
                          - label:
                              id: call_keypad_value_label
                              align: TOP_LEFT
                              x: 8
                              y: 12
                              width: 140
                              text: "Enter number"
                              text_color: 0xFFFFFF
                              text_font: font_small
                              long_mode: DOT
                          - label:
                              id: call_keypad_header_label
                              align: TOP_RIGHT
                              x: -14
                              y: 12
                              text: "Contacts"
                              text_color: 0x7C83FF
                              text_font: font_small
                              clickable: true
                              gesture_bubble: false
                              on_click:
                                - script.execute: hide_voip_keypad
                          - obj:
                              id: call_keypad_header_rule
                              align: TOP_RIGHT
                              x: -14
                              y: 32
                              width: 66
                              height: 2
                              bg_color: 0x7C83FF
                              border_width: 0
                              radius: 1
                          - buttonmatrix:
                              id: call_keypad_matrix
                              align: TOP_MID
                              y: 38
                              width: 216
                              height: 160
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              pad_row: 6
                              pad_column: 6
                              gesture_bubble: true
                              items:
                                bg_color: 0x13245A
                                text_color: 0xFFFFFF
                                text_font: font_body
                                radius: 8
                              rows:
                                - buttons:
                                    - text: "1"
                                    - text: "2"
                                    - text: "3"
                                - buttons:
                                    - text: "4"
                                    - text: "5"
                                    - text: "6"
                                - buttons:
                                    - text: "7"
                                    - text: "8"
                                    - text: "9"
                                - buttons:
                                    - text: "*"
                                    - text: "0"
                                    - text: "#"
                              on_click:
                                - lambda: |-
                                    static constexpr char KEYS[] = "123456789*0#";
                                    if (x >= 12 || id(voip_dial_buffer).size() >= 32) return;
                                    id(voip_dial_buffer).push_back(KEYS[x]);
                                    lv_label_set_text(id(call_keypad_value_label), id(voip_dial_buffer).c_str());
                          - button:
                              align: BOTTOM_LEFT
                              x: 8
                              y: -8
                              width: 62
                              height: 42
                              bg_color: 0x13245A
                              radius: 8
                              on_click:
                                - lambda: |-
                                    id(voip_dial_buffer).clear();
                                    lv_label_set_text(id(call_keypad_value_label), "Enter number");
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "CLEAR"
                                    text_color: 0xE5E7EB
                                    text_font: font_small
                          - button:
                              align: BOTTOM_MID
                              y: -8
                              width: 78
                              height: 42
                              bg_color: 0x22C55E
                              radius: 8
                              on_click:
                                - if:
                                    condition:
                                      lambda: return !id(voip_dial_buffer).empty();
                                    then:
                                      - voip_stack.call:
                                          target: !lambda 'return id(voip_dial_buffer);'
                                      - lambda: |-
                                          id(voip_dial_buffer).clear();
                                          lv_label_set_text(id(call_keypad_value_label), "Enter number");
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "\U000F03F2"
                                    text_color: 0xFFFFFF
                                    text_font: font_mdi_24
                          - button:
                              align: BOTTOM_RIGHT
                              x: -8
                              y: -8
                              width: 62
                              height: 42
                              bg_color: 0x13245A
                              radius: 8
                              on_click:
                                - lambda: |-
                                    if (!id(voip_dial_buffer).empty()) id(voip_dial_buffer).pop_back();
                                    lv_label_set_text(id(call_keypad_value_label), id(voip_dial_buffer).empty()
                                        ? "Enter number" : id(voip_dial_buffer).c_str());
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "DEL"
                                    text_color: 0xE5E7EB
                                    text_font: font_small

                    # ---- incoming call ----
                    - obj:
                        id: call_ringing_in_group
                        align: TOP_RIGHT
                        width: 60%
                        height: 100%
                        bg_color: 0x2A0710
                        border_width: 0
                        radius: 0
                        pad_all: 0
                        scrollable: false
                        hidden: true
                        widgets:
                          - label:
                              align: TOP_MID
                              y: 14
                              text: "Incoming call"
                              text_color: 0xFF5B6E
                              text_font: font_ui_medium
                          - label:
                              id: call_ringing_in_peer_label
