                              id: aec_mode_select
                              index: !lambda 'return x;'

              - obj:
                  width: ${settings_row_width}
                  height: ${settings_row_height}
                  bg_opa: TRANSP
                  border_width: 0
                  pad_left: 12
                  pad_right: 12
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        width: ${settings_mid_width}
                        text: "Noise suppression"
                        text_align: LEFT
                        text_color: 0xFFFFFF
                        text_font: ${settings_label_font}
                    - switch:
                        id: ui_ns_sw
                        width: ${settings_switch_width}
                        height: ${settings_switch_height}
                        state:
                          checked: !lambda 'return id(ns_switch).state;'
                        on_value:
