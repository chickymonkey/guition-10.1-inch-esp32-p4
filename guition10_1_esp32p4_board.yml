            text_font: font_body
            text_color: 0xA7B2C4
    # ==================================================================
    # SECURITY: a 4 x 3 grid of cards below the header. For now only the
    # two door lock statuses and the garage roller door, in the top row.
    # ==================================================================
    - id: security_page
      bg_color: 0x0B1018
      scrollable: false
      on_swipe_right:
        - lvgl.page.show:
            id: home_page
            animation: MOVE_RIGHT
            time: 250ms
      widgets:
