                          - label: {align: LEFT_MID, x: 62, text: "Home", text_font: font_body}
                    - button:
                        id: scene_night_btn
                        styles: scene_btn
                        x: 194
                        y: 44
                        width: 172
                        height: 86
                        checked:
                          bg_color: 0x4F7FE8
                          border_color: 0x82A5FF
                        on_click:
                          - homeassistant.action:
                              action: scene.turn_on
                              data:
                                entity_id: ${scene_night_entity}
