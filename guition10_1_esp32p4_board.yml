# Card photos, from this repo's images/ folder (transparent PNG backgrounds).
# resize keeps the aspect ratio and fits inside the given box.
image:
  # Front / garage lock cards: 75% of the ~86 px card width (65x98, aspect kept).
  - platform: file
    file: ${images_base}smart_lock.png
    id: img_smart_lock
    resize: 65x232
    type: RGB565
    transparency: alpha_channel
    byte_order: little_endian
  # Home page wallpaper: "Minimal Dark Blue Wave Abstract" centre-cropped to
  # 16:10 and scaled to the 1280x800 screen (images/home_wallpaper.png).
  - platform: file
    file: ${images_base}home_wallpaper.png
    id: img_home_wallpaper
    resize: 1280x800
    type: RGB565
    byte_order: little_endian
  # Lights card: TV floor lamp photo at the top of its tile (images/floorlamp.webp).
  - platform: file
    file: ${images_base}floorlamp.png
    id: img_floor_lamp
    resize: 72x144
    type: RGB565
    byte_order: little_endian
  # Intercom card door-station photo, fitted to the 130x174 slot. "?v=" makes
  # ESPHome download it again under a new cache name; bump it after replacing
  # the image on GitHub (GitHub ignores the query).
  - platform: file
    file: ${images_base}intercom_panel.png
    id: img_intercom_panel
    resize: 130x174
    type: RGB565
    transparency: alpha_channel
    byte_order: little_endian
  # Home page camera tiles: Frigate snapshots downloaded at runtime. The URL
  # is set by fetch_front_snapshot / fetch_driveway_snapshot.
  - platform: online_image
    id: snap_front_img
    url: ${ha_base_url}/
    format: JPEG
    type: RGB565
    resize: 196x196        # fits the 196x196 snapshot area of the tile, whole
    update_interval: never
    buffer_size: 65536
    on_download_finished:
      - lvgl.image.update:
          id: cam_front_snapshot
          src: snap_front_img
      - globals.set:
          id: snap_front_loaded
          value: "true"
    on_error:
      - logger.log:
          level: WARN
          format: "Front door snapshot download failed"
  - platform: online_image
    id: snap_driveway_img
    url: ${ha_base_url}/
    format: JPEG
    type: RGB565
    resize: 196x196
    update_interval: never
    buffer_size: 65536
    on_download_finished:
      - lvgl.image.update:
          id: cam_driveway_snapshot
          src: snap_driveway_img
      - globals.set:
          id: snap_driveway_loaded
          value: "true"
    on_error:
      - logger.log:
          level: WARN
          format: "Driveway snapshot download failed"


lvgl:
  displays:
    - main_display
  touchscreens:
    - main_touch
  color_depth: 16
  byte_order: little_endian
  log_level: WARN
  rotation: 90
  on_boot:
    # p4_video_renderer draws decoded call video straight into this container.
    - lambda: id(p4_video).attach_video_container(id(call_video_surface));
    - script.execute: update_call_tile
    - script.execute: settings_sync_widgets

  style_definitions:
    # transparent grid cell: its 6 px padding makes the 12 px gap between cards
    - id: cell_style
      bg_opa: TRANSP
      border_width: 0
      radius: 0
      pad_all: 6
    # Glass cards: 50 % see-through over the home page wallpaper. (LVGL here
    # has no backdrop blur, so the wallpaper shows through unblurred.)
    - id: card_style
      bg_color: 0x151D2B
      bg_opa: 50%
      border_color: 0x2A3546
      border_width: 1
      radius: 14
      pad_all: 0
      text_color: 0xE8EDF5
      
    - id: icon_24
      text_font: font_mdi_24
      text_color: 0xE8EDF5
    - id: title_text
      text_font: font_body
      text_color: 0xE8EDF5
    - id: round_btn
      radius: 100
      border_width: 0
      shadow_width: 0
    - id: mode_btn
      bg_color: 0x202B3B
      border_color: 0x34445A
      border_width: 1
      radius: 9
      shadow_width: 0
    - id: scene_btn
      bg_color: 0x202B3B
      border_color: 0x34445A
      border_width: 1
      radius: 12
      shadow_width: 0
    # Lights card tile, off state (dark grey). The on state (amber + glow) is
    # each tile's "checked:" block.
    - id: light_tile
      width: 81
      height: 182
      radius: 12
      pad_all: 0
      bg_color: 0x2A2F38
      border_color: 0x3A4150
      border_width: 1
      shadow_width: 0
    - id: tile_style
      border_width: 1
      radius: 12
      pad_all: 0
    # Energy bar: green at the bottom through blue to purple at the top (a
    # two-stop gradient; its midpoint is blue).
    - id: ebar
      width: 10
      height: 4
      radius: 2
      border_width: 0
      bg_color: 0x8B5CF6        # top: purple
      bg_grad_color: 0x34D399   # bottom: green
      bg_grad_dir: VER
    # One slat of the garage roller-door curtain
    - id: garage_slat
      width: 100%
      height: 8
      radius: 1
      border_width: 0
      pad_all: 0
      bg_color: 0x667386
      bg_grad_color: 0x414D60
      bg_grad_dir: VER

  pages:
    - id: home_page
      # 18 rows x 13 columns of equal size. Written out in full (not "18x13")
      # because pad_row/pad_column are only accepted inside layout:.
      layout:
        type: grid
        # Row weights are in 1/60 of a base row: rows 1-5 (clock row) are 66 so
        # that row is half a base row taller; rows 6-11 (intercom row) are 55 so
        # it is half a base row shorter. Rows 12-16 (cameras and scenes) are 70
        # so the camera tiles fit a whole square snapshot; row 17 shrinks to a
        # small bottom margin to pay for it. Total stays 1080 (= 800 px).
        grid_rows: [FR(60), FR(66), FR(66), FR(66), FR(66), FR(66), FR(55), FR(55), FR(55),
                    FR(55), FR(55), FR(55), FR(70), FR(70), FR(70), FR(70), FR(70), FR(10)]
        grid_columns: [FR(1), FR(1), FR(1), FR(1), FR(1), FR(1), FR(1),
                       FR(1), FR(1), FR(1), FR(1), FR(1), FR(1)]
        pad_row: 0
        pad_column: 0
      bg_color: 0x0B1018
      bg_image_src: img_home_wallpaper
      pad_all: 0
      scrollable: false
      # Swipe up opens settings.
      on_swipe_up:
        - lvgl.page.show:
            id: settings_p4_page
            animation: MOVE_TOP
            time: 250ms
      widgets:
        # =====================================================================
        # SOIL MOISTURE (top, left of the status)  col 4 span 4 | row 0
        # "Soil Humidity", then two days ago | yesterday (9-10 am average) |
        # today, separated by grey bars.
        # =====================================================================
        - obj:
            styles: cell_style
            scrollable: false
            grid_cell_column_pos: 4
            grid_cell_row_pos: 0
            grid_cell_column_span: 4
            grid_cell_row_span: 1
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            layout:
              type: flex
              flex_flow: ROW
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER
            widgets:
              - label:
                  text: "\U000F058C"
                  text_font: font_mdi_24
                  text_color: 0x47B7E9
              - label:
                  text: "Soil Humidity"
                  text_font: font_small
                  text_color: 0xAAB8EE
              - label:
                  id: soil_day1_label
                  text: "-- --%"
                  text_font: font_small
                  text_color: 0xAAB8EE
              - label:
                  text: "|"
                  text_font: font_small
                  text_color: 0xAAAAAA
              - label:
                  id: soil_day2_label
                  text: "-- --%"
                  text_font: font_small
                  text_color: 0xAAB8EE
              - label:
                  text: "|"
                  text_font: font_small
                  text_color: 0xAAAAAA
              - label:
                  id: soil_now_label
                  text: "Today --%"
                  text_font: font_small
                  text_color: 0xAAB8EE

        # =====================================================================
        # STATUS (top right): ESP32-C6 firmware + Wi-Fi  col 8 span 5 | row 0
        # update_status_bar refreshes it every 10 s.
        # =====================================================================
        - obj:
            styles: cell_style
            scrollable: false
            grid_cell_column_pos: 8
            grid_cell_row_pos: 0
            grid_cell_column_span: 5
            grid_cell_row_span: 1
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            layout:
              type: flex
              flex_flow: ROW
              flex_align_main: END
              flex_align_cross: CENTER
              pad_column: 8
            widgets:
              - label:
                  id: status_c6_icon
                  text: "\U000F061A"
                  text_font: font_mdi_24
                  text_color: 0x8995A7
              - label:
                  id: status_c6_label
                  text: "C6 --"
                  text_font: font_small
                  text_color: 0xA7B2C4
              - obj:          # spacer
                  width: 10
                  height: 1
                  bg_opa: TRANSP
                  border_width: 0
              - label:
                  id: status_wifi_icon
                  text: "\U000F05AA"
                  text_font: font_mdi_24
                  text_color: 0x8995A7
              - label:
                  id: status_wifi_label
                  text: "--"
                  text_font: font_small
                  text_color: 0xA7B2C4

        # =====================================================================
        # SIDEBAR                            col 0 span 1 | row 1 span 16
        # =====================================================================
        - obj:
            styles: cell_style
            scrollable: false
            grid_cell_column_pos: 0
            grid_cell_row_pos: 1
            grid_cell_column_span: 1
            grid_cell_row_span: 16
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            layout:
              type: flex
              flex_flow: COLUMN
              flex_align_main: START
              flex_align_cross: CENTER
              pad_row: 12
            widgets:
              - button:
                  id: nav_home_btn
                  styles: scene_btn
                  width: 100%
                  height: 84
                  bg_color: 0x4F7FE8
                  border_color: 0x82A5FF
                  widgets:
                    - label: {align: TOP_MID, y: 14, text: "\U000F02DC", text_font: font_mdi_24, text_color: 0xFFFFFF}
                    - label: {align: BOTTOM_MID, y: -2, text: "Home", text_font: font_small}
              - button:
                  id: nav_cameras_btn
                  styles: scene_btn
                  width: 100%
                  height: 84
                  on_click:
                    - lvgl.page.show:
                        id: cam_front_page
                        animation: MOVE_LEFT
                        time: 250ms
                  widgets:
                    - label: {align: TOP_MID, y: 14, text: "\U000F07DE", text_font: font_mdi_24, text_color: 0xE8EDF5}
                    - label: {align: BOTTOM_MID, y: -2, text: "Cameras", text_font: font_small}
              - button:
                  id: nav_settings_btn
                  styles: scene_btn
                  width: 100%
                  height: 84
                  on_click:
                    - lvgl.page.show:
                        id: settings_p4_page
                        animation: MOVE_TOP
                        time: 250ms
                  widgets:
                    - label: {align: TOP_MID, y: 14, text: "\U000F0493", text_font: font_mdi_24, text_color: 0xE8EDF5}
                    - label: {align: BOTTOM_MID, y: -2, text: "Settings", text_font: font_small}

        # =====================================================================
        # 1. WALLPAPER / DIGITAL CLOCK       col 1 span 4 | row 1 span 5
        # =====================================================================
        - obj:
            styles: cell_style
            scrollable: false
            grid_cell_column_pos: 1
            grid_cell_row_pos: 1
            grid_cell_column_span: 4
            grid_cell_row_span: 5
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - obj:
                  id: card_clock
                  styles: card_style
                  width: 100%
                  height: 100%
                  scrollable: false
                  clip_corner: true
                  # The display is 16-bit (RGB565), so a gradient can only use
                  # a few distinct shades. 0x18243A -> 0x34466A gave just 3-8
                  # steps per channel (wide visible stripes); this wider range
                  # gives 6-16 steps, so the bands are much finer.
                  bg_color: 0x14203A
                  bg_grad_color: 0x40609A
                  bg_grad_dir: VER
                  border_width: 0
                  widgets:
                    - label:
                        id: clock_time_label
                        align: CENTER
                        y: -18
                        text: "--:--"
                        text_font: font_clock_big
                        text_color: 0xFFFFFF
                    # Bottom row: day on the left, date (no year) on the right
                    - label:
                        id: clock_day_label
                        align: BOTTOM_LEFT
                        x: 18
                        y: -14
                        text: ""
                        text_font: font_ui_medium
                        text_color: 0xFFFFFF
                    - label:
                        id: clock_date_label
                        align: BOTTOM_RIGHT
                        x: -18
                        y: -14
                        text: ""
                        text_font: font_ui_medium
                        text_color: 0xD0D9EA

        # =====================================================================
        # 2. GAS HEATER                      col 5 span 4 | row 1 span 5
        # =====================================================================
        - obj:
            styles: cell_style
            scrollable: false
            grid_cell_column_pos: 5
            grid_cell_row_pos: 1
            grid_cell_column_span: 4
            grid_cell_row_span: 5
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - obj:
                  id: card_heater
                  styles: card_style
                  width: 100%
                  height: 100%
                  scrollable: false
                  widgets:
                    - label:
                        styles: icon_24
                        x: 14
                        y: 10
                        text: "\U000F0238"
                    - label:
                        styles: title_text
                        x: 48
                        y: 8
                        text: "Gas Heater"
                    - obj:          # heater picture placeholder (swap for an image: later)
                        x: 18
                        y: 46
                        width: 130
                        height: 84
                        radius: 8
                        bg_color: 0x171D26
                        border_color: 0x3B4656
                        border_width: 3
                        pad_all: 0
                        scrollable: false
                        widgets:
                          - obj:
                              align: BOTTOM_MID
                              width: 100%
                              height: 50%
                              radius: 3
                              border_width: 0
                              bg_color: 0xE5A45B
                              bg_grad_color: 0xB95C3D
                              bg_grad_dir: VER
                    - button:
                        id: heater_power_btn
                        styles: round_btn
                        align: TOP_RIGHT
                        x: -26
                        y: 52
                        width: 52
                        height: 52
                        bg_color: 0x527FD6
                        on_click:
                          - homeassistant.action:
                              action: switch.toggle
                              data:
                                entity_id: ${heater_power_switch}
                        widgets:
                          - label:
                              align: CENTER
                              text: "\U000F0425"
                              text_font: font_mdi_36
                              text_color: 0xFFFFFF
                    - obj:          # mode buttons row
                        align: BOTTOM_MID
                        y: -12
                        width: 354
                        height: 40
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        layout:
                          type: flex
                          flex_flow: ROW
                          flex_align_main: SPACE_BETWEEN
                          flex_align_cross: CENTER
                        widgets:
                          # Rinnai Touch switches (as in the HA dashboard):
                          # Off = heater and fan off, Heat = heater on,
                          # Fan = circulation fan on.
                          - button:
                              id: heater_btn_off
                              styles: mode_btn
                              width: 110
                              height: 40
                              checked:
                                bg_color: 0x4F7FE8
                                border_color: 0x82A5FF
                              on_click:
                                - homeassistant.action:
                                    action: switch.turn_off
                                    data:
                                      entity_id: ${heater_power_switch}
                                - homeassistant.action:
                                    action: switch.turn_off
                                    data:
                                      entity_id: ${heater_fan_switch}
                              widgets:
                                - label: {align: CENTER, text: "Off", text_font: font_small}
                          - button:
                              id: heater_btn_heat
                              styles: mode_btn
                              width: 110
                              height: 40
                              checked:
                                bg_color: 0x4F7FE8
                                border_color: 0x82A5FF
                              on_click:
                                - homeassistant.action:
                                    action: switch.turn_on
                                    data:
                                      entity_id: ${heater_power_switch}
                              widgets:
                                - label: {align: CENTER, text: "Heat", text_font: font_small}
                          - button:
                              id: heater_btn_fan
                              styles: mode_btn
                              width: 110
                              height: 40
                              checked:
                                bg_color: 0x4F7FE8
                                border_color: 0x82A5FF
                              on_click:
                                - homeassistant.action:
                                    action: switch.turn_on
                                    data:
                                      entity_id: ${heater_fan_switch}
                              widgets:
                                - label: {align: CENTER, text: "Fan", text_font: font_small}

        # =====================================================================
        # 3. FRONT DOOR LOCK                 col 11 span 1 | row 1 span 5
        # =====================================================================
        - obj:
            styles: cell_style
            scrollable: false
            grid_cell_column_pos: 11
            grid_cell_row_pos: 1
            grid_cell_column_span: 1
            grid_cell_row_span: 5
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - obj:
                  id: card_front_lock
                  styles: card_style
                  width: 100%
                  height: 100%
                  scrollable: false
                  clip_corner: true
                  widgets:
                    # Background: lock photo at 75% of the card width centred.
                    - image:
                        src: img_smart_lock
                        align: CENTER
                        y: -10
                    - label:
                        align: TOP_MID
                        y: 8
                        text: "Front"
                        text_font: font_small
                        text_color: 0xFFFFFF
                    - button:
                        id: front_lock_btn
                        styles: round_btn
                        align: BOTTOM_MID
                        y: -12
                        width: 48
                        height: 48
                        bg_color: 0x713F46          # unlocked
                        checked:
                          bg_color: 0x276B57        # locked
                        on_click:
                          - if:
                              condition:
                                text_sensor.state:
                                  id: front_lock_state
                                  state: "locked"
                              then:
                                - homeassistant.action:
                                    action: lock.unlock
                                    data:
                                      entity_id: ${front_lock_entity}
                              else:
                                - homeassistant.action:
                                    action: lock.lock
                                    data:
                                      entity_id: ${front_lock_entity}
                        widgets:
                          - label:
                              id: front_lock_icon        # locked / unlocked icon
                              align: CENTER
                              text: "\U000F033E"
                              text_font: font_mdi_24
                              text_color: 0xFFFFFF

        # =====================================================================
        # 3b. GARAGE DOOR LOCK               col 12 span 1 | row 1 span 5
        # =====================================================================
        - obj:
            styles: cell_style
            scrollable: false
            grid_cell_column_pos: 12
            grid_cell_row_pos: 1
            grid_cell_column_span: 1
            grid_cell_row_span: 5
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - obj:
                  id: card_garage_lock
                  styles: card_style
                  width: 100%
                  height: 100%
                  scrollable: false
                  clip_corner: true
                  widgets:
                    - image:
                        src: img_smart_lock
                        align: CENTER
                        y: -10
                    - label:
                        align: TOP_MID
                        y: 8
                        text: "Garage"
                        text_font: font_small
                        text_color: 0xFFFFFF
                    - button:
                        id: garage_lock_btn
                        styles: round_btn
                        align: BOTTOM_MID
                        y: -12
                        width: 48
                        height: 48
                        bg_color: 0x713F46          # unlocked
                        checked:
                          bg_color: 0x276B57        # locked
                        on_click:
                          - if:
                              condition:
                                text_sensor.state:
                                  id: garage_lock_state
                                  state: "locked"
                              then:
                                - homeassistant.action:
                                    action: lock.unlock
                                    data:
                                      entity_id: ${garage_lock_entity}
                              else:
                                - homeassistant.action:
                                    action: lock.lock
                                    data:
                                      entity_id: ${garage_lock_entity}
                        widgets:
                          - label:
                              id: garage_lock_icon       # locked / unlocked icon
                              align: CENTER
                              text: "\U000F033E"
                              text_font: font_mdi_24
                              text_color: 0xFFFFFF

        # =====================================================================
        # 4. GARAGE Roller DOOR                     col 9 span 2 | row 1 span 5
        # =====================================================================
        - obj:
            styles: cell_style
            scrollable: false
            grid_cell_column_pos: 9
            grid_cell_row_pos: 1
            grid_cell_column_span: 2
            grid_cell_row_span: 5
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - obj:
                  id: card_garage
                  styles: card_style
                  width: 100%
                  height: 100%
                  scrollable: false
                  widgets:
                    - label:
                        x: 42
                        y: 10
                        text: "Garage Roller"
                        text_font: font_small
                    - label:
                        id: garage_icon
                        styles: icon_24
                        x: 12
                        y: 10
                        text: "\U000F06D9"
                    - obj:          # door position: roller-door slats
                        align: TOP_MID
                        id: garage_position_container
                        y: 52
                        width: 150
                        height: 110
                        radius: 8
                        bg_color: 0x222B38
                        border_color: 0x3A4658
                        border_width: 2
                        pad_all: 0
                        scrollable: false
                        widgets:
                          # Roller-door curtain: horizontal slats from the top,
                          # height = closed share of the door (100 - position %).
                          # Slats stay at the bottom edge, so a shorter curtain
                          # looks like the door rolling up. The container clips it.
                          - obj:
                              id: garage_door_curtain
                              align: TOP_MID
                              width: 100%
                              height: 100%
                              bg_opa: TRANSP
                              border_width: 0
                              radius: 0
                              pad_all: 0
                              scrollable: false
                              layout:
                                type: flex
                                flex_flow: COLUMN
                                flex_align_main: END
                                flex_align_cross: CENTER
                                pad_row: 3
                              widgets:
                                - obj: {styles: garage_slat}
                                - obj: {styles: garage_slat}
                                - obj: {styles: garage_slat}
                                - obj: {styles: garage_slat}
                                - obj: {styles: garage_slat}
                                - obj: {styles: garage_slat}
                                - obj: {styles: garage_slat}
                                - obj: {styles: garage_slat}
                                - obj: {styles: garage_slat}
                                - obj: {styles: garage_slat}
                    
                    # Door position, left of the control button
                    - label:
                        id: garage_position_label
                        align: BOTTOM_RIGHT
                        x: -100
                        y: -25
                        text: "--%"
                        text_font: font_title
                        text_color: 0xFFFFFF
                    # Open / Closed / Partly open, under the percentage
                    # (same right edge)
                    - label:
                        id: garage_status_label
                        align: BOTTOM_RIGHT
                        x: -100
                        y: -4
                        text: "--"
                        text_font: font_small
                        text_color: 0xA7B2C4
                    # One button for the controller's next action (Up / Stop /
                    # Down); garage_update_button sets its icon and colour.
                    - button:
                        id: garage_btn
                        styles: round_btn
                        align: BOTTOM_RIGHT
                        x: -12
                        y: -5
                        width: 56
                        height: 56
                        bg_color: 0x527FD6
                        on_click:
                          - homeassistant.action:
                              action: button.press
                              data:
                                entity_id: !lambda |-
                                  if (id(garage_next_stop).state) return std::string("${garage_stop_button}");
                                  if (id(garage_next_down).state) return std::string("${garage_down_button}");
                                  return std::string("${garage_up_button}");
                        widgets:
                          - label:
                              id: garage_btn_icon
                              align: CENTER
                              text: "\U000F0737"
                              text_font: font_mdi_36
                              text_color: 0xFFFFFF

        # =====================================================================
        # 5. INTERCOM                        col 1 span 4 | row 6 span 6
        # =====================================================================
        - obj:
            styles: cell_style
            scrollable: false
            grid_cell_column_pos: 1
            grid_cell_row_pos: 6
            grid_cell_column_span: 4
            grid_cell_row_span: 6
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              # VoIP panel. Sized by the grid cell (about 382x232); the call-state
              # groups fill the right 60% and update_call_tile shows one at a time.
              - obj:
                  id: voip_tile
                  styles: card_style
                  width: 100%
                  height: 100%
                  scrollable: false
                  scrollbar_mode: "off"
                  clip_corner: true
                  widgets:
                    - label:
                        styles: icon_24
                        x: 14
                        y: 10
                        text: "\U000F0869"
                    - label:
                        styles: title_text
                        x: 48
                        y: 8
                        text: "Intercom"
                    # Glow behind the dark door-station photo so it stands out
                    # from the charcoal card: grey at the top to white at the
                    # bottom, with a soft white halo.
                    - obj:
                        align: BOTTOM_LEFT
                        x: 14
                        y: -12
                        width: 130
                        height: 174
                        radius: 14
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        clickable: false
                        bg_color: 0x9CA3AF
                        bg_grad_color: 0xF1F5F9
                        bg_grad_dir: VER
                        shadow_color: 0xFFFFFF
                        shadow_width: 26
                        shadow_spread: 2
                        shadow_opa: 35%
                    - image:        # door-station photo, fitted to 130x174
                        src: img_intercom_panel
                        align: BOTTOM_LEFT
                        x: 14
                        y: -12

                    # ---- idle: contact browser ----
                    - obj:
                        id: call_idle_group
                        align: TOP_RIGHT
                        width: 60%
                        height: 100%
                        bg_opa: TRANSP
                        border_width: 0
                        radius: 0
                        pad_all: 0
                        scrollable: false
                        scrollbar_mode: "off"
                        widgets:
                          - label:
                              id: call_idle_header_label
                              align: TOP_RIGHT
                              x: -14
                              y: 12
                              text: "Keypad"
                              text_color: 0x8DAEFF
                              text_font: font_small
                              clickable: true
                              gesture_bubble: false
                              on_click:
                                - script.execute: show_voip_keypad
                          - obj:
                              id: call_idle_header_rule
                              align: TOP_RIGHT
                              x: -14
                              y: 32
                              width: 54
                              height: 2
                              bg_color: 0x8DAEFF
                              border_width: 0
                              radius: 1
                          - label:
                              id: call_idle_peer_label
                              align: TOP_MID
                              y: 66
                              width: 210
                              text: "-"
                              text_color: 0xFFFFFF
                              text_font: font_small_18
                              text_align: CENTER
                              long_mode: DOT
                          - label:
                              id: call_idle_contacts_label
                              align: TOP_MID
                              y: 108
                              text: "Contacts: 0"
                              text_color: 0x8995A7
                              text_font: font_small
                          - label:
                              id: call_idle_hint_label
                              align: TOP_MID
                              y: 134
                              width: 210
                              text: "Swipe to browse"
                              text_color: 0x778397
                              text_font: font_small
                              text_align: CENTER
                              long_mode: DOT
                          - obj:
                              id: call_idle_swipe_area
                              align: TOP_MID
                              y: 40
                              width: 100%
                              height: 120
                              bg_opa: TRANSP
                              border_width: 0
                              scrollable: false
                              clickable: true
                              gesture_bubble: false
                              on_swipe_left:
                                - voip_stack.next_contact:
                                - script.execute: update_ic_idle_labels
                              on_swipe_right:
                                - voip_stack.prev_contact:
                                - script.execute: update_ic_idle_labels
                          - button:
                              id: call_prev_btn
                              align: BOTTOM_LEFT
                              x: 8
                              y: -16
                              width: 58
                              height: 50
                              bg_color: 0x202B3B
                              radius: 9
                              on_click:
                                - voip_stack.prev_contact:
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "\U000F0141"
                                    text_color: 0xDCE3ED
                                    text_font: font_action_icon
                          - button:
                              id: call_button_widget
                              align: BOTTOM_MID
                              y: -12
                              width: 78
                              height: 58
                              bg_color: 0x43A982
                              radius: 9
                              on_click:
                                - voip_stack.call_toggle:
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "\U000F03F2"
                                    text_color: 0xFFFFFF
                                    text_font: font_action_icon
                          - button:
                              id: call_next_btn
                              align: BOTTOM_RIGHT
                              x: -8
                              y: -16
                              width: 58
                              height: 50
                              bg_color: 0x202B3B
                              radius: 9
                              on_click:
                                - voip_stack.next_contact:
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "\U000F0142"
                                    text_color: 0xDCE3ED
                                    text_font: font_action_icon

                    # ---- idle: dial keypad (slides in over the contact browser) ----
                    - obj:
                        id: call_keypad_group
                        align: TOP_RIGHT
                        width: 60%
                        height: 100%
                        bg_color: 0x151D2B
                        border_width: 0
                        radius: 0
                        pad_all: 0
                        scrollable: false
                        clickable: true
                        gesture_bubble: false
                        hidden: true
                        widgets:
                          - label:
                              id: call_keypad_value_label
                              align: TOP_LEFT
                              x: 8
                              y: 12
                              width: 140
                              text: "Enter number"
                              text_color: 0xFFFFFF
                              text_font: font_small
                              long_mode: DOT
                          - label:
                              id: call_keypad_header_label
                              align: TOP_RIGHT
                              x: -14
                              y: 12
                              text: "Contacts"
                              text_color: 0x8DAEFF
                              text_font: font_small
                              clickable: true
                              gesture_bubble: false
                              on_click:
                                - script.execute: hide_voip_keypad
                          - obj:
                              id: call_keypad_header_rule
                              align: TOP_RIGHT
                              x: -14
                              y: 32
                              width: 66
                              height: 2
                              bg_color: 0x8DAEFF
                              border_width: 0
                              radius: 1
                          - buttonmatrix:
                              id: call_keypad_matrix
                              align: TOP_MID
                              y: 38
                              width: 216
                              height: 138
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              pad_row: 6
                              pad_column: 6
                              gesture_bubble: true
                              items:
                                bg_color: 0x202B3B
                                text_color: 0xFFFFFF
                                text_font: font_body
                                radius: 8
                              rows:
                                - buttons:
                                    - text: "1"
                                    - text: "2"
                                    - text: "3"
                                - buttons:
                                    - text: "4"
                                    - text: "5"
                                    - text: "6"
                                - buttons:
                                    - text: "7"
                                    - text: "8"
                                    - text: "9"
                                - buttons:
                                    - text: "*"
                                    - text: "0"
                                    - text: "#"
                              on_click:
                                - lambda: |-
                                    static constexpr char KEYS[] = "123456789*0#";
                                    if (x >= 12 || id(voip_dial_buffer).size() >= 32) return;
                                    id(voip_dial_buffer).push_back(KEYS[x]);
                                    lv_label_set_text(id(call_keypad_value_label), id(voip_dial_buffer).c_str());
                          - button:
                              align: BOTTOM_LEFT
                              x: 8
                              y: -8
                              width: 62
                              height: 42
                              bg_color: 0x202B3B
                              radius: 8
                              on_click:
                                - lambda: |-
                                    id(voip_dial_buffer).clear();
                                    lv_label_set_text(id(call_keypad_value_label), "Enter number");
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "CLEAR"
                                    text_color: 0xDCE3ED
                                    text_font: font_small
                          - button:
                              align: BOTTOM_MID
                              y: -8
                              width: 78
                              height: 42
                              bg_color: 0x43A982
                              radius: 8
                              on_click:
                                - if:
                                    condition:
                                      lambda: return !id(voip_dial_buffer).empty();
                                    then:
                                      - voip_stack.call:
                                          target: !lambda 'return id(voip_dial_buffer);'
                                      - lambda: |-
                                          id(voip_dial_buffer).clear();
                                          lv_label_set_text(id(call_keypad_value_label), "Enter number");
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "\U000F03F2"
                                    text_color: 0xFFFFFF
                                    text_font: font_mdi_24
                          - button:
                              align: BOTTOM_RIGHT
                              x: -8
                              y: -8
                              width: 62
                              height: 42
                              bg_color: 0x202B3B
                              radius: 8
                              on_click:
                                - lambda: |-
                                    if (!id(voip_dial_buffer).empty()) id(voip_dial_buffer).pop_back();
                                    lv_label_set_text(id(call_keypad_value_label), id(voip_dial_buffer).empty()
                                        ? "Enter number" : id(voip_dial_buffer).c_str());
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "DEL"
                                    text_color: 0xDCE3ED
                                    text_font: font_small

                    # ---- incoming call ----
                    - obj:
                        id: call_ringing_in_group
                        align: TOP_RIGHT
                        width: 60%
                        height: 100%
                        bg_color: 0x2B1A22
                        border_width: 0
                        radius: 0
                        pad_all: 0
                        scrollable: false
                        hidden: true
                        widgets:
                          - label:
                              align: TOP_MID
                              y: 14
                              text: "Incoming call"
                              text_color: 0xE47B86
                              text_font: font_ui_medium
                          - label:
                              id: call_ringing_in_peer_label
                              align: CENTER
                              y: -20
                              width: 210
                              text: ""
                              text_color: 0xFFFFFF
                              text_font: font_small_18
                              text_align: CENTER
                              long_mode: DOT
                          - button:
                              align: BOTTOM_LEFT
                              x: 8
                              y: -14
                              width: 104
                              height: 56
                              bg_color: 0x43A982
                              radius: 9
                              on_click:
                                - voip_stack.answer_call:
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "ANSWER"
                                    text_color: 0xFFFFFF
                                    text_font: font_body
                          - button:
                              align: BOTTOM_RIGHT
                              x: -8
                              y: -14
                              width: 104
                              height: 56
                              bg_color: 0xD65B64
                              radius: 9
                              on_click:
                                - voip_stack.decline_call:
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "DECLINE"
                                    text_color: 0xFFFFFF
                                    text_font: font_body

                    # ---- outgoing call ----
                    - obj:
                        id: call_ringing_out_group
                        align: TOP_RIGHT
                        width: 60%
                        height: 100%
                        bg_color: 0x2A241C
                        border_width: 0
                        radius: 0
                        pad_all: 0
                        scrollable: false
                        hidden: true
                        widgets:
                          - label:
                              id: call_ringing_out_status_label
                              align: TOP_MID
                              y: 14
                              text: "CALLING"
                              text_color: 0xD6A35D
                              text_font: font_ui_medium
                          - label:
                              id: call_ringing_out_peer_label
                              align: CENTER
                              y: -24
                              width: 210
                              text: ""
                              text_color: 0xFFFFFF
                              text_font: font_title
                              text_align: CENTER
                              long_mode: DOT
                          - label:
                              align: CENTER
                              y: 14
                              text: "Waiting for answer"
                              text_color: 0xC5CEDA
                              text_font: font_small
                          - button:
                              align: BOTTOM_MID
                              y: -14
                              width: 150
                              height: 56
                              bg_color: 0xD65B64
                              radius: 9
                              on_click:
                                - voip_stack.call_toggle:
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "HANG UP"
                                    text_color: 0xFFFFFF
                                    text_font: font_body

                    # ---- in call ----
                    - obj:
                        id: call_in_call_group
                        align: TOP_RIGHT
                        width: 60%
                        height: 100%
                        bg_color: 0x172A25
                        border_width: 0
                        radius: 0
                        pad_all: 0
                        scrollable: false
                        hidden: true
                        widgets:
                          - label:
                              align: TOP_MID
                              y: 14
                              text: "In call"
                              text_color: 0x43A982
                              text_font: font_ui_medium
                          - label:
                              id: p4_call_media_route_label
                              align: TOP_MID
                              y: 46
                              width: 90%
                              text: ""
                              text_color: 0x9BA8B9
                              text_font: font_small
                              text_align: CENTER
                              long_mode: DOT
                          - label:
                              id: call_in_call_peer_label
                              align: CENTER
                              y: -4
                              width: 210
                              text: ""
                              text_color: 0xFFFFFF
                              text_font: font_title
                              text_align: CENTER
                              long_mode: DOT
                          - button:
                              align: BOTTOM_MID
                              y: -14
                              width: 150
                              height: 56
                              bg_color: 0xD65B64
                              radius: 9
                              on_click:
                                - voip_stack.call_toggle:
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "HANG UP"
                                    text_color: 0xFFFFFF
                                    text_font: font_body

                    # ---- call ended (shown ~4 s) ----
                    - obj:
                        id: call_ended_group
                        align: TOP_RIGHT
                        width: 60%
                        height: 100%
                        bg_color: 0x202833
                        border_width: 0
                        radius: 0
                        pad_all: 0
                        scrollable: false
                        hidden: true
                        widgets:
                          - label:
                              id: call_ended_peer_label
                              align: CENTER
                              y: -30
                              width: 210
                              text: ""
                              text_color: 0xFFFFFF
                              text_font: font_ui_medium
                              text_align: CENTER
                              long_mode: WRAP
                          - label:
                              id: call_ended_reason_label
                              align: CENTER
                              y: 30
                              width: 210
                              text: ""
                              text_color: 0xE2C17B
                              text_font: font_small
                              text_align: CENTER
                              long_mode: WRAP

        # =====================================================================
        # 6. ELECTRICITY USAGE               col 5 span 4 | row 6 span 6
        # =====================================================================
        - obj:
            styles: cell_style
            scrollable: false
            grid_cell_column_pos: 5
            grid_cell_row_pos: 6
            grid_cell_column_span: 4
            grid_cell_row_span: 6
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - obj:
                  id: card_electricity
                  styles: card_style
                  width: 100%
                  height: 100%
                  scrollable: false
                  widgets:
                    - label:
                        styles: icon_24
                        x: 14
                        y: 10
                        text: "\U000F0241"
                    - label:
                        styles: title_text
                        x: 48
                        y: 8
                        text: "Electricity"
                    # Daily energy for the last 14 completed days, oldest on
                    # the left. fetch_energy_history fills energy_history from
                    # HA long-term statistics; draw_energy_bars scales the bars
                    # and the Y axis (kWh) to the busiest day.
                    - label:
                        id: elec_axis_max
                        x: 0
                        y: 40
                        width: 31
                        text: ""
                        text_align: RIGHT
                        text_font: font_small
                        text_color: 0xA7B2C4
                    - label:
                        id: elec_axis_mid
                        x: 0
                        y: 110
                        width: 31
                        text: ""
                        text_align: RIGHT
                        text_font: font_small
                        text_color: 0xA7B2C4
                    - label:
                        x: 0
                        y: 180
                        width: 31
                        text: "0"
                        text_align: RIGHT
                        text_font: font_small
                        text_color: 0xA7B2C4
                    - obj:          # Y axis line
                        x: 35
                        y: 48
                        width: 2
                        height: 140
                        radius: 0
                        border_width: 0
                        bg_color: 0x34445A
                    - label:        # axis unit, under the axis
                        x: 11
                        y: 200
                        text: "kWh"
                        text_font: font_small
                        text_color: 0x778397
                    - obj:
                        id: elec_bars
                        x: 43
                        y: 48
                        width: 180          # 14 bars x 10 px + gaps; ends at x 223, clear of the ring (x ~256)
                        height: 140
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        layout:
                          type: flex
                          flex_flow: ROW
                          flex_align_main: SPACE_BETWEEN
                          flex_align_cross: END
                          flex_align_track: END
                          pad_column: 0     # no theme gap: SPACE_BETWEEN alone spaces the bars
                        widgets:
                          - obj: {id: ebar_0, styles: ebar}
                          - obj: {id: ebar_1, styles: ebar}
                          - obj: {id: ebar_2, styles: ebar}
                          - obj: {id: ebar_3, styles: ebar}
                          - obj: {id: ebar_4, styles: ebar}
                          - obj: {id: ebar_5, styles: ebar}
                          - obj: {id: ebar_6, styles: ebar}
                          - obj: {id: ebar_7, styles: ebar}
                          - obj: {id: ebar_8, styles: ebar}
                          - obj: {id: ebar_9, styles: ebar}
                          - obj: {id: ebar_10, styles: ebar}
                          - obj: {id: ebar_11, styles: ebar}
                          - obj: {id: ebar_12, styles: ebar}
                          - obj: {id: ebar_13, styles: ebar}
                    # Daily average, centred under the power ring
                    - label:
                        id: elec_hist_label
                        align: RIGHT_MID
                        x: -4
                        y: 85
                        width: 140
                        text: ""
                        text_align: CENTER
                        text_font: font_small
                        text_color: 0xA7B2C4
                    - obj:          # ring + live value
                        align: RIGHT_MID
                        x: -22
                        y: 14
                        width: 104
                        height: 104
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        widgets:
                          - arc:
                              id: elec_arc
                              align: CENTER
                              width: 104
                              height: 104
                              min_value: 0
                              max_value: ${power_max_w}
                              value: 2400
                              adjustable: false
                              arc_color: 0x29364A
                              arc_width: 7
                              indicator:
                                arc_color: 0x527FD6
                                arc_width: 7
                          - label:
                              id: elec_value_label
                              align: CENTER
                              y: -8
                              text: "2.4"
                              text_font: font_ui_medium
                              text_color: 0xFFFFFF
                          - label:
                              align: CENTER
                              y: 16
                              text: "kW"
                              text_font: font_small
