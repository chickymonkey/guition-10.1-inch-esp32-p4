                              y: 30
                              text: "\U000F0769"
                              text_font: font_mdi_36
                              text_color: 0x8995A7
                          - label:
                              align: BOTTOM_MID
                              y: -10
                              width: 76
                              text: "Living Room Left"
                              text_align: CENTER
                              long_mode: WRAP
                              text_font: font_small
                              text_color: 0xFFFFFF
                    - button:
