        # ---- row 17: small bottom margin (FR(10)), intentionally empty ------

    # ==================================================================
    # CAMERA PAGES: one live RTSP camera per screen, at the stream's own
    # size (esp_rtsp_stream never upscales). Opened from the sidebar
    # (Front Door) or by tapping a home page snapshot tile. Swipe left /
    # right switches camera; "< Home" or swiping right past Front Door
    # returns. Each stream only runs while its page is shown.
    # ==================================================================
    - id: cam_front_page
      bg_color: 0x0B1018
      scrollable: false
      on_swipe_left:
        - lvgl.page.show:
            id: cam_driveway_page
            animation: MOVE_LEFT
            time: 250ms
      on_swipe_right:
        - lvgl.page.show:
            id: home_page
            animation: MOVE_RIGHT
            time: 250ms
      widgets:
        - button:
            id: cam_front_back_btn
            styles: scene_btn
            x: 16
            y: 14
            width: 120
            height: 48
            on_click:
              - lvgl.page.show:
                  id: home_page
                  animation: MOVE_RIGHT
                  time: 250ms
            widgets:
              - label: {align: CENTER, text: "<  Home", text_font: font_body, text_color: 0xFFFFFF}
        - label:
            align: TOP_MID
            y: 20
            text: "Front Door"
            text_font: font_ui_medium
            text_color: 0xFFFFFF
        - button:
            styles: scene_btn
            align: TOP_RIGHT
            x: -16
            y: 14
            width: 150
            height: 48
            on_click:
              - lvgl.page.show:
                  id: cam_driveway_page
                  animation: MOVE_LEFT
                  time: 250ms
            widgets:
              - label: {align: CENTER, text: "Driveway  >", text_font: font_body, text_color: 0xFFFFFF}
        - obj:              # Front door camera: 640x480 stream
            align: CENTER
            y: 38
            width: 704
            height: 576
            radius: 0
            border_width: 0
            pad_all: 0
            scrollable: false
            bg_color: 0x000000
            widgets:
              - canvas:
                  id: cam_front_full_canvas
                  x: 0
                  y: 0
                  width: 704
                  height: 576

    - id: cam_driveway_page
      bg_color: 0x0B1018
      scrollable: false
      on_swipe_right:
        - lvgl.page.show:
            id: cam_front_page
            animation: MOVE_RIGHT
            time: 250ms
      widgets:
        - button:
            id: cam_driveway_back_btn
            styles: scene_btn
            x: 16
            y: 14
            width: 120
            height: 48
            on_click:
              - lvgl.page.show:
                  id: home_page
                  animation: MOVE_RIGHT
                  time: 250ms
            widgets:
              - label: {align: CENTER, text: "<  Home", text_font: font_body, text_color: 0xFFFFFF}
        - label:
            align: TOP_MID
            y: 20
            text: "Driveway"
            text_font: font_ui_medium
            text_color: 0xFFFFFF
        - button:
            styles: scene_btn
            align: TOP_RIGHT
            x: -16
            y: 14
            width: 170
            height: 48
            on_click:
              - lvgl.page.show:
                  id: cam_front_page
                  animation: MOVE_RIGHT
                  time: 250ms
            widgets:
              - label: {align: CENTER, text: "<  Front Door", text_font: font_body, text_color: 0xFFFFFF}
        - obj:              # Driveway camera: 704x576 stream
            align: CENTER
            y: 38
            width: 704
            height: 576
            radius: 0
            border_width: 0
            pad_all: 0
            scrollable: false
            bg_color: 0x000000
            widgets:
              - canvas:
                  id: cam_driveway_full_canvas
                  x: 0
                  y: 0
                  width: 704
                  height: 576
    # ==================================================================
    # SETTINGS: one scrollable landscape page. Opened from the sidebar or a
    # swipe up on the home page; swipe down returns to the home page.
    # ==================================================================
    - id: settings_p4_page
      bg_color: 0x202020
      on_load:
        - lvgl.widget.hide: reboot_confirm
        - script.execute: settings_sync_widgets
        - script.execute: update_settings_info
      on_swipe_down:
        - script.execute: close_settings_page
      widgets:
        # Full-screen wrapper: explicit pixel dimensions ensure the flex layout
        # has a deterministic content area to stretch children into. Pages
        # (top-level LVGL screens) in ESPHome have proven unreliable when used as
        # flex containers directly; nesting one level fixes it.
        - obj:
            id: settings_page_wrapper
            x: 0
            y: 0
            width: 1280
            height: 800
            bg_color: 0x202020
            border_width: 0
            pad_top: 10
            pad_bottom: 96             # keeps the list clear of the Reboot button
            pad_left: 20
            pad_right: 20
            scrollable: true
            scrollbar_mode: "active"
            on_swipe_down:
              - script.execute: close_settings_page
            layout:
              type: flex
              flex_flow: COLUMN
              flex_align_main: START
              flex_align_cross: CENTER
              pad_row: 4
            widgets:
              # ------------------------------------------------------------------
              # Header
              # ------------------------------------------------------------------
              - label:
                  width: ${settings_row_width}
                  text: "P4 Controls"
                  text_align: CENTER
                  text_color: 0xFFFFFF
                  text_font: ${settings_label_font}

              # ==================================================================
              # SECTION: AUDIO
              # ==================================================================
              - obj:
                  width: ${settings_row_width}
                  height: 2
                  bg_color: 0x444444
                  border_width: 0
                  pad_all: 0
              - label:
                  width: ${settings_row_width}
