    # ==================================================================
    # SETTINGS: one scrollable landscape page. Opened from the sidebar or a
    # swipe up on the home page; swipe down returns to the home page.
    # ==================================================================
    - id: settings_p4_page
      bg_color: 0x202020
      on_load:
        - lvgl.widget.hide: reboot_confirm
        - script.execute: settings_sync_widgets
        - script.execute: update_settings_info
      on_swipe_down:
        - script.execute: close_settings_page
      widgets:
        # Full-screen wrapper: explicit pixel dimensions ensure the flex layout
        # has a deterministic content area to stretch children into. Pages
        # (top-level LVGL screens) in ESPHome have proven unreliable when used as
        # flex containers directly; nesting one level fixes it.
        - obj:
            id: settings_page_wrapper
            x: 0
            y: 0
            width: 1280
            height: 800
            bg_color: 0x202020
            border_width: 0
            pad_top: 10
            pad_bottom: 96             # keeps the list clear of the Reboot button
            pad_left: 20
            pad_right: 20
            scrollable: true
            scrollbar_mode: "active"
            on_swipe_down:
              - script.execute: close_settings_page
            layout:
              type: flex
              flex_flow: COLUMN
              flex_align_main: START
              flex_align_cross: CENTER
              pad_row: 4
            widgets:
              # ------------------------------------------------------------------
              # Header
              # ------------------------------------------------------------------
              - label:
                  width: ${settings_row_width}
                  text: "Settings"
                  text_align: CENTER
                  text_color: 0xFFFFFF
                  text_font: ${settings_label_font}

              # ==================================================================
              # SECTION: AUDIO (no divider line under the page title)
              # ==================================================================
              - label:
                  width: ${settings_row_width}
                  text: "Audio"
                  text_align: CENTER
                  text_color: 0x88AAFF
                  text_font: ${settings_label_font}
              # Label on the left, slider centred in the row (no flex layout,
              # so each child is placed by its own align).
              - obj:
                  width: ${settings_row_width}
                  height: ${settings_row_height}
                  bg_opa: TRANSP
                  border_width: 0
                  pad_left: 12
                  pad_right: 12
                  scrollable: false
                  widgets:
                    - label:
                        align: LEFT_MID
                        text: "Master volume"
                        text_align: LEFT
                        text_color: 0xFFFFFF
                        text_font: ${settings_label_font}
                    - slider:
                        align: CENTER
                        width: ${settings_control_width}
                        id: ui_speaker_vol_slider
                        height: ${settings_slider_height}
                        adv_hittest: true
                        gesture_bubble: true
                        min_value: 0
                        max_value: 100
                        value: !lambda 'return id(master_volume).state;'
                        on_release:
                          - number.set:
                              id: master_volume
                              value: !lambda 'return x;'
#              - obj:
#                  width: ${settings_row_width}
#                  height: ${settings_row_height}
#                  bg_opa: TRANSP
#                  border_width: 0
#                  pad_left: 12
#                  pad_right: 12
#                  scrollable: false
#                  layout:
#                    type: FLEX
#                    flex_flow: ROW
#                    flex_align_main: SPACE_BETWEEN
#                    flex_align_cross: CENTER
#                  widgets:
#                    - label:
#                        width: ${settings_mid_width}
#                        text: "Mic gain"
#                        text_align: LEFT
#                        text_color: 0xFFFFFF
#                        text_font: ${settings_label_font}
#                    - slider:
#                        width: ${settings_control_width}
#                        id: ui_mic_vol_slider
#                        height: ${settings_slider_height}
#                        adv_hittest: true
#                        gesture_bubble: true
#                        min_value: ${mic_gain_min}
#                        max_value: ${mic_gain_max}
#                        value: !lambda 'return id(mic_gain).state;'
#                        on_release:
#                          - number.set:
#                              id: mic_gain
#                              value: !lambda 'return x;'
              # ========================================================================
              # SECTION: DISPLAY (brightness, dim timer, return-to-home timer)
              # ========================================================================
              - obj:
                  width: ${settings_row_width}
                  height: 2
                  bg_color: 0x444444
                  border_width: 0
                  pad_all: 0
              - label:
                  width: ${settings_row_width}
                  text: "Display"
                  text_align: CENTER
                  text_color: 0x88AAFF
                  text_font: ${settings_label_font}
              - obj:
                  width: ${settings_row_width}
                  height: ${settings_row_height}
                  bg_opa: TRANSP
                  border_width: 0
                  pad_left: 12
                  pad_right: 12
                  scrollable: false
                  widgets:
                    - label:
                        align: LEFT_MID
                        text: "Screen brightness"
                        text_color: 0xFFFFFF
                        text_font: ${settings_label_font}
                    - slider:
                        id: ui_brightness_slider
                        align: CENTER
                        width: ${settings_control_width}
                        height: ${settings_slider_height}
                        adv_hittest: true
                        gesture_bubble: true
                        min_value: 10
                        max_value: 100
                        value: !lambda 'return id(screen_brightness).state;'
                        on_release:
                          - number.set:
                              id: screen_brightness
                              value: !lambda 'return x;'
              - obj:
                  width: ${settings_row_width}
                  height: ${settings_row_height}
                  bg_opa: TRANSP
                  border_width: 0
                  pad_left: 12
                  pad_right: 12
                  scrollable: false
                  widgets:
                    - label:
                        align: LEFT_MID
                        text: "Dim screen after"
                        text_color: 0xFFFFFF
                        text_font: ${settings_label_font}
                    - dropdown:
                        id: ui_dim_after_dd
                        align: CENTER
                        width: ${settings_dropdown_width}
                        options:
                          - "30 seconds"
                          - "1 minute"
                          - "2 minutes"
                          - "5 minutes"
                        on_value:
                          - select.set_index:
                              id: screen_dim_select
                              index: !lambda 'return x;'
              - obj:
                  width: ${settings_row_width}
                  height: ${settings_row_height}
                  bg_opa: TRANSP
                  border_width: 0
                  pad_left: 12
                  pad_right: 12
                  scrollable: false
                  widgets:
                    - label:
                        align: LEFT_MID
                        text: "Return to home after"
                        text_color: 0xFFFFFF
                        text_font: ${settings_label_font}
                    - dropdown:
                        id: ui_home_return_dd
                        align: CENTER
                        width: ${settings_dropdown_width}
                        options:
                          - "Off"
                          - "30 seconds"
                          - "1 minute"
                          - "2 minutes"
                          - "5 minutes"
                        on_value:
                          - select.set_index:
                              id: home_return_select
                              index: !lambda 'return x;'
              # ========================================================================
              # SECTION: CALL AND MUTE
              # ========================================================================
              - obj:
                  width: ${settings_row_width}
                  height: 2
                  bg_color: 0x444444
                  border_width: 0
                  pad_all: 0
              - label:
                  width: ${settings_row_width}
                  text: "Call and Mute"
                  text_align: CENTER
                  text_color: 0x88AAFF
                  text_font: ${settings_label_font}
              - obj:
                  width: ${settings_row_width}
                  height: ${settings_row_height}
                  bg_opa: TRANSP
                  border_width: 0
                  pad_left: 12
                  pad_right: 12
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        width: ${settings_mid_width}
                        text: "Speaker mute"
                        text_align: LEFT
                        text_color: 0xFFFFFF
                        text_font: ${settings_label_font}
                    - switch:
                        id: ui_speaker_mute_sw
                        width: ${settings_switch_width}
                        height: ${settings_switch_height}
                        state:
                          checked: !lambda 'return id(speaker_mute).state;'
                        on_value:
                          - lambda: |-
                              if (x == id(speaker_mute).state) return;
                              if (x) id(speaker_mute).turn_on();
                              else id(speaker_mute).turn_off();
              - obj:
                  width: ${settings_row_width}
                  height: ${settings_row_height}
                  bg_opa: TRANSP
                  border_width: 0
                  pad_left: 12
                  pad_right: 12
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        width: ${settings_mid_width}
                        text: "Mic mute"
                        text_align: LEFT
                        text_color: 0xFFFFFF
                        text_font: ${settings_label_font}
                    - switch:
                        id: ui_mic_mute_sw
                        width: ${settings_switch_width}
                        height: ${settings_switch_height}
                        state:
                          checked: !lambda 'return id(mute).state;'
                        on_value:
                          - lambda: |-
                              if (x == id(mute).state) return;
                              if (x) id(mute).turn_on();
                              else id(mute).turn_off();
              - obj:
                  width: ${settings_row_width}
                  height: ${settings_row_height}
                  bg_opa: TRANSP
                  border_width: 0
                  pad_left: 12
                  pad_right: 12
                  scrollable: false
                  layout:
                    type: FLEX
