      # is shown. Clearing media_picture makes the next poll download it again.
      on_load:
        - script.execute: media_poll
      on_unload:
        - lvgl.widget.hide: media_art
        - online_image.release: media_art_img
        - lambda: id(media_picture) = "";
        - lvgl.widget.hide: media_speaker_picker
      on_swipe_right:
        - lvgl.page.show:
            id: home_page
            animation: MOVE_RIGHT
            time: 250ms
