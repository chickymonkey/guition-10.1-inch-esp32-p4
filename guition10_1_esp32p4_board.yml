        # =====================================================================
        # 8. SECURITY CAMERAS                col 1 span 5 | row 12 span 5
        # =====================================================================
        - obj:
            styles: cell_style
            scrollable: false
            grid_cell_column_pos: 1
            grid_cell_row_pos: 12
            grid_cell_column_span: 5
            grid_cell_row_span: 5
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - obj:
                  id: card_cameras
                  styles: card_style
                  width: 100%
                  height: 100%
                  scrollable: false
                  widgets:
                    - label:
                        styles: icon_24
                        x: 14
                        y: 8
                        text: "\U000F07DE"
                    - label:
                        styles: title_text
                        x: 48
                        y: 6
                        text: "Cameras"
                    - obj:          # Front Door: last Frigate person snapshot
                        id: cam_front
                        styles: card_style
                        x: 12
                        y: 42
                        width: 221          # 20 px name strip + 5 px gap + 196 px snapshot
                        height: 196
                        radius: 10
                        border_width: 0
                        pad_all: 0
