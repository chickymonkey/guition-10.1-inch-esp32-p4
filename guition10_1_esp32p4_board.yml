                          - label: {align: LEFT_MID, x: 62, text: "Cat Away", text_font: font_body}

        # =====================================================================
        # 10. LIGHTS                         col 10 span 3 | row 12 span 5
        # Three toggle tiles. Off: dark grey. On: amber with an amber glow
        # (the "checked" state, set from the HA light state by the
        # light_*_on binary sensors). Tap toggles the light in HA.
        # =====================================================================
        - obj:
            styles: cell_style
            scrollable: false
            grid_cell_column_pos: 10
            grid_cell_row_pos: 12
            grid_cell_column_span: 3
            grid_cell_row_span: 5
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - obj:
                  id: card_lights
                  styles: card_style
                  width: 100%
                  height: 100%
                  scrollable: false
                  widgets:
                    - label:
                        styles: icon_24
                        x: 14
                        y: 8
                        text: "\U000F06E8"
                    - label:
                        styles: title_text
                        x: 48
                        y: 6
                        text: "Lights"
                    - button:
                        id: light_tv_lamp_btn
                        styles: light_tile
                        x: 12
                        y: 44
                        checked:
                          bg_color: 0xD9901A
                          border_color: 0xFBBF24
                          shadow_color: 0xF59E0B
                          shadow_width: 24
                          shadow_spread: 2
                          shadow_opa: 60%
                        on_click:
                          - homeassistant.action:
                              action: light.toggle
                              data:
                                entity_id: ${light_tv_lamp_entity}
                        widgets:
                          - image:
                              src: img_floor_lamp
                              align: TOP_MID
                              y: 12
                              radius: 8
                              clip_corner: true
                          - label:
                              align: BOTTOM_MID
                              y: -10
                              width: 76
                              text: "TV Floor Lamp"
                              text_align: CENTER
                              long_mode: WRAP
                              text_font: font_small
                              text_color: 0xFFFFFF
                    - button:
                        id: light_living_left_btn
                        styles: light_tile
                        x: 101
                        y: 44
                        checked:
                          bg_color: 0xD9901A
                          border_color: 0xFBBF24
                          shadow_color: 0xF59E0B
                          shadow_width: 24
                          shadow_spread: 2
                          shadow_opa: 60%
                        on_click:
                          - homeassistant.action:
                              action: light.toggle
