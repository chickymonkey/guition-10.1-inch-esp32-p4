                          - label: {align: LEFT_MID, x: 62, text: "Movie", text_font: font_body}
                    - button:
                        id: scene_cat_away_btn
                        styles: scene_btn
                        x: 194
                        y: 140
                        width: 172
                        height: 86
                        checked:
                          bg_color: 0x4F7FE8
                          border_color: 0x82A5FF
                        on_click:
