              # ---- Garage Door lock (col 2, row 1) ----
              - obj:
                  styles: cell_style
                  scrollable: false
                  grid_cell_column_pos: 2
                  grid_cell_row_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  widgets:
                    - obj:
                        id: card_garage_lock
                        styles: card_style
                        width: 100%
                        height: 100%
                        scrollable: false
                        clip_corner: true
                        widgets:
