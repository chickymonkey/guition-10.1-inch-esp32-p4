                                          text_font: font_small_18

                          # ---- outgoing call ----
                          - obj:
                              id: call_ringing_out_group
                              align: TOP_RIGHT
                              width: 100%
                              height: 100%
                              bg_color: 0x2A241C
                              border_width: 0
                              radius: 0
                              pad_all: 0
                              scrollable: false
                              hidden: true
                              widgets:
                                - label:
                                    id: call_ringing_out_status_label
