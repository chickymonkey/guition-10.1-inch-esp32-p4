                              else id(ns_switch).turn_off();
              - obj:
                  width: ${settings_row_width}
                  height: ${settings_row_height}
                  bg_opa: TRANSP
                  border_width: 0
                  pad_left: 12
                  pad_right: 12
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER
                  widgets:
                    - label:
                        width: ${settings_mid_width}
                        text: "Auto gain control"
                        text_align: LEFT
                        text_color: 0xFFFFFF
                        text_font: ${settings_label_font}
                    - switch:
                        id: ui_agc_sw
                        width: ${settings_switch_width}
                        height: ${settings_switch_height}
                        state:
                          checked: !lambda 'return id(agc_switch).state;'
                        on_value:
                          - lambda: |-
                              if (x == id(agc_switch).state) return;
                              if (x) id(agc_switch).turn_on();
                              else id(agc_switch).turn_off();

    # ==================================================================
    # VIDEO CALL: p4_video_renderer draws the remote picture directly into
    # call_video_surface (top 720 px); LVGL only owns the control strip.
    # ==================================================================
