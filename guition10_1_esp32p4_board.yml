# =======RUNTIME LOGIC AND ENTITIES============================================

globals:
  - id: peer_name
    type: std::string
    restore_value: no
    initial_value: '""'

  # call_ended_group is shown for ~4 s after a call terminates (hangup,
  # decline, error, timeout); update_call_tile checks this flag.
  - id: call_ended_active
    type: bool
    restore_value: false
    initial_value: "false"

  - id: voip_keypad_visible
    type: bool
    restore_value: false
    initial_value: "false"

  - id: voip_dial_buffer
    type: std::string
    restore_value: false
    initial_value: '""'

  # Daily energy (kWh) for the last 14 completed days, oldest first; NAN = no
  # data. Filled by fetch_energy_history.
  - id: energy_history
    type: float[14]
    restore_value: false

  # Soil moisture 9-10 am average: [0] two days ago, [1] yesterday; NAN = no
  # data. Filled by fetch_soil_history.
  - id: soil_history
    type: float[2]
    restore_value: false

  # True once a snapshot tile has its first picture; until then a new
  # entity_picture token alone also triggers a download.
  - id: snap_front_loaded
    type: bool
    restore_value: false
    initial_value: "false"
  - id: snap_driveway_loaded
    type: bool
    restore_value: false
    initial_value: "false"

script:
  # Home page clock card: time, day and date (no seconds shown).
  - id: update_clock
    then:
      - if:
          condition:
            time.has_time:
              id: my_time
          then:
            - lvgl.label.update:
                id: clock_time_label
                text: !lambda 'return id(my_time).now().strftime("%H:%M");'
            - lvgl.label.update:
                id: clock_day_label
                text: !lambda 'return id(my_time).now().strftime("%A");'
            - lvgl.label.update:
                id: clock_date_label
                text: !lambda 'return id(my_time).now().strftime("%d %B");'

  # Download the latest Frigate snapshot through HA's image proxy. The short
  # delay lets the new entity_picture token arrive with the new state.
  - id: fetch_front_snapshot
    mode: restart
    then:
      - delay: 1s
      - if:
          condition:
            lambda: |-
              const auto &p = id(snap_front_picture).state;
              return p.rfind("/api/", 0) == 0;
          then:
            - online_image.set_url:
                id: snap_front_img
                url: !lambda 'return std::string("${ha_base_url}") + id(snap_front_picture).state;'
  - id: fetch_driveway_snapshot
    mode: restart
    then:
      - delay: 1s
      - if:
          condition:
            lambda: |-
              const auto &p = id(snap_driveway_picture).state;
              return p.rfind("/api/", 0) == 0;
          then:
            - online_image.set_url:
                id: snap_driveway_img
                url: !lambda 'return std::string("${ha_base_url}") + id(snap_driveway_picture).state;'

  # Top-right status: Wi-Fi strength and the ESP32-C6 co-processor (its
  # firmware version, amber when an update is available). Wi-Fi runs through
  # the C6, so "connected" also means the C6 link is up.
  - id: update_status_bar
    then:
      - lambda: |-
          const bool up = wifi::global_wifi_component->is_connected();

          const char *wifi_icon = "\U000F05AA";   // wifi-off
          uint32_t wifi_color = 0xEF4444;
          char wifi_text[16] = "Offline";
          if (up) {
            // Signal in % from the wifi_signal_pct sensor: 2 x (dBm + 100).
            const float pct = id(wifi_signal_pct).state;
            wifi_color = 0x27D98D;
            if (std::isnan(pct)) {
              wifi_icon = "\U000F0928";               // no reading yet
              snprintf(wifi_text, sizeof(wifi_text), "Wi-Fi");
            } else {
              wifi_icon = pct >= 80 ? "\U000F0928" : pct >= 60 ? "\U000F0925" :
                          pct >= 40 ? "\U000F0922" : "\U000F091F";
              if (pct < 40) wifi_color = 0xF59E0B;
              snprintf(wifi_text, sizeof(wifi_text), "%.0f%%", pct);
            }
          }
          lv_label_set_text(id(status_wifi_icon), wifi_icon);
          lv_obj_set_style_text_color(id(status_wifi_icon), lv_color_hex(wifi_color), LV_PART_MAIN);
          lv_label_set_text(id(status_wifi_label), wifi_text);

          const auto *c6 = id(esp32_c6_coprocessor_update);
          const bool c6_update = c6->state == update::UPDATE_STATE_AVAILABLE;
          std::string c6_text = "C6 ";
          c6_text += c6->update_info.current_version.empty() ? (up ? "OK" : "--")
                                                             : c6->update_info.current_version;
          if (c6_update) c6_text += " (update)";
          const uint32_t c6_color = !up ? 0xEF4444 : c6_update ? 0xF59E0B : 0x27D98D;
          lv_label_set_text(id(status_c6_label), c6_text.c_str());
          lv_obj_set_style_text_color(id(status_c6_icon), lv_color_hex(c6_color), LV_PART_MAIN);

  # Reads the daily change of ${energy_daily_entity} (its 11:59 pm value)
  # for the last 14 completed days from Home Assistant long-term statistics.
  - id: fetch_energy_history
    mode: single
    then:
      - if:
          condition:
            and:
              - api.connected:
              - time.has_time:
                  id: my_time
          else:
            - logger.log:
                level: WARN
                tag: energy
                format: "Skipped: API connected=%d, time valid=%d"
                args: ['(int) api::global_api_server->is_connected()', '(int) id(my_time).now().is_valid()']
          then:
            - logger.log:
                tag: energy
                format: "Requesting 14 days of ${energy_daily_entity} from HA"
            - homeassistant.action:
                action: recorder.get_statistics
                data:
                  statistic_ids: ${energy_daily_entity}
                  period: day
                  # The meter is total_increasing, so statistics keep only
                  # state/sum (no max). "change" = energy used that day, i.e.
                  # the 11:59 pm reading; HA handles the midnight reset.
                  types: change
                  # Local midnight 14 days ago up to local midnight today.
                  start_time: !lambda |-
                    const auto now = id(my_time).now();
                    return ESPTime::from_epoch_local(now.timestamp - 14 * 86400)
                        .strftime("%Y-%m-%d 00:00:00");
                  end_time: !lambda |-
                    return id(my_time).now().strftime("%Y-%m-%d 00:00:00");
                capture_response: true
                on_success:
                  - lambda: |-
                      JsonObjectConst root = response["response"].is<JsonObjectConst>()
                          ? response["response"].as<JsonObjectConst>() : response;
                      JsonArrayConst rows =
                          root["statistics"]["${energy_daily_entity}"].as<JsonArrayConst>();
                      for (auto &v : id(energy_history)) v = NAN;
                      // Newest rows on the right; missing days stay empty.
                      const int n = rows.size();
                      const int first = n > 14 ? n - 14 : 0;
                      int slot = 14 - (n - first);
                      for (int i = first; i < n; i++)
                        id(energy_history)[slot++] = rows[i]["change"] | NAN;
                      ESP_LOGI("energy", "Loaded %d days of %s", n - first, "${energy_daily_entity}");
                      if (n == 0) {
                        // Show what HA actually sent, to see why there are no rows.
                        std::string raw;
                        serializeJson(response, raw);
                        if (raw.size() > 400) raw.resize(400);
                        ESP_LOGW("energy", "No rows. Response: %s", raw.c_str());
                      }
                  - script.execute: draw_energy_bars
                on_error:
                  - logger.log:
                      level: WARN
                      tag: energy
                      format: "recorder.get_statistics failed: %s"
                      args: ['error.c_str()']

  # Soil moisture history: the 9-10 am hourly mean of ${soil_moisture_entity}
  # two days ago and yesterday, one recorder.get_statistics call per day.
  - id: fetch_soil_history
    mode: single
    then:
      - if:
          condition:
            and:
              - api.connected:
              - time.has_time:
                  id: my_time
          then:
            - lambda: |-
                for (auto &v : id(soil_history)) v = NAN;
            - homeassistant.action:
                action: recorder.get_statistics
                data:
                  statistic_ids: ${soil_moisture_entity}
                  period: hour
                  types: mean
                  start_time: !lambda |-
                    return ESPTime::from_epoch_local(id(my_time).now().timestamp - 2 * 86400)
                        .strftime("%Y-%m-%d 09:00:00");
                  end_time: !lambda |-
                    return ESPTime::from_epoch_local(id(my_time).now().timestamp - 2 * 86400)
                        .strftime("%Y-%m-%d 10:00:00");
                capture_response: true
                on_success:
                  - lambda: |-
                      JsonObjectConst root = response["response"].is<JsonObjectConst>()
                          ? response["response"].as<JsonObjectConst>() : response;
                      JsonArrayConst rows =
                          root["statistics"]["${soil_moisture_entity}"].as<JsonArrayConst>();
                      if (rows.size() > 0) id(soil_history)[0] = rows[0]["mean"] | NAN;
                  - script.execute: draw_soil_labels
                on_error:
                  - logger.log:
                      level: WARN
                      tag: soil
                      format: "recorder.get_statistics failed: %s"
                      args: ['error.c_str()']
            - homeassistant.action:
                action: recorder.get_statistics
                data:
                  statistic_ids: ${soil_moisture_entity}
                  period: hour
                  types: mean
                  start_time: !lambda |-
                    return ESPTime::from_epoch_local(id(my_time).now().timestamp - 86400)
                        .strftime("%Y-%m-%d 09:00:00");
                  end_time: !lambda |-
                    return ESPTime::from_epoch_local(id(my_time).now().timestamp - 86400)
                        .strftime("%Y-%m-%d 10:00:00");
                capture_response: true
                on_success:
                  - lambda: |-
                      JsonObjectConst root = response["response"].is<JsonObjectConst>()
                          ? response["response"].as<JsonObjectConst>() : response;
                      JsonArrayConst rows =
                          root["statistics"]["${soil_moisture_entity}"].as<JsonArrayConst>();
                      if (rows.size() > 0) id(soil_history)[1] = rows[0]["mean"] | NAN;
                  - script.execute: draw_soil_labels
                on_error:
                  - logger.log:
                      level: WARN
                      tag: soil
                      format: "recorder.get_statistics failed: %s"
                      args: ['error.c_str()']

  # Day name + value for the two history slots ("Tue 45%"; "--%" = no data).
  - id: draw_soil_labels
    then:
      - lambda: |-
          lv_obj_t *labels[2] = {id(soil_day1_label), id(soil_day2_label)};
          const time_t now = id(my_time).now().timestamp;
          for (int i = 0; i < 2; i++) {
            const std::string day = ESPTime::from_epoch_local(now - (2 - i) * 86400).strftime("%a");
            const float v = id(soil_history)[i];
            char text[24];
            if (std::isnan(v))
              snprintf(text, sizeof(text), "%s --%%", day.c_str());
            else
              snprintf(text, sizeof(text), "%s %.0f%%", day.c_str(), v * ${soil_moisture_scale});
            lv_label_set_text(labels[i], text);
          }

  # Scales the 14 bars to the busiest day; days without data show as a stub.
  - id: draw_energy_bars
    then:
      - lambda: |-
          lv_obj_t *bars[14] = {id(ebar_0), id(ebar_1), id(ebar_2), id(ebar_3), id(ebar_4),
                                id(ebar_5), id(ebar_6), id(ebar_7), id(ebar_8), id(ebar_9),
                                id(ebar_10), id(ebar_11), id(ebar_12), id(ebar_13)};
          float max_v = 0, total = 0;
          int days = 0;
          for (float v : id(energy_history)) {
            if (std::isnan(v)) continue;
            max_v = std::max(max_v, v);
            total += v;
            days++;
          }
          const int full = lv_obj_get_content_height(id(elec_bars));
          for (int i = 0; i < 14; i++) {
            const float v = id(energy_history)[i];
            const bool ok = !std::isnan(v) && max_v > 0;
            const int h = ok ? std::max(4, (int) (v / max_v * full)) : 4;
            lv_obj_set_height(bars[i], h);
            lv_obj_set_style_bg_opa(bars[i], ok ? LV_OPA_COVER : LV_OPA_30, LV_PART_MAIN);
          }
          char text[48];
          if (days > 0)
            snprintf(text, sizeof(text), "Avg %.1f kWh/day", total / days);
          else
            snprintf(text, sizeof(text), "no data");
          lv_label_set_text(id(elec_hist_label), text);

          // Y axis: the top of the bars is the busiest day, the middle half of it.
          char axis[12] = "";
          if (max_v > 0) snprintf(axis, sizeof(axis), max_v < 10 ? "%.1f" : "%.0f", max_v);
          lv_label_set_text(id(elec_axis_max), axis);
          if (max_v > 0) snprintf(axis, sizeof(axis), max_v < 20 ? "%.1f" : "%.0f", max_v / 2);
          lv_label_set_text(id(elec_axis_mid), axis);

  - id: show_voip_keypad
    mode: single
    then:
      - lambda: |-
          if (!id(phone).is_idle() || id(voip_keypad_visible)) return;
          id(voip_keypad_visible) = true;
          const int height = lv_obj_get_height(id(voip_tile));
          lv_obj_clear_flag(id(call_idle_group), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(call_keypad_group), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_y(id(call_idle_group), 0);
          lv_obj_set_y(id(call_keypad_group), height);
          lv_anim_t contacts;
          lv_anim_init(&contacts);
          lv_anim_set_var(&contacts, id(call_idle_group));
          lv_anim_set_values(&contacts, 0, -height);
          lv_anim_set_duration(&contacts, 220);
          lv_anim_set_exec_cb(&contacts, [](void *obj, int32_t y) {
            lv_obj_set_y(static_cast<lv_obj_t *>(obj), y);
          });
          lv_anim_start(&contacts);
          lv_anim_t keypad;
          lv_anim_init(&keypad);
          lv_anim_set_var(&keypad, id(call_keypad_group));
          lv_anim_set_values(&keypad, height, 0);
          lv_anim_set_duration(&keypad, 220);
          lv_anim_set_exec_cb(&keypad, [](void *obj, int32_t y) {
            lv_obj_set_y(static_cast<lv_obj_t *>(obj), y);
          });
          lv_anim_start(&keypad);

  - id: hide_voip_keypad
    mode: single
    then:
      - lambda: |-
          if (!id(voip_keypad_visible)) return;
          id(voip_keypad_visible) = false;
          const int height = lv_obj_get_height(id(voip_tile));
          lv_obj_clear_flag(id(call_idle_group), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(call_keypad_group), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_y(id(call_idle_group), -height);
          lv_obj_set_y(id(call_keypad_group), 0);
          lv_anim_t contacts;
          lv_anim_init(&contacts);
          lv_anim_set_var(&contacts, id(call_idle_group));
          lv_anim_set_values(&contacts, -height, 0);
          lv_anim_set_duration(&contacts, 220);
          lv_anim_set_exec_cb(&contacts, [](void *obj, int32_t y) {
            lv_obj_set_y(static_cast<lv_obj_t *>(obj), y);
          });
          lv_anim_start(&contacts);
          lv_anim_t keypad;
          lv_anim_init(&keypad);
          lv_anim_set_var(&keypad, id(call_keypad_group));
          lv_anim_set_values(&keypad, 0, height);
          lv_anim_set_duration(&keypad, 220);
          lv_anim_set_exec_cb(&keypad, [](void *obj, int32_t y) {
            lv_obj_set_y(static_cast<lv_obj_t *>(obj), y);
          });
          lv_anim_start(&keypad);

  # Shows the call state in the home page Intercom card (voip_tile).
  - id: update_call_tile
    mode: restart
    then:
      - lambda: |-
          auto set_hidden = [](lv_obj_t *obj, bool hidden) {
            const bool is_hidden = lv_obj_has_flag(obj, LV_OBJ_FLAG_HIDDEN);
            if (hidden && !is_hidden) {
              lv_obj_add_flag(obj, LV_OBJ_FLAG_HIDDEN);
            } else if (!hidden && is_hidden) {
              lv_obj_clear_flag(obj, LV_OBJ_FLAG_HIDDEN);
            }
          };
          auto set_label = [](lv_obj_t *label, const char *text) {
            if (text == nullptr) text = "";
            const char *current = lv_label_get_text(label);
            if (current == nullptr || strcmp(current, text) != 0)
              lv_label_set_text(label, text);
          };

          std::string call_state = id(phone).get_state_str();

          // Telephone state always wins over the optional idle keypad. Cancel
          // any in-flight card animation so ringing/calling cannot inherit an
          // off-screen position.
          if (call_state != "idle" && !call_state.empty()) {
            id(voip_keypad_visible) = false;
            lv_anim_del(id(call_idle_group), nullptr);
            lv_anim_del(id(call_keypad_group), nullptr);
            lv_obj_set_y(id(call_idle_group), 0);
            lv_obj_set_y(id(call_keypad_group), lv_obj_get_height(id(voip_tile)));
          }

          set_hidden(id(call_idle_group), true);
          set_hidden(id(call_keypad_group), true);
          set_hidden(id(call_ringing_in_group), true);
          set_hidden(id(call_ringing_out_group), true);
          set_hidden(id(call_in_call_group), true);
          set_hidden(id(call_ended_group), true);

          if (id(call_ended_active) && !id(phone).is_active()) {
            set_hidden(id(call_ended_group), false);
          } else if (call_state == "ringing") {
            set_label(id(call_ringing_in_peer_label), id(peer_name).c_str());
            set_hidden(id(call_ringing_in_group), false);
          } else if (call_state == "calling" || call_state == "remote_ringing") {
            set_label(id(call_ringing_out_peer_label), id(peer_name).c_str());
            set_hidden(id(call_ringing_out_group), false);
          } else if (call_state == "in_call" || call_state == "connecting") {
            set_label(id(call_in_call_peer_label), id(peer_name).c_str());
            set_hidden(id(call_in_call_group), false);
          } else {
            set_label(id(call_idle_peer_label), id(peer_name).c_str());
            char buf[32];
            snprintf(buf, sizeof(buf), "Contacts: %u",
                     static_cast<unsigned>(id(phone).get_contact_count()));
            set_label(id(call_idle_contacts_label), buf);
            if (id(voip_keypad_visible)) {
              lv_obj_set_y(id(call_keypad_group), 0);
              set_hidden(id(call_keypad_group), false);
            } else {
              lv_obj_set_y(id(call_idle_group), 0);
              lv_obj_set_y(id(call_keypad_group), lv_obj_get_height(id(voip_tile)));
              set_hidden(id(call_idle_group), false);
            }
          }

  # Back to the home page (from the video page, or when a call needs it). The
  # settings and camera pages stay open while the phone is idle.
  - id: show_phone_page
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *scr = lv_disp_get_scr_act(nullptr);
          const bool keep_page = (scr == id(settings_p4_page)->obj ||
                                  scr == id(cam_front_page)->obj ||
                                  scr == id(cam_driveway_page)->obj) && id(phone).is_idle();
          if (scr != id(home_page)->obj && !keep_page)
            lv_disp_load_scr(id(home_page)->obj);
      - script.execute: update_call_tile

  # Called by p4_video_renderer on the first remote frame.
  - id: show_video_page
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(phone).is_in_call() &&
                     id(p4_video).has_remote_frame();
          then:
            - lvgl.label.update:
                id: call_video_peer_label
                text: !lambda 'return id(peer_name);'
            - lvgl.page.show: call_video_page

  - id: close_settings_page
    then:
      - lvgl.page.show:
          id: home_page
          animation: MOVE_BOTTOM
          time: 250ms
      - script.execute: update_call_tile

  # Shows peer + reason in the Intercom card for ~4 s after a call ends.
  - id: show_call_ended
    mode: restart
    parameters:
      peer: string
      reason: string
    then:
      - globals.set:
          id: call_ended_active
          value: "true"
      - lvgl.label.update:
          id: call_ended_peer_label
          text: !lambda |-
            return peer.empty() ? std::string("Call ended.") : ("Call with " + peer + " ended.");
      - lvgl.label.update:
          id: call_ended_reason_label
          text: !lambda |-
            std::string label;
            if      (reason == "local_hangup")    label = "Local hangup";
            else if (reason == "remote_hangup")   label = "Remote hangup";
            else if (reason == "declined")        label = "Declined";
            else if (reason == "timeout")         label = "Timeout";
            else if (reason == "busy")            label = "Busy";
            else if (reason == "unreachable")     label = "Unreachable";
            else if (reason == "protocol_error")  label = "Protocol error";
            else if (reason == "bridge_error")    label = "Bridge error";
            else                                  label = reason.empty() ? std::string("Ended") : reason;
            return std::string("Reason: ") + label;
      - script.execute: backlight_timer
      - script.execute: show_phone_page
      - delay: 4s
      - globals.set:
          id: call_ended_active
          value: "false"
      - script.execute: update_call_tile

  # Ringtone: loop the bundled FLAC on the announcement pipeline while ringing.
  - id: voip_start_ringtone
    then:
      - if:
          condition:
            and:
              - voip_stack.is_ringing:
              - not:
                  script.is_running: voip_ringing_loop
          then:
            - script.execute: voip_ringing_loop

  - id: voip_ringing_loop
    mode: single
    then:
      - while:
          condition:
            voip_stack.is_ringing:
          then:
            - media_player.play_media:
                id: speaker_player
                media_url: "audio-file://voip_ringing_sound"
                announcement: true
            - wait_until:
                condition:
                  lambda: |-
                    return id(ringtone_file_source).get_state() !=
                           media_source::MediaSourceState::IDLE;
                timeout: 2s
            - wait_until:
                condition:
                  or:
                    - not:
                        voip_stack.is_ringing:
                    - lambda: |-
                        return id(ringtone_file_source).get_state() ==
                               media_source::MediaSourceState::IDLE;
                timeout: 5s
      - media_player.stop:
          id: speaker_player
          announcement: true

  - id: voip_stop_ringtone
    then:
      - script.stop: voip_ringing_loop
      - media_player.stop:
          id: speaker_player
          announcement: true

  # Copies entity state into the settings page widgets when it opens.
  - id: settings_sync_widgets
    then:
      - lvgl.slider.update:
          id: ui_speaker_vol_slider
          value: !lambda 'return id(master_volume).state;'
#      - lvgl.slider.update:
#          id: ui_mic_vol_slider
#          value: !lambda 'return id(mic_gain).state;'
      - lvgl.switch.update:
          id: ui_speaker_mute_sw
          state:
            checked: !lambda 'return id(speaker_mute).state;'
      - lvgl.switch.update:
          id: ui_mic_mute_sw
          state:
            checked: !lambda 'return id(mute).state;'
      - lvgl.switch.update:
          id: ui_auto_answer_sw
          state:
            checked: !lambda 'return id(auto_answer_switch).state;'
      - lvgl.slider.update:
          id: ui_brightness_slider
          value: !lambda 'return id(screen_brightness).state;'
      - lvgl.dropdown.update:
          id: ui_dim_after_dd
          selected_index: !lambda 'return id(screen_dim_select).active_index().value_or(1);'
      - lvgl.dropdown.update:
          id: ui_home_return_dd
          selected_index: !lambda 'return id(home_return_select).active_index().value_or(2);'
#      - lvgl.switch.update:
#          id: ui_dnd_sw
#          state:
#            checked: !lambda 'return id(dnd_switch).state;'
#      - lvgl.switch.update:
#          id: ui_aec_sw
#          state:
#            checked: !lambda 'return id(aec_switch).state;'
#      - lvgl.dropdown.update:
#          id: ui_aec_mode_dd
#          selected_text: !lambda 'return id(aec_mode_select).current_option();'
#      - lvgl.switch.update:
#          id: ui_ns_sw
#          state:
#            checked: !lambda 'return id(ns_switch).state;'
#      - lvgl.switch.update:
#          id: ui_agc_sw
#          state:
#            checked: !lambda 'return id(agc_switch).state;'

  # Settings page, bottom right: last reset reason and uptime (HH:MM:SS; the
  # hours keep counting past 24). millis_64() does not wrap after 49 days.
  - id: update_settings_info
    then:
      - lambda: |-
          const char *reason;
          switch (esp_reset_reason()) {
            case ESP_RST_POWERON:   reason = "Power on"; break;
            case ESP_RST_EXT:       reason = "Reset pin"; break;
            case ESP_RST_SW:        reason = "Software restart"; break;
            case ESP_RST_PANIC:     reason = "Crash (panic)"; break;
            case ESP_RST_INT_WDT:   reason = "Interrupt watchdog"; break;
            case ESP_RST_TASK_WDT:  reason = "Task watchdog"; break;
            case ESP_RST_WDT:       reason = "Watchdog"; break;
            case ESP_RST_DEEPSLEEP: reason = "Deep sleep wake"; break;
            case ESP_RST_BROWNOUT:  reason = "Brownout (power dip)"; break;
            case ESP_RST_SDIO:      reason = "SDIO reset"; break;
            default:                reason = "Other"; break;
          }
          char text[48];
          snprintf(text, sizeof(text), "Last restart: %s", reason);
          lv_label_set_text(id(settings_reset_reason_label), text);

          const uint64_t s = millis_64() / 1000;
          snprintf(text, sizeof(text), "Uptime %02lu:%02u:%02u",
                   (unsigned long) (s / 3600), (unsigned) (s / 60 % 60), (unsigned) (s % 60));
          lv_label_set_text(id(settings_uptime_label), text);

  - id: update_ic_idle_labels
    then:
      - lambda: id(peer_name) = id(phone).get_current_destination();
      - lvgl.label.update:
          id: call_idle_peer_label
          text: !lambda 'return id(peer_name);'
      - lvgl.label.update:
          id: call_idle_contacts_label
          text: !lambda |-
            char buf[32];
            snprintf(
                buf, sizeof(buf), "Contacts: %u",
                static_cast<unsigned>(id(phone).get_contact_count()));
            return std::string(buf);

  # NS4150 amplifier power-down, started by esp_audio_stack on_amplifier_idle
  # and cancelled by on_amplifier_required. Left on while idle the amp turns
  # the DAC's idle noise into an audible squeal; the 2 s delay keeps sound
  # tails and back-to-back sounds (ringtone loop) from being cut or clicking.
  - id: speaker_amp_idle_off
    mode: restart
    then:
      - delay: 2s
      - output.turn_off: speaker_enable

  # Highlights the tapped scene button (0 Home, 1 Night, 2 Movie, 3 Cat Away).
  - id: scene_select
    parameters:
      which: int
    then:
      - lvgl.widget.update: {id: scene_home_btn, state: {checked: !lambda 'return which == 0;'}}
      - lvgl.widget.update: {id: scene_night_btn, state: {checked: !lambda 'return which == 1;'}}
      - lvgl.widget.update: {id: scene_movie_btn, state: {checked: !lambda 'return which == 2;'}}
      - lvgl.widget.update: {id: scene_cat_away_btn, state: {checked: !lambda 'return which == 3;'}}

  - id: heater_update_buttons
    then:
      - lvgl.widget.update:
          id: heater_btn_off
          state:
            checked: !lambda 'return !id(heater_power_on).state && !id(heater_fan_on).state;'
      - lvgl.widget.update:
          id: heater_btn_heat
          state:
            checked: !lambda 'return id(heater_power_on).state;'
      - lvgl.widget.update:
          id: heater_btn_fan
          state:
            checked: !lambda 'return id(heater_fan_on).state;'

  # Garage button shows the controller's next action: Stop (red), Down, or Up.
  - id: garage_update_button
    then:
      - lambda: |-
          const char *icon = "\U000F0737";   // arrow-up-bold
          uint32_t color = 0x3A4DE0;
          if (id(garage_next_stop).state) {
            icon = "\U000F0666";             // stop-circle
            color = 0xDC2626;
          } else if (id(garage_next_down).state) {
            icon = "\U000F072E";             // arrow-down-bold
          }
          lv_label_set_text(id(garage_btn_icon), icon);
          lv_obj_set_style_bg_color(id(garage_btn), lv_color_hex(color), LV_PART_MAIN);

  # Backlight: the chosen Screen Brightness on touch/activity, dimmed to 60 %
  # of it after the "Dim screen after" time, then 20 % of it 2 minutes later.
  - id: backlight_timer
    mode: restart
    then:
      - output.set_level:
          id: backlight_pwm
          level: !lambda 'return id(screen_brightness).state / 100.0f;'
      - delay: !lambda |-
          static const uint32_t DIM_MS[] = {30000, 60000, 120000, 300000};
          const size_t i = id(screen_dim_select).active_index().value_or(1);
          return DIM_MS[i < 4 ? i : 1];
      - output.set_level:
          id: backlight_pwm
          level: !lambda 'return id(screen_brightness).state * 0.6f / 100.0f;'
      - delay: 120s
      - output.set_level:
          id: backlight_pwm
          level: !lambda 'return std::max(0.05f, id(screen_brightness).state * 0.2f / 100.0f);'

  # Return to the home page after the "Return to home after" time with no
  # touch. Restarted by every touch; does nothing when set to Off or while a
  # call is ringing or active (the call screens manage their own page).
  - id: home_return_timer
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(home_return_select).active_index().value_or(2) > 0;'
          then:
            - delay: !lambda |-
                static const uint32_t HOME_MS[] = {0, 30000, 60000, 120000, 300000};
                const size_t i = id(home_return_select).active_index().value_or(2);
                return HOME_MS[i < 5 ? i : 2];
            - if:
                condition:
                  lambda: 'return id(phone).is_idle() && !id(home_page)->is_showing();'
                then:
                  - lvgl.widget.hide: reboot_confirm
                  - lvgl.page.show:
                      id: home_page
                      animation: FADE_IN
                      time: 250ms
                  - script.execute: update_call_tile

binary_sensor:
  - platform: gpio
    name: Boot Button
    id: boot_button
    pin:
      number: ${boot_button_pin}
      inverted: true
      mode:
        input: true
        pullup: true
    on_multi_click:
      # Single click: answer an incoming call, otherwise call / hang up.
      - timing:
          - ON for at most 500ms
          - OFF for at least 400ms
        then:
          - if:
              condition:
                voip_stack.is_ringing:
              then:
                - voip_stack.answer_call:
              else:
                - voip_stack.call_toggle:
      # Long press: toggle mic mute
      - timing:
          - ON for 1s to 3s
          - OFF for at least 300ms
        then:
          - switch.toggle: mute

  # Garage roller door (see the garage_* substitutions)
  - platform: homeassistant
    id: garage_next_up
    entity_id: ${garage_next_up_entity}
    internal: true
    on_state:
      - script.execute: garage_update_button

  - platform: homeassistant
    id: garage_next_stop
    entity_id: ${garage_next_stop_entity}
    internal: true
    on_state:
      - script.execute: garage_update_button

  - platform: homeassistant
    id: garage_next_down
    entity_id: ${garage_next_down_entity}
    internal: true
    on_state:
      - script.execute: garage_update_button

  # Lights card: HA light state -> tile on (amber, checked) / off (grey).
  - platform: homeassistant
    id: light_tv_lamp_on
    entity_id: ${light_tv_lamp_entity}
    internal: true
    on_state:
      - lvgl.widget.update:
          id: light_tv_lamp_btn
          state:
            checked: !lambda 'return x;'
  - platform: homeassistant
    id: light_living_left_on
    entity_id: ${light_living_left_entity}
    internal: true
    on_state:
      - lvgl.widget.update:
          id: light_living_left_btn
          state:
            checked: !lambda 'return x;'
      - lvgl.label.update:
          id: light_living_left_icon
          text_color: !lambda 'return x ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x8995A7);'
  - platform: homeassistant
    id: light_living_right_on
    entity_id: ${light_living_right_entity}
    internal: true
    on_state:
      - lvgl.widget.update:
          id: light_living_right_btn
          state:
            checked: !lambda 'return x;'
      - lvgl.label.update:
          id: light_living_right_icon
          text_color: !lambda 'return x ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x8995A7);'

  # Gas heater: highlight Off / Heat / Fan from the Rinnai switches
  - platform: homeassistant
    id: heater_power_on
    entity_id: ${heater_power_switch}
    internal: true
    on_state:
      - script.execute: heater_update_buttons
  - platform: homeassistant
    id: heater_fan_on
    entity_id: ${heater_fan_switch}
    internal: true
    on_state:
      - script.execute: heater_update_buttons

switch:
  # Echo cancellation on/off (esp_aec through esp_audio_stack).
  - platform: esp_audio_stack
    aec:
      id: aec_switch
      name: Echo Cancellation
      icon: mdi:ear-hearing
      restore_mode: RESTORE_DEFAULT_ON

  # VoIP camera (OV02C10): send video on calls. Can be set at any time; while
  # idle it is the choice for the next call, during a call it adds or drops
  # the outgoing video. The sensor itself only captures while a call with
  # negotiated video consumes its frames.
  - platform: template
    name: Camera
    id: camera_switch
    icon: mdi:camera
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - voip_stack.set_video_send:
          enabled: true
    on_turn_off:
      - voip_stack.set_video_send:
          enabled: false

  - platform: template
    name: Mic Mute
    id: mute
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - logger.log:
          level: INFO
          tag: mute
          format: "Mic mute ON"
      - microphone.mute: mic_aec
    on_turn_off:
      - logger.log:
          level: INFO
          tag: mute
          format: "Mic mute OFF"
      - microphone.unmute: mic_aec

  # Speaker Mute: DAC mute plus amplifier enable/disable
  - platform: template
    name: Speaker Mute
    id: speaker_mute
    icon: mdi:volume-off
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - logger.log:
          level: INFO
          tag: mute
          format: "Speaker mute ON: DAC muted, amplifier off"
      - speaker.mute_on: hw_speaker
      - delay: 50ms
      - output.turn_off: speaker_enable
    on_turn_off:
      - logger.log:
          level: INFO
          tag: mute
          format: "Speaker mute OFF: DAC unmuted, amplifier follows playback"
      - if:
          condition:
            speaker.is_playing: hw_speaker
          then:
            - output.turn_on: speaker_enable
            - delay: 50ms
      - speaker.mute_off: hw_speaker

# Display settings, also shown in Home Assistant. All restore after a reboot;
# the settings page dropdowns and slider set these.
select:
  - platform: template
    id: screen_dim_select
    name: Screen Dim After
    icon: mdi:brightness-6
    entity_category: config
    options: ["30 seconds", "1 minute", "2 minutes", "5 minutes"]
    initial_option: "1 minute"
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: backlight_timer
  - platform: template
    id: home_return_select
    name: Return To Home After
    icon: mdi:home-clock
    entity_category: config
    options: ["Off", "30 seconds", "1 minute", "2 minutes", "5 minutes"]
    initial_option: "1 minute"
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: home_return_timer

number:
  - platform: template
    id: screen_brightness
    name: Screen Brightness
    icon: mdi:brightness-percent
    entity_category: config
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 5
    initial_value: 100
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: backlight_timer

button:
  # Re-reads the 14-day energy history from HA (also runs on connect and at 00:05).
  - platform: template
    name: Refresh Energy History
    icon: mdi:chart-bar
    entity_category: diagnostic
    on_press:
      - script.execute: fetch_energy_history

sensor:
  # Wi-Fi signal (dBm) and the same as a percentage; the status bar shows %.
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy # WiFi signal in %
    source_id: wifi_signal_db
    id: wifi_signal_pct
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""
    on_value:
      then:
        - script.execute: update_status_bar

  - platform: homeassistant
    id: garage_position
    entity_id: ${garage_position_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: garage_position_label
          text:
            format: "%.0f%%"
            args: ['x']
      # Position 100 % = fully open (no slats), 0 % = closed (frame full).
      - lambda: |-
          int pos = (int) x;
          if (pos < 0) pos = 0;
          if (pos > 100) pos = 100;
          const int full = lv_obj_get_content_height(id(garage_position_container));
          lv_obj_set_height(id(garage_door_curtain), full * (100 - pos) / 100);
          // Status and icon from the position: 0-3 % closed, 97-100 % open.
          const char *status = pos <= 3 ? "Closed" : pos >= 97 ? "Open" : "Partly open";
          lv_label_set_text(id(garage_status_label), status);
          lv_label_set_text(id(garage_icon), pos <= 3 ? "\U000F06D9" : "\U000F06DA");

  - platform: homeassistant
    id: ha_power
    entity_id: ${power_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: elec_value_label
          text:
            format: "%.1f"
            args: ['x / 1000.0f']
      - lvgl.arc.update:
          id: elec_arc
          value: !lambda 'return (int) x;'

  - platform: homeassistant
    id: ha_temp_living
    entity_id: ${temp_living_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: temp_living_label
          text:
            format: "%.1f°"
            args: ['x']

  - platform: homeassistant
    id: ha_temp_bedroom
    entity_id: ${temp_bedroom_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: temp_bedroom_label
          text:
            format: "%.1f°"
            args: ['x']

  - platform: homeassistant
    id: ha_temp_outdoor
    entity_id: ${temp_outdoor_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: temp_outdoor_label
          text:
            format: "%.1f°"
            args: ['x']

  - platform: homeassistant
    id: ha_humidity
    entity_id: ${humidity_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: humidity_label
          text:
            format: "%.0f%%"
            args: ['x']

  - platform: homeassistant
    id: ha_soil_moisture
    entity_id: ${soil_moisture_entity}
    internal: true
    on_value:
      - lvgl.label.update:
          id: soil_now_label
          text:
            format: "Today %.0f%%"
            args: ['x * ${soil_moisture_scale}']

text_sensor:
  ##RTSP camera url.
  - platform: homeassistant
    id: cam_url
    entity_id: input_text.esp_camera_url
    on_value:
      - lambda: id(front_door_full).set_url(x);
  - platform: homeassistant
    id: cam_url_driveway
    entity_id: input_text.esp_camera_url_driveway
    on_value:
      - lambda: id(driveway_full).set_url(x);

  # Frigate snapshots for the home page tiles. The image entity's state
  # changes on every new detection; its entity_picture attribute is the
  # tokenised image-proxy path (the token rotates, so it is read each time).
  - platform: homeassistant
    id: snap_front_picture
    entity_id: ${snapshot_front_entity}
    attribute: entity_picture
    internal: true
    on_value:
      - if:
          condition:
            lambda: return !id(snap_front_loaded);
          then:
            - script.execute: fetch_front_snapshot
  - platform: homeassistant
    id: snap_front_state
    entity_id: ${snapshot_front_entity}
    internal: true
    on_value:
      - script.execute: fetch_front_snapshot
  - platform: homeassistant
    id: snap_driveway_picture
    entity_id: ${snapshot_driveway_entity}
    attribute: entity_picture
    internal: true
    on_value:
      - if:
          condition:
            lambda: return !id(snap_driveway_loaded);
          then:
            - script.execute: fetch_driveway_snapshot
  - platform: homeassistant
    id: snap_driveway_state
    entity_id: ${snapshot_driveway_entity}
    internal: true
    on_value:
      - script.execute: fetch_driveway_snapshot

  - platform: homeassistant
    id: front_lock_state
    entity_id: ${front_lock_entity}
    internal: true
    on_value:
      - lvgl.widget.update:
          id: front_lock_btn
          state:
            checked: !lambda 'return x == "locked";'
      - lvgl.label.update:
          id: front_lock_icon
          text: !lambda 'return std::string(x == "locked" ? "\U000F033E" : "\U000F033F");'

  - platform: homeassistant
    id: garage_lock_state
    entity_id: ${garage_lock_entity}
    internal: true
    on_value:
      - lvgl.widget.update:
          id: garage_lock_btn
          state:
            checked: !lambda 'return x == "locked";'
      - lvgl.label.update:
          id: garage_lock_icon
          text: !lambda 'return std::string(x == "locked" ? "\U000F033E" : "\U000F033F");'

interval:
  # Top-right Wi-Fi / C6 status
  - interval: 120s
    then:
      - script.execute: update_status_bar

  # Settings page uptime ticks every second, only while that page is shown.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return id(settings_p4_page)->is_showing();
          then:
            - script.execute: update_settings_info

  # Home page clock card. The clock shows no seconds, so every 45 s is
  # enough (the minute flips up to 45 s late).
  - interval: 45s
    then:
      - script.execute: update_clock
