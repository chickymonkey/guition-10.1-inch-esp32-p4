# =============================================================================
# Guition JC8012P4A1C_I_W_Y1 (ESP32-P4 10.1" sku:10153002-v3 [2635]): SIP JPEG videophone + HA dashboard
# Profile: VoIP only / single-mic AEC / P4 landscape
#
# Based on n-IA-hane/esphome-intercom
#   yamls/voip-only/single-bus/waveshare-p4-touch-videophone-jpeg.yaml
# (no Voice Assistant, wake word, Sendspin, HTTP media or runtime controller)
# plus the Guition hardware from guition-p4-101.yaml and the LVGL home-page
# dashboard from lvgl_home_page.yml. voip_stack callbacks drive the UI
# directly. Board-specific changes are marked [GUITION].
# =============================================================================
#
# CAPTURE: ES8311 stereo RX; one microphone and the ES8311 internal DAC reference.
#   [ES8311 RX left: MIC1] + [ES8311 RX right: DAC feedback REF]
#     -> audio_stack 48 -> 16 kHz -> aec_processor (esp_aec, AEC only)
#     -> mic_aec -> VoIP TX
#
# PLAYBACK:
#   [HA media] ----------> speaker_player -> media_speaker_input --------+
#   [HA TTS, ringtone] --> speaker_player -> announcement_speaker_input -+
#   [VoIP RX] -----------------------------> voip_speaker_input ---------+
#                       (resamplers) -> audio_mixer 48 kHz mono -> hw_speaker
#                                     -> ES8311 -> NS4150 amp -> speaker
#   The NS4150 amp (PA_CTRL) is only on while audio plays; esp_audio_stack
#   on_amplifier_required / on_amplifier_idle switch it.
#
# Hardware [GUITION JC8012P4A1C_I_W_Y1]:
#   - ESP32-P4 (16MB flash, 32MB hex PSRAM), ESP32-C6 Wi-Fi over SDIO
#   - 10.1" 800x1280 MIPI-DSI (JD9365), landscape UI; GSL3680 touch (0x40)
#   - ES8311 codec (0x18), NS4150 amp (PA_CTRL GPIO20)
#   - OV02C10 2MP MIPI-CSI camera (0x36), RX8025T RTC (0x32)
#   - BOOT button GPIO35
#
# Touch UI:
#   Home page:     HA dashboard, Intercom card (VoIP), Frigate snapshots
#   Camera pages:  live RTSP, one camera per page (sidebar or tap a snapshot)
#   Settings page: sidebar Settings or swipe up; swipe down to return
#   Video call:    full-width remote video with a hang-up strip
#   BOOT button:   short press answers / calls / hangs up, long press mic mute

# =======PROJECT SETUP=========================================================

substitutions:
  name: guition-p4-101
  friendly_name: Guition P4 10.1

  ext_components_source: "github://n-IA-hane/esphome-intercom@main"
  voip_stack_components_source: "github://n-IA-hane/esphome-voip-stack@main"
  audio_stack_components_source: "github://n-IA-hane/esphome-audio-stack@main"
  assets_base: "https://github.com/n-IA-hane/esphome-intercom/raw/main/"
  images_base: "https://raw.githubusercontent.com/chickymonkey/guition-10.1-inch-esp32-p4/main/images/"

  # [GUITION] ES8311 ADC PGA sets hardware gain; this is the post-AEC user trim.
  mic_gain_min: "-20"
  mic_gain_max: "30"

  # Settings page widths for the 1280x800 landscape display.
  settings_row_width: "1180"
  settings_mid_width: "560"
  settings_control_width: "520"
  settings_row_height: "56"
  settings_dropdown_width: "340"
  settings_slider_height: "20"
  settings_switch_width: "70"
  settings_switch_height: "36"
  settings_label_font: font_body

  # [GUITION] SIP video for packages/voip/p4_video_jpeg.yaml. The OV02C10 runs
  # 1920x1080; the camera only downscales in exact 1/16 steps. 960x540 (1/2)
  # is the size that works: 1200x675 is rejected by the P4 video path
  # ("input width=1200, height=675 is not supported"), which then falls back
  # to full 1080p and runs out of buffer memory.
  p4_video_width: "960"
  p4_video_height: "540"
  p4_video_fps: "13"
  p4_camera_rotation: "0"
  p4_jpeg_quality: "10"
  p4_video_max_decode_width: "960"
  p4_video_max_decode_height: "960"

  # ---------------------------------------------------------------------------
  # Pinout: ESP32-C6 hosted Wi-Fi SDIO link
  # ---------------------------------------------------------------------------
  hosted_reset_pin: GPIO54
  hosted_cmd_pin: GPIO19
  hosted_clk_pin: GPIO18
  hosted_d0_pin: GPIO14
  hosted_d1_pin: GPIO15
  hosted_d2_pin: GPIO16
  hosted_d3_pin: GPIO17

  # ---------------------------------------------------------------------------
  # Pinout: shared codec/touch/camera I2C bus
  # ---------------------------------------------------------------------------
  codec_i2c_sda_pin: GPIO7
  codec_i2c_scl_pin: GPIO8

  # ---------------------------------------------------------------------------
  # Pinout: ES8311 I2S bus (MCLK/BCLK/LRCK shared, ASDOUT -> DIN, DSDIN <- DOUT)
  # ---------------------------------------------------------------------------
  i2s_mclk_pin: GPIO13
  i2s_bclk_pin: GPIO12
  i2s_lrclk_pin: GPIO10
  i2s_din_pin: GPIO11
  i2s_dout_pin: GPIO9

  # ---------------------------------------------------------------------------
  # Pinout: display, backlight, speaker amp and physical button
  # ---------------------------------------------------------------------------
  display_reset_pin: "27"
  display_backlight_pin: GPIO23   # [GUITION] LCD_PWM -> MP3202 EN
  speaker_enable_pin: GPIO20      # [GUITION] PA_CTRL -> NS4150 CTRL (high = on, per vendor BSP)
  boot_button_pin: GPIO35         # [GUITION] SW3 BOOTMODE, 10K pull-up

  # ---------------------------------------------------------------------------
  # Home Assistant entities shown on the home page
  # ---------------------------------------------------------------------------
  # Gas heater: the Rinnai Touch power and circulation fan switches.
  heater_power_switch: switch.rinnai_touch_on_off_switch
  heater_fan_switch: switch.rinnai_touch_circulation_fan_switch
  front_lock_entity: lock.frontdoor_aqara
  garage_lock_entity: lock.garagedoor_aqara
  # Garage roller door: position sensor (also gives Open/Closed), the "next
  # action" flags and its Up / Stop / Down buttons (same as the HA card).
  garage_position_entity: sensor.garage_roller_door_garage_position
  garage_next_up_entity: binary_sensor.garage_roller_door_garage_next_is_up
  garage_next_stop_entity: binary_sensor.garage_roller_door_garage_next_is_stop
  garage_next_down_entity: binary_sensor.garage_roller_door_garage_next_is_down
  garage_up_button: button.garage_roller_door_garage_up
  garage_stop_button: button.garage_roller_door_garage_stop
  garage_down_button: button.garage_roller_door_garage_down
  power_entity: sensor.powerpal_real_time_power             # in W
  # Daily energy meter (resets at midnight); its daily change is the 11:59 pm
  # reading. The Electricity bars show the last 14 days of it.
  energy_daily_entity: sensor.powerpal_daily_energy
  power_max_w: "6000"                         # full ring = 6 kW
  temp_living_entity: sensor.broadlink_livingroom_temperature
  temp_bedroom_entity: sensor.temp_bathroom_main_main_bathroom_temperature
  temp_outdoor_entity: sensor.bathroom_temp_and_humidity_temperature
  humidity_entity: sensor.temp_bathroom_main_main_bathroom_humidity
  # Status bar: current soil moisture plus the 9-10 am average of the last two
  # days (HA long-term statistics, so the sensor needs a state_class).
  soil_moisture_entity: sensor.current_soil_moisture
  # The sensor reports volumetric water content in m³/m³ (0.167 = 16.7 %);
  # values are multiplied by this to show a percentage. Use 1 for a % sensor.
  soil_moisture_scale: "100"
  scene_home_entity: scene.back_home
  scene_night_entity: scene.sleep
  scene_movie_entity: scene.movie_night
  scene_cat_away_entity: scene.cat_away
  # Lights card (bottom right): one toggle tile per light.
  light_tv_lamp_entity: light.tv_floor_lamp
  light_living_left_entity: light.living_room_left
  light_living_right_entity: light.living_room_right
  # Frigate "last person" snapshots for the home page camera tiles, fetched
  # from HA's image proxy. ha_base_url must be reachable from this device.
  ha_base_url: "http://homeassistant.local:8123"
  snapshot_front_entity: image.porchdahuafrigate_person
  snapshot_driveway_entity: image.garagecamera_person

# Shared packages: P4 base/hosted Wi-Fi, VoIP transport and settings, JPEG
# video path, audio controls and the ringtone playback components.
packages:
  p4_base: github://n-IA-hane/esphome-intercom/packages/platform/esp32p4_base.yaml@main
  p4_c6_sdio: github://n-IA-hane/esphome-intercom/packages/board/esp32p4_c6_sdio.yaml@main
  # ESP32-C6 co-processor firmware update entity (esp32_c6_coprocessor_update);
  # the status bar shows its installed version.
  p4_c6_update: github://n-IA-hane/esphome-intercom/packages/board/esp32p4_c6_update.yaml@main
  p4_diagnostics: github://n-IA-hane/esphome-intercom/packages/diagnostics/native_no_wifi_signal.yaml@main
  lvgl_p4_ppa: github://n-IA-hane/esphome-intercom/packages/lvgl/p4_ppa.yaml@main
  voip_transport: github://n-IA-hane/esphome-intercom/packages/voip/transport.yaml@main
  call_settings: github://n-IA-hane/esphome-intercom/packages/voip/call_settings.yaml@main
  call_buttons: github://n-IA-hane/esphome-intercom/packages/voip/call_buttons.yaml@main
  # Compile-time JPEG video: camera source, P4 decoder/renderer, Send Video switch.
  p4_video_jpeg: github://n-IA-hane/esphome-intercom/packages/voip/p4_video_jpeg.yaml@main
  # Writes the HA media route into p4_call_media_route_label / p4_video_media_route_label.
  call_media_route: github://n-IA-hane/esphome-intercom/packages/lvgl/p4_call_media_route.yaml@main
  audio_stack_controls: github://n-IA-hane/esphome-intercom/packages/esp_audio_stack/controls.yaml@main
  # Speaker media player: mixer + speaker_source components and the FLAC
  # (HA's preferred format), MP3 and WAV decoders. The amplifier is switched by
  # the esp_audio_stack amplifier hooks below, not by the speaker_power_output package.
  playback_compat: github://n-IA-hane/esphome-intercom/packages/media_player/playback_compat.yaml@main
  http_media_codecs: github://n-IA-hane/esphome-intercom/packages/audio/http_media_codecs.yaml@main
  flac_codecs_psram: github://n-IA-hane/esphome-intercom/packages/audio/flac_codecs_psram.yaml@main

# =======BOARD AND MEMORY======================================================

esphome:
  min_version: 2026.9.0
  name: ${name}
  friendly_name: ${friendly_name}
  build_path: .esphome/build/guition-p4-voip-dashboard
  on_boot:
    - priority: 200
      then:
        - lambda: id(peer_name) = id(phone).get_current_destination();
    - priority: -100
      then:
        - script.execute: backlight_timer     # sets the saved Screen Brightness
        - script.execute: home_return_timer
        # Amp off until a call, ring or playback needs it (idle amp = hiss/squeal).
        - output.turn_off: speaker_enable
        # Start at 70 % master volume on every boot (the number would otherwise
        # restore the last saved level, 100 % by default).
        - number.set:
            id: master_volume
            value: 70

psram:
  mode: hex
  speed: 200MHz

# MIPI DSI PHY requires 2.5V from internal LDO channel 3
esp_ldo:
  - channel: 3
    voltage: 2.5V

# [GUITION] Production ESP32-P4 silicon (chip revision v3.x). The p4_base
# package sets board esp32-p4-evboard, which ESPHome treats as a pre-v3
# engineering sample; that firmware is not binary compatible with v3.x and
# crashes at boot. Boot log shows "chip revision: vX.Y" if unsure; for a
# pre-v3 board use board: esp32-p4-evboard and engineering_sample: true.
# The sdkconfig option allows interrupts between large video cache-writeback
# chunks.
esp32:
  board: esp32-p4_r3-evboard
  engineering_sample: false
  flash_size: 16MB
  partitions: partitions16mb.csv
  framework:
    sdkconfig_options:
      CONFIG_ESP_MM_CACHE_MSYNC_C2M_CHUNKED_OPS: "y"
    advanced:
      execute_from_psram: true
      compiler_optimization: "PERF"

# =======EXTERNAL COMPONENTS===================================================

external_components:
  - source: ${voip_stack_components_source}
    components: [voip_stack]
  - source: ${ext_components_source}
    components: [speaker]
  # [GUITION] The intercom fork's mipi_dsi (needed by p4_video_renderer), patched
  # for ESP32-P4 v3.x silicon. See components/mipi_dsi/UPSTREAM.md.
  # gsl3680: JC8012P4A1C touch driver (see components/gsl3680).
  - source: github://chickymonkey/guition-10.1-inch-esp32-p4@main
    components: [mipi_dsi, gsl3680]
    refresh: 1d
  # [GUITION] OV02C10 sensor driver (auto-detected by esp_video_camera, which
  # comes from the p4_video_jpeg package).
  - source: github://chickymonkey/camera_OV02C10_component@main
    components: [ov02c10]
    refresh: 1d
  - source: ${audio_stack_components_source}
    components: [esp_audio_stack, esp_aec]
  ##RTSP stream
  - source: github://chickymonkey/Esp-rtsp-stream
    components: [esp_rtsp_stream]
    refresh: 1d

# Live RTSP feeds, only on the two camera pages (the home page shows Frigate
# snapshots instead). A stream only connects while its canvas is on screen
# and drops ~3 s after it is hidden, so at most one camera streams at a time.
# The URLs come from Home Assistant (cam_url / cam_url_driveway text sensors).
esp_rtsp_stream:
  - id: front_door_full
    username: viewer                   # default login when the URL has none
    password: !secret camera_password
    lvgl_canvas: cam_front_full_canvas
    max_fps: 10
    max_frame_size: 262144             # bytes per JPEG frame
    log_frame_info: true               # fps/decode stats every 30 s
  - id: driveway_full
    username: viewer
    password: !secret camera_password
    lvgl_canvas: cam_driveway_full_canvas
    max_fps: 10
    max_frame_size: 262144
    log_frame_info: true

# Home page camera tiles: the latest Frigate person snapshot from Home
# Assistant's image entities, downloaded through HA's image proxy whenever the
# entity updates (see the snapshot text sensors and the online_image entries
# in image: below).
http_request:
  verify_ssl: false
  timeout: 10s

# =======CONNECTIVITY==========================================================

network:
  # Keep lwIP conservative on hosted P4+C6: internal DMA heap is the limit.
  enable_high_performance: false

# WiFi via ESP32-C6 co-processor (SDIO)
esp32_hosted:
  variant: ESP32C6
  use_psram: true
  reset_pin: ${hosted_reset_pin}
  cmd_pin: ${hosted_cmd_pin}
  clk_pin: ${hosted_clk_pin}
  d0_pin: ${hosted_d0_pin}
  d1_pin: ${hosted_d1_pin}
  d2_pin: ${hosted_d2_pin}
  d3_pin: ${hosted_d3_pin}
  active_high: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 10min
  fast_connect: false
  on_connect:
    - logger.log: "WiFi connected"
  on_disconnect:
    - logger.log: "WiFi disconnected"

# Home Assistant native API: entity state, service actions and the central
# phonebook used by voip_stack.
api:
  custom_services: true
  reboot_timeout: 15min
  on_client_connected:
    - script.execute: update_call_tile
    - script.execute: update_status_bar
    - delay: 5s
    - script.execute: fetch_energy_history
    - script.execute: fetch_soil_history

# OTA pauses audio, VoIP and LVGL so the flash write has the bus to itself.
ota:
  - platform: esphome
    on_begin:
      - script.stop: voip_ringing_loop
      - voip_stack.stop:
      - esp_audio_stack.stop:
      - wait_until:
          condition:
            esp_audio_stack.is_idle:
          timeout: 2s
      - lvgl.pause:
          show_snow: false
    on_abort:
      - lvgl.resume:
      - esp_audio_stack.start:
    on_error:
      - lvgl.resume:
      - esp_audio_stack.start:

logger:
  hardware_uart: USB_SERIAL_JTAG   # [GUITION] USB-C
  level: INFO                     # DEBUG for troubleshooting; back to INFO when done
  logs:
    esp_audio_stack: WARN
    touchscreen: WARN
    gsl3670: WARN
    i2c: WARN
    lvgl: WARN
    online_image: INFO
    http_request: INFO
    homeassistant: INFO
    voip_stack: INFO
    voip_stack.fsm: INFO
    voip_stack.tcp: INFO
    voip_stack.udp: INFO
    voip_stack.audio: INFO
    voip_stack.settings: INFO
    sensor: WARN
    text_sensor: WARN
    binary_sensor: WARN
    switch: WARN
    number: WARN
    button: WARN
    api: WARN
    api.connection: WARN
    component: WARN

preferences:
  flash_write_interval: 5min

time:
  - platform: homeassistant
    id: my_time
    timezone: Australia/Sydney
    # Show the clock as soon as the time is known, not at the next 45 s tick.
    on_time_sync:
      - script.execute: update_clock
    on_time:
      # Just after midnight yesterday's total is final: refresh the 14 bars.
      - seconds: 0
        minutes: 5
        hours: 0
        then:
          - script.execute: fetch_energy_history
      # New day: shift the soil history (yesterday's 9-10 am hour is final).
      - seconds: 0
        minutes: 10
        hours: 0
        then:
          - script.execute: fetch_soil_history

# =======BUSES AND CAMERA======================================================

i2c:
  - id: internal_i2c
    sda: ${codec_i2c_sda_pin}
    scl: ${codec_i2c_scl_pin}
    frequency: 400kHz
    scan: true                     # DEBUG: boot log lists 0x18 codec, 0x32 RTC, 0x36 camera, 0x40 touch

# [GUITION] OV02C10 on the 15-pin CSI connector: 1-lane 1920x1080 RAW10 mode,
# no XCLK/reset/power-down lines.
ov02c10:
  lanes: 1

# Merged with the p4_video_jpeg package's esp_video_camera (resolution, fps,
# rotation and quality come from the p4_video_* substitutions above).
esp_video_camera:
  id: p4_camera
  buffer_count: 2
  enable_xclk: false
  # Not exposed to Home Assistant: HA polling the "P4 Camera" entity kept the
  # sensor capturing all the time. It now only runs for VoIP video; the
  # "Camera" switch shows and controls that.
  #internal: true

# =======OUTPUTS AND LIGHTS====================================================

output:
  - platform: ledc
    id: backlight_pwm
    pin: ${display_backlight_pin}
    inverted: false       # [GUITION] LCD_PWM high = MP3202 enabled
    frequency: 1000Hz

  - platform: gpio
    id: speaker_enable
    pin: ${speaker_enable_pin}

light:
  - platform: monochromatic
    id: display_backlight
    name: "Display Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# =======AUDIO PIPELINE========================================================

# [GUITION] ES8311 is both DAC and ADC. The single analog microphone is on
# MIC1P/N. With no_dac_ref: false the codec returns its own DAC output on the
# right ADC channel as a sample-aligned AEC reference.
esp_audio_stack:
  # Core 0: esp_aec runs inside this task, and on core 1 it starved the
  # ESPHome loop (LVGL + touch), which is pinned to core 1.
  task_core: 0
  # DEBUG: per-frame timing and AEC load every 128 frames (logger DEBUG).
  telemetry: true
  telemetry_log_interval_frames: 128
  audio_task_stack_in_psram: true
  buffers_in_psram: true
  i2s_lrclk_pin: ${i2s_lrclk_pin}
  i2s_bclk_pin: ${i2s_bclk_pin}
  i2s_mclk_pin: ${i2s_mclk_pin}
  i2s_din_pin: ${i2s_din_pin}   # ES8311 ASDOUT (mic + DAC reference)
  i2s_dout_pin: ${i2s_dout_pin} # ES8311 DSDIN (speaker)
  sample_rate: 48000
  output_sample_rate: 16000
  processor_id: aec_processor
  audio_effects:
    rate_cvt_complexity: 3
    rate_cvt_perf_type: speed
  num_channels: 2
  codec:
    i2c_id: internal_i2c
    input:
      type: es8311
      address: 0x18
      gain_db: 24.0
      use_mclk: true
      no_dac_ref: false
    output:
      type: es8311
      address: 0x18
      use_mclk: true
      no_dac_ref: false
  use_stereo_aec_reference: true
  reference_channel: right
  aec_reference_buffer_ms: 50 # microphone is about 
  # NS4150 amp follows the real speaker stream (VoIP RX, ringtone, media),
  # as in the upstream boards: on when audio starts, off 2 s after it stops.
  on_amplifier_required:
    - script.stop: speaker_amp_idle_off
    - if:
        condition:
          switch.is_off: speaker_mute
        then:
          - output.turn_on: speaker_enable
  on_amplifier_idle:
    - script.execute: speaker_amp_idle_off

# Standalone echo cancellation. Lighter than the S3 Box setting
# (fd_high_perf / 8); raise again only if the telemetry shows headroom.
esp_aec:
  id: aec_processor
  sample_rate: 16000
  filter_length: 4
  mode: fd_low_cost

microphone:
  - platform: esp_audio_stack
    id: mic_aec

speaker:
  - platform: esp_audio_stack
    id: hw_speaker
    sample_rate: 48000
    bits_per_sample: 16
    timeout: 1s
    buffer_duration: 128ms

  # 3-source mixer: media + announcements/ringtone + VoIP
  - platform: mixer
    id: audio_mixer
    output_speaker: hw_speaker
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      - id: media_mixer_input        # HA media (music, radio)
        timeout: 10s
        buffer_duration: 100ms
      - id: announcement_mixer_input # HA TTS/announcements and the ringtone
        timeout: 10s
        buffer_duration: 100ms
      - id: voip_mixer_input
        timeout: 10s
        buffer_duration: 128ms

  - platform: resampler
    id: media_speaker_input
    output_speaker: media_mixer_input
    task_stack_in_psram: true

  - platform: resampler
    id: announcement_speaker_input
    output_speaker: announcement_mixer_input
    task_stack_in_psram: true

  - platform: resampler
    id: voip_speaker_input           # VoIP RX to 48kHz
    output_speaker: voip_mixer_input
    task_stack_in_psram: true
    buffer_duration: 128ms

# Ringtone: a local FLAC file played on the announcement pipeline.
audio_file:
  - id: voip_ringing_sound
    file: ${assets_base}assets/sounds/ringtone.flac

media_source:
  - platform: audio_http
    id: media_http_source
    buffer_size: 65536
    task_stack_in_psram: true
  - platform: audio_http
    id: announcement_http_source
    buffer_size: 65536
    task_stack_in_psram: true
  - platform: audio_file
    id: ringtone_file_source
    task_stack_in_psram: true

# "Speaker" media player in Home Assistant: media, TTS and announcements. The
# ringtone also plays through its announcement pipeline. Volume here is the
# software layer; Master Volume drives the ES8311 DAC.
media_player:
  - platform: speaker_source
    id: speaker_player
    name: Speaker
    volume_initial: 100%
    volume_min: 0%
    volume_max: 100%
    volume_increment: 5%
    media_pipeline:
      num_channels: 1
      speaker: media_speaker_input
      format: FLAC
      sample_rate: 48000
      sources:
        - media_http_source
    announcement_pipeline:
      num_channels: 1
      speaker: announcement_speaker_input
      format: FLAC
      sample_rate: 48000
      sources:
        - announcement_http_source
        - ringtone_file_source

# =======VOIP==================================================================

voip_stack:
  use_ha_as_first_contact: true
  id: phone
  task_stacks_in_psram: true
  audio_task_stacks_in_psram: true
  buffers_in_psram: false
  audio:
    tx:
      sample_rate: 16000
      pcm_format: s16le
      channels: 1
      frame_ms: 10
    tx_formats:
      - sample_rate: 16000
        pcm_format: s16le
        channels: 1
        frame_ms: 16
    rx:
      sample_rate: 48000
      pcm_format: s16le
      channels: 1
      frame_ms: 10
    rx_formats:
      - sample_rate: 16000
        pcm_format: s16le
        channels: 1
        frame_ms: 10
      - sample_rate: 32000
        pcm_format: s16le
        channels: 1
        frame_ms: 16
      - sample_rate: 16000
        pcm_format: s16le
        channels: 1
        frame_ms: 16
      - sample_rate: 16000
        pcm_format: s16le
        channels: 1
        frame_ms: 32
  microphone: mic_aec          # Post-AEC: no echo in transmitted audio
  speaker: voip_speaker_input
  ringing_timeout: 30s
  delete_contact_missing_from:
    updates_number: 1

  on_calling:
    - lambda: id(peer_name) = peer;
    - lvgl.label.update:
        id: call_ringing_out_status_label
        text: "CALLING"
    - script.execute: backlight_timer
    - script.execute: update_call_tile

  on_dest_ringing:
    - lambda: id(peer_name) = peer;
    - lvgl.label.update:
        id: call_ringing_out_status_label
        text: "RINGING"
    - script.execute: update_call_tile

  on_ringing:
    - lambda: id(peer_name) = peer;
    - script.execute: backlight_timer
    - script.execute: show_phone_page
    - script.execute: voip_start_ringtone

  on_in_call:
    - lambda: id(peer_name) = peer;
    - script.execute: voip_stop_ringtone
    - script.execute: update_call_tile

  on_idle:
    - script.execute: voip_stop_ringtone
    - script.execute: show_phone_page

  on_hangup:
    - script.execute: voip_stop_ringtone
    - script.execute:
        id: show_call_ended
        peer: !lambda 'return peer;'
        reason: !lambda 'return reason;'

  on_call_failed:
    - script.execute: voip_stop_ringtone
    - script.execute:
        id: show_call_ended
        peer: !lambda 'return peer;'
        reason: !lambda 'return reason;'

  on_phonebook_update:
    - lambda: id(peer_name) = destination;
    - script.execute: update_ic_idle_labels

  on_destination_changed:
    - lambda: id(peer_name) = destination;
    - script.execute: update_ic_idle_labels

# =======DISPLAY AND UI========================================================

# [GUITION] JD9365 panel. "New Panel" boards use JC8012P4A1-V2 (70 MHz /
# 1.5 Gbps); the original panel is JC8012P4A1 (60 MHz / 1 Gbps).
display:
  - platform: mipi_dsi
    id: main_display
    model: JC8012P4A1-V2
    reset_pin: ${display_reset_pin} # GPIO27
    update_interval: never
    auto_clear_enabled: false

# [GUITION] GSL3680 touch controller, JC8012P4A1C ("New Panel 2026"). Our
# gsl3680 component (port of guition-jc/esp_lcd_touch_gsl3680) loads Guition's
# own controller firmware, maps sensor to panel coordinates, tracks/smooths
# contacts and ignores failed reads on the shared I2C bus instead of treating
# them as a release. Polled; reset is GPIO22 by default.
touchscreen:
  - platform: gsl3680
    id: main_touch
    i2c_id: internal_i2c
    display: main_display
    on_touch:
      # DEBUG: confirms the controller reports touches at all.
      - logger.log:
          level: DEBUG
          tag: touch
          format: "Touch x=%d y=%d"
          args: ['touch.x', 'touch.y']
      # Any touch counts as activity: wake the backlight (backlight_timer sets
      # the chosen brightness) and restart the return-to-home countdown.
      - script.execute: backlight_timer
      - script.execute: home_return_timer

